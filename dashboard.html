<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Business Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 40px; background-color: #f8f9fa; color: #333;
        }
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px;
        }
        h1 { margin: 0; color: #2c3e50; }
        .user-info { text-align: right; }
        
        .logout-btn { 
            background-color: #e74c3c; color: white; border: none; padding: 8px 15px; 
            border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px;
        }
        .logout-btn:hover { background-color: #c0392b; }

        .menu-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; 
        }
        
        .card { 
            background: white; padding: 40px 20px; border-radius: 12px; text-align: center; 
            text-decoration: none; color: #2c3e50; font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: all 0.3s ease; border: 1px solid #efefef;
        }
        .card:hover { 
            transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); border-color: #3498db; 
        }
        
        #adminMenu { display: none; background-color: #fff5f5; border: 1px dashed #ff7675; }
        #adminMenu:hover { border-style: solid; background-color: #ffeaea; }
        .admin-text { color: #d63031; font-size: 1.1rem; }

        /* ส่วนแสดงสถานะด่วน */
        .status-summary {
            background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Business Portal</h1>
            <p>ระบบจัดการหลังบ้านบริษัท</p>
        </div>
        <div class="user-info">
            <p>ยินดีต้อนรับ: <strong id="displayName">กำลังโหลด...</strong></p>
            <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
        </div>
    </div>

    <div class="status-summary" id="statusSummary">
        <strong>สถานะเพื่อนร่วมงานวันนี้:</strong> กำลังโหลดข้อมูล...
    </div>

    <div class="menu-grid">
        <a href="checkin.html" class="card">
            <div>📍 Check-in /ลงเวลาเข้างาน</div>
        </a>
        
        <a href="#" class="card">
            <div>💰 แจ้งเบิกค่าใช้จ่าย</div>
        </a>
        
        <a href="#" class="card">
            <div>📄 PDF to JPG Converter</div>
        </a>

        <a href="admin.html" id="adminMenu" class="card">
            <div class="admin-text">⚙️ ระบบจัดการผู้ใช้งาน & รายงาน (Admin)</div>
        </a>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmZ7PtLEt3ESXpAl3n8i_zoYiOxd4zIMB6TgA5mriTR1FECeGrZR-lWfIbRWpPD3l3bg/exec";

        window.onload = function() {
            const isLoggedIn = sessionStorage.getItem("isLoggedIn");
            const role = sessionStorage.getItem("userRole");
            const name = sessionStorage.getItem("userName");

            if (isLoggedIn !== "true") {
                window.location.href = "index.html"; 
                return;
            }

            document.getElementById("displayName").innerText = name ? name : "User";

            if (role && role.trim().toLowerCase() === "admin") {
                document.getElementById("adminMenu").style.display = "block";
            }

            // เรียกโหลดสถานะเพื่อนร่วมงาน (โจทย์ข้อ 4)
            fetchColleagueStatus();
        };

        async function fetchColleagueStatus() {
            try {
                const response = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: "fetchData" }) 
                });
                const data = await response.json();
                
                const today = new Date().toLocaleDateString();
                // กรองเฉพาะ Check-in ของวันนี้
                const onlineUsers = data.filter(d => d.Date === today && d.Type === "Check In");
                
                const summaryDiv = document.getElementById("statusSummary");
                if (onlineUsers.length > 0) {
                    const names = onlineUsers.map(u => `${u.Name} (${u.Location})`).join(", ");
                    summaryDiv.innerHTML = `<strong>วันนี้มีคนเข้างานแล้ว:</strong> ${names}`;
                } else {
                    summaryDiv.innerHTML = `<strong>วันนี้ยังไม่มีใคร Check-in</strong>`;
                }
            } catch (e) {
                document.getElementById("statusSummary").innerHTML = ""; // ถ้าโหลดไม่ได้ก็ซ่อนไปก่อน
            }
        }

        function logout() {
            if (confirm("คุณต้องการออกจากระบบใช่หรือไม่?")) {
                sessionStorage.clear();
                window.location.href = "index.html";
            }
        }
    </script>

</body>
</html>
