<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ปฏิทินงานและวันหยุด | CubicPlus Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3' } },
                    animation: {
                        blob: "blob 7s infinite",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #f8fafc;
            color: #334155; 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        
        /* Modern Glassmorphism */
        .glass-card { 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05); 
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }
        @media (min-width: 768px) {
            .glass-card { border-radius: 2rem; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }

        .swal2-popup { font-family: 'Kanit', sans-serif !important; border-radius: 1.5rem !important; backdrop-filter: blur(10px); }

        /* Calendar Grid Responsive */
        .calendar-grid { 
            display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; 
            min-width: 300px;
        }
        @media (min-width: 768px) {
            .calendar-grid { gap: 8px; }
        }

        .day-cell {
            min-height: 85px; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 6px 4px; border-radius: 0.75rem; border: 1px solid rgba(226, 232, 240, 0.5); 
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; overflow: hidden;
        }
        @media (min-width: 768px) {
            .day-cell { min-height: 110px; padding: 8px; border-radius: 1rem; }
            .day-cell:hover:not(.empty) { 
                background: #ffffff;
                border-color: #c7d2fe; 
                box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.1); 
                transform: translateY(-3px); 
                z-index: 10;
            }
        }
        .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }

        .date-num { 
            font-size: 0.9rem; font-weight: 600; color: #64748b; line-height: 1; margin-bottom: 4px; 
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
            transition: all 0.2s;
        }
        @media (min-width: 768px) { .date-num { font-size: 1.1rem; width: 30px; height: 30px; } }
        
        /* Today Highlight */
        .day-cell.today { 
            background: linear-gradient(135deg, rgba(238, 242, 255, 0.8) 0%, rgba(255, 255, 255, 0.9) 100%); 
            border: 1.5px solid #818cf8; 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
        }
        .day-cell.today .date-num { 
            background: #4f46e5; color: #ffffff; font-weight: 700; shadow: 0 2px 4px rgba(79, 70, 229, 0.3);
        }
        
        /* Event Tags - Soft Style */
        .tag-container { display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 0 2px; margin-top: 2px; }
        .tag-label { 
            font-size: 9px; font-weight: 500; padding: 3px 6px; border-radius: 6px; width: 100%; 
            text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2;
            transition: all 0.2s;
        }
        @media (min-width: 768px) {
            .tag-label { font-size: 11px; text-align: left; padding: 4px 8px; }
            .day-cell:hover .tag-label { transform: scale(1.02); }
        }
        
        /* Theme Colors with soft opacity borders */
        .tag-holiday { background: rgba(255, 228, 230, 0.7); color: #e11d48; border: 1px solid rgba(225, 29, 72, 0.15); }
        .tag-company { background: rgba(204, 251, 241, 0.7); color: #0d9488; border: 1px solid rgba(13, 148, 136, 0.15); }
        .tag-event { background: rgba(243, 232, 255, 0.7); color: #9333ea; border: 1px solid rgba(147, 51, 234, 0.15); }
        .tag-leave { background: rgba(254, 243, 199, 0.7); color: #d97706; border: 1px solid rgba(217, 119, 6, 0.15); }

        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Animation delays for list items */
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
    </style>
</head>
<body class="p-3 md:p-8 lg:p-12 relative z-0">

    <!-- Animated Background Blobs -->
    <div class="fixed inset-0 z-[-1] overflow-hidden bg-slate-50">
        <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-indigo-200 rounded-full mix-blend-multiply filter blur-[100px] opacity-60 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-[30rem] h-[30rem] bg-teal-200 rounded-full mix-blend-multiply filter blur-[100px] opacity-60 animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[30rem] h-[30rem] bg-purple-200 rounded-full mix-blend-multiply filter blur-[100px] opacity-60 animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <!-- Loader -->
    <div id="loader" class="fixed inset-0 z-[999] bg-white/60 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative flex h-24 w-24 mb-6">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-300 opacity-60"></span>
          <span class="relative inline-flex rounded-full h-24 w-24 bg-gradient-to-tr from-primary-600 to-indigo-400 flex items-center justify-center shadow-xl shadow-primary-500/30">
              <i data-lucide="calendar-days" class="w-12 h-12 text-white animate-pulse"></i>
          </span>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">กำลังซิงค์ข้อมูลปฏิทิน</h2>
        <p class="text-slate-500 font-medium mt-2 flex items-center gap-2">
            Cubic<span class="text-primary-600 font-bold">Plus</span> System
            <span class="flex space-x-1">
                <span class="w-1.5 h-1.5 bg-primary-400 rounded-full animate-bounce"></span>
                <span class="w-1.5 h-1.5 bg-primary-400 rounded-full animate-bounce delay-100"></span>
                <span class="w-1.5 h-1.5 bg-primary-400 rounded-full animate-bounce delay-200"></span>
            </span>
        </p>
    </div>

    <!-- Header -->
    <div class="max-w-[1400px] mx-auto mb-8 md:mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 md:gap-6 fade-in">
        <div class="relative">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-slate-800 drop-shadow-sm">ปฏิทิน<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-600 to-teal-500">งานและวันหยุด</span></h1>
            <div class="flex items-center gap-2 mt-2 md:mt-3 bg-white/50 w-max px-3 py-1.5 rounded-full border border-white shadow-sm">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <p class="text-slate-600 font-semibold text-[10px] md:text-xs tracking-widest uppercase">CubicPlus Portal <span id="currentYearDisplay" class="text-primary-600"></span></p>
            </div>
        </div>
        
        <div class="flex flex-wrap gap-3 w-full md:w-auto" id="headerButtons">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8 fade-in delay-100">
        
        <!-- Left: Calendar -->
        <div class="lg:col-span-8 flex flex-col gap-4">
            <div class="glass-card p-5 md:p-8 flex-1 flex flex-col relative">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 relative z-10">
                    <h2 id="monthYearTitle" class="text-2xl md:text-4xl font-extrabold text-slate-800 tracking-tight"></h2>
                    <div class="flex items-center gap-1 md:gap-2 bg-white/80 backdrop-blur-sm p-1.5 rounded-2xl border border-slate-200/60 shadow-sm w-full sm:w-auto justify-between sm:justify-start transition-all hover:shadow-md">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 hover:text-primary-600 rounded-xl transition-all text-slate-500"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                        <button onclick="goToToday()" class="px-5 py-2 font-bold text-sm text-slate-600 hover:text-primary-600 hover:bg-primary-50 rounded-xl transition-colors">วันนี้</button>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 hover:text-primary-600 rounded-xl transition-all text-slate-500"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                    </div>
                </div>

                <div class="grid grid-cols-7 gap-1 md:gap-2 mb-3 text-center relative z-10">
                    <div class="text-[10px] md:text-sm font-bold text-rose-500 uppercase tracking-wide">อา.</div>
                    <div class="text-[10px] md:text-sm font-bold text-slate-500 uppercase tracking-wide">จ.</div>
                    <div class="text-[10px] md:text-sm font-bold text-slate-500 uppercase tracking-wide">อ.</div>
                    <div class="text-[10px] md:text-sm font-bold text-slate-500 uppercase tracking-wide">พ.</div>
                    <div class="text-[10px] md:text-sm font-bold text-slate-500 uppercase tracking-wide">พฤ.</div>
                    <div class="text-[10px] md:text-sm font-bold text-slate-500 uppercase tracking-wide">ศ.</div>
                    <div class="text-[10px] md:text-sm font-bold text-primary-500 uppercase tracking-wide">ส.</div>
                </div>

                <div id="calendarGrid" class="calendar-grid flex-1 relative z-10"></div>

                <div class="mt-8 flex flex-wrap items-center justify-center md:justify-start gap-4 pt-5 border-t border-slate-200/50 relative z-10">
                    <div class="flex items-center gap-2 bg-rose-50/50 px-3 py-1.5 rounded-lg border border-rose-100"><div class="w-3 h-3 rounded-full bg-rose-400 shadow-sm"></div><span class="text-[11px] md:text-xs font-semibold text-slate-600">วันหยุดราชการ</span></div>
                    <div class="flex items-center gap-2 bg-teal-50/50 px-3 py-1.5 rounded-lg border border-teal-100"><div class="w-3 h-3 rounded-full bg-teal-400 shadow-sm"></div><span class="text-[11px] md:text-xs font-semibold text-slate-600">หยุดบริษัท</span></div>
                    <div class="flex items-center gap-2 bg-purple-50/50 px-3 py-1.5 rounded-lg border border-purple-100"><div class="w-3 h-3 rounded-full bg-purple-400 shadow-sm"></div><span class="text-[11px] md:text-xs font-semibold text-slate-600">งาน</span></div>
                    <div class="flex items-center gap-2 bg-amber-50/50 px-3 py-1.5 rounded-lg border border-amber-100"><div class="w-3 h-3 rounded-full bg-amber-400 shadow-sm"></div><span class="text-[11px] md:text-xs font-semibold text-slate-600">วันลา</span></div>
                </div>
            </div>
        </div>

        <!-- Right: Upcoming Events/Holidays -->
        <div class="lg:col-span-4 flex flex-col gap-4">
            <div class="glass-card p-5 md:p-8 flex-1 flex flex-col max-h-[600px] md:max-h-[850px]">
                <h3 class="text-xl md:text-2xl font-bold text-slate-800 flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-100 to-orange-100 text-amber-600 flex items-center justify-center border border-amber-200/50 shadow-sm shrink-0">
                        <i data-lucide="bell-ring" class="w-5 h-5"></i>
                    </div>
                    สิ่งที่กำลังจะมาถึง
                </h3>

                <div id="upcomingList" class="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3 md:space-y-4">
                    <!-- JS Injected -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. System Setup & Context ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw--QomM7YbG9bvjsB5wGBDpX8jd4eWULZNe2AnRNPNo75S1U93Y67IchEkzwlZZ4rOIw/exec"; 
        
        const username = sessionStorage.getItem("userLoginName") || "Natiphol"; 
        const userRole = sessionStorage.getItem("userRole") || "Admin"; 
        
        const isAdmin = String(userRole).trim().toLowerCase() === "admin";
        
        let actualToday = new Date(); 
        let currentMonth = actualToday.getMonth();
        let currentYear = actualToday.getFullYear();
        const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

        let holidaysDB = [];
        let eventsDB = [];
        let myLeavesDB = [];
        let usersListDB = []; 

        function safeDateFormat(dateObjOrString) {
            if (!dateObjOrString) return "";
            try {
                const dateObj = new Date(dateObjOrString);
                return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
            } catch (e) {
                return dateObjOrString.toString().split('T')[0];
            }
        }

        window.onload = async function() {
            lucide.createIcons();
            setupHeaderButtons();
            
            await Promise.all([fetchAllDataFromAPI(), fetchUsersList()]);

            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                renderCalendar();
                renderUpcomingList();
            }, 600);
        };

        // --- Fetch API ---
        async function fetchAllDataFromAPI() {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "fetchCalendarData", 
                        username: username,
                        role: userRole 
                    })
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    holidaysDB = (result.holidays || []).map(h => ({...h, date: safeDateFormat(h.date)}));
                    eventsDB = (result.events || []).map(e => ({...e, date: safeDateFormat(e.date)}));
                    myLeavesDB = (result.myLeaves || []).map(l => ({
                        ...l,
                        startDate: safeDateFormat(l.startDate),
                        endDate: safeDateFormat(l.endDate)
                    }));
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลจากเซิร์ฟเวอร์ได้ ลองรีเฟรชหน้าใหม่อีกครั้ง', 'error');
            }
        }

        async function fetchUsersList() {
            if (!isAdmin) return;
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "fetchUsersList" })
                });
                const result = await response.json();
                if (result.status === "success") {
                    usersListDB = result.users || [];
                }
            } catch (error) {
                console.error("Fetch Users Error:", error);
            }
        }

        function setupHeaderButtons() {
            const btnContainer = document.getElementById('headerButtons');
            let html = `<button onclick="location.href='dashboard.html'" class="flex-1 md:flex-none justify-center flex items-center gap-2 px-5 py-3 bg-white/80 backdrop-blur-sm border border-slate-200/80 rounded-2xl text-slate-600 font-bold text-sm hover:text-primary-600 hover:bg-white hover:shadow-lg hover:-translate-y-0.5 transition-all active:scale-95"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> แดชบอร์ด</button>`;
            
            if (isAdmin) {
                html += `<button onclick="location.href='admin.html'" class="flex-1 md:flex-none justify-center flex items-center gap-2 px-5 py-3 bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl text-white font-bold text-sm hover:shadow-lg hover:shadow-slate-500/30 hover:-translate-y-0.5 transition-all active:scale-95"><i data-lucide="shield-check" class="w-4 h-4"></i> ระบบ Admin</button>`;
            }
            btnContainer.innerHTML = html;
        }

        // --- 4. Render Engine ---
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            document.getElementById('monthYearTitle').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            document.getElementById('currentYearDisplay').innerText = currentYear;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="day-cell empty"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateString = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const cell = document.createElement('div');
                cell.className = 'day-cell group';
                
                if (i === actualToday.getDate() && currentMonth === actualToday.getMonth() && currentYear === actualToday.getFullYear()) {
                    cell.classList.add('today');
                }

                const dayHolidays = holidaysDB.filter(h => h.date === dateString);
                const dayEvents = eventsDB.filter(e => e.date === dateString && (isAdmin || e.username === username || !e.username || e.username === 'All'));
                const dayLeaves = myLeavesDB.filter(l => isDateInRange(dateString, l.startDate, l.endDate));

                let tagsHtml = '';

                dayHolidays.forEach(h => {
                    const tClass = h.type === 'company' ? 'tag-company' : 'tag-holiday';
                    tagsHtml += `<div class="tag-label ${tClass}">${h.name}</div>`;
                });

                dayEvents.forEach(e => {
                    tagsHtml += `<div class="tag-label tag-event">${e.name}</div>`;
                });

                dayLeaves.forEach(l => {
                    const statusIcon = l.status === 'รออนุมัติ' ? '⏳ ' : '';
                    const shortName = l.name ? String(l.name).split(' ')[0] : (l.username || 'พนักงาน');
                    const labelText = isAdmin ? `${shortName} ลา` : l.type;
                    
                    tagsHtml += `<div class="tag-label tag-leave" title="${l.name}: ${l.type} (${l.status})">${statusIcon}${labelText}</div>`;
                });

                cell.innerHTML = `<span class="date-num">${i}</span><div class="tag-container">${tagsHtml}</div>`;
                
                cell.onclick = () => handleDayClick(dateString, dayHolidays, dayEvents, dayLeaves);
                grid.appendChild(cell);
            }
            lucide.createIcons();
        }

        function renderUpcomingList() {
            const list = document.getElementById('upcomingList');
            list.innerHTML = '';

            const todayStr = `${actualToday.getFullYear()}-${String(actualToday.getMonth() + 1).padStart(2, '0')}-${String(actualToday.getDate()).padStart(2, '0')}`;
            
            const filteredEvents = eventsDB.filter(e => isAdmin || e.username === username || !e.username || e.username === 'All');
            
            const upcomingLeaves = myLeavesDB.filter(l => l.startDate >= todayStr).map(l => ({
                id: l.id,
                date: l.startDate,
                name: isAdmin ? `${l.name || l.username} (${l.type})` : `วัน${l.type}ของคุณ`,
                type: 'leave',
                detail: `สถานะ: ${l.status}\nตั้งแต่วันที่ ${formatThaiDateFull(l.startDate)} ถึง ${formatThaiDateFull(l.endDate)}`,
                mapUrl: ''
            }));

            let combined = [...holidaysDB, ...filteredEvents, ...upcomingLeaves].filter(item => item.date >= todayStr);
            combined.sort((a, b) => new Date(a.date) - new Date(b.date)); 

            if (combined.length === 0) {
                list.innerHTML = `<div class="text-center p-8 text-slate-400 bg-white/50 border border-slate-100/50 rounded-2xl text-sm font-medium">ไม่มีรายการเร็วๆ นี้ 🏖️</div>`;
                return;
            }

            combined.slice(0, 10).forEach((item) => {
                let icon = 'calendar-check-2', bgClass = 'bg-white', iconClass = 'bg-slate-100 text-slate-500', titleClass = 'text-slate-700', badge = '';
                
                if (item.type === 'company') {
                    icon = 'building-2'; bgClass = 'bg-teal-50/70 border-teal-100/50'; iconClass = 'bg-teal-100 text-teal-600'; titleClass = 'text-teal-700';
                    badge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold text-teal-600 border border-teal-200/50 ml-2 bg-white/80 backdrop-blur-sm">หยุดบริษัท</span>`;
                } else if (item.type === 'national') {
                    icon = 'calendar-heart'; bgClass = 'bg-rose-50/70 border-rose-100/50'; iconClass = 'bg-rose-100 text-rose-500'; titleClass = 'text-rose-700';
                } else if (item.type === 'event') {
                    icon = 'briefcase'; bgClass = 'bg-purple-50/70 border-purple-100/50'; iconClass = 'bg-purple-100 text-purple-600'; titleClass = 'text-purple-700';
                    badge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold text-purple-600 border border-purple-200/50 ml-2 bg-white/80 backdrop-blur-sm">งาน</span>`;
                } else if (item.type === 'leave') {
                    icon = 'palmtree'; bgClass = 'bg-amber-50/70 border-amber-100/50'; iconClass = 'bg-amber-100 text-amber-500'; titleClass = 'text-amber-700';
                    badge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold text-amber-600 border border-amber-200/50 ml-2 bg-white/80 backdrop-blur-sm">วันลา</span>`;
                }

                let safeName = String(item.name || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
                let safeDetail = String(item.detail || '-').replace(/\n/g, '\\n').replace(/'/g, "\\'").replace(/"/g, "&quot;");
                let safeMapUrl = String(item.mapUrl || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");

                list.innerHTML += `
                    <div onclick="showDetailModal('${safeName}', '${item.date}', '${safeDetail}', '${safeMapUrl}', '${item.type}')" class="p-4 rounded-2xl border transition-all cursor-pointer shadow-[0_2px_10px_-3px_rgba(6,81,237,0.05)] hover:shadow-[0_8px_20px_-6px_rgba(6,81,237,0.15)] hover:-translate-y-1 ${bgClass} backdrop-blur-sm relative overflow-hidden group">
                        <div class="absolute right-0 top-0 w-16 h-16 bg-gradient-to-br from-white/40 to-transparent rounded-bl-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="flex items-start gap-4 relative z-10">
                            <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center shrink-0 shadow-sm ${iconClass}"><i data-lucide="${icon}" class="w-5 h-5 md:w-6 md:h-6"></i></div>
                            <div class="flex-1 min-w-0 py-0.5">
                                <p class="font-bold text-sm md:text-base truncate flex items-center ${titleClass}">${item.name} ${badge}</p>
                                <p class="text-[11px] md:text-xs font-medium text-slate-500 mt-1.5 flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i> ${formatThaiDateFull(item.date)}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // --- 5. Interaction & Modals ---
        // (ส่วนนี้ใช้ Logic เดิมทั้งหมด เพียงแค่ปรับโครงสร้าง Tailwind ใน Swal.fire ให้ดูสวยเข้าธีม)
        function handleDayClick(dateStr, hList, eList, lList) {
            const hasContent = hList.length > 0 || eList.length > 0 || lList.length > 0;

            if (isAdmin) {
                let contentHtml = '';
                if (hasContent) {
                    contentHtml = `<div class="bg-slate-50/50 p-2 md:p-3 rounded-2xl border border-slate-100 text-xs md:text-sm text-left mb-4 space-y-2 max-h-[300px] overflow-y-auto custom-scrollbar">`;
                    
                    hList.forEach(h => contentHtml += `
                        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-100 shadow-sm cursor-pointer hover:border-rose-300 hover:shadow-md transition-all" onclick="showDetailModal('${h.name}', '${h.date}', '${h.detail || ''}', '', '${h.type}')">
                            <span class="font-bold text-rose-500 truncate pr-2 flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-rose-500"></div> ${h.name}</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
                        </div>`);
                        
                    eList.forEach(e => contentHtml += `
                        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-100 shadow-sm cursor-pointer hover:border-purple-300 hover:shadow-md transition-all" onclick="showDetailModal('${e.name}', '${e.date}', '${e.detail || ''}', '${e.mapUrl || ''}', '${e.type}')">
                            <span class="font-bold text-purple-600 truncate pr-2 flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-purple-500"></div> ${e.name} ${e.username && e.username !== 'All' ? `<span class="text-[10px] bg-purple-50 text-purple-600 px-2 py-0.5 rounded-full ml-1">${e.username}</span>` : ''}</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
                        </div>`);
                        
                    lList.forEach(l => contentHtml += `
                        <div class="flex flex-col bg-white p-3 rounded-xl border border-slate-100 shadow-sm cursor-pointer hover:border-amber-300 transition-all" onclick="showDetailModal('${l.name} (${l.type})', '${dateStr}', 'สถานะ: ${l.status}\\nตั้งแต่: ${formatThaiDateFull(l.startDate)}\\nถึง: ${formatThaiDateFull(l.endDate)}', '', 'leave')">
                            <span class="font-bold text-amber-500 truncate flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-amber-500"></div> ${l.name} ลา</span>
                            <span class="text-[11px] text-slate-500 ml-4 mt-1 bg-slate-50 w-max px-2 py-0.5 rounded-md border border-slate-100">${l.type} - ${l.status}</span>
                        </div>`);
                        
                    contentHtml += `</div>`;
                } else {
                    contentHtml = `<div class="bg-slate-50/80 rounded-2xl p-6 text-center border border-slate-100 mb-4"><p class="text-sm text-slate-400 font-medium">ไม่มีข้อมูลงานหรือวันหยุดในวันนี้</p></div>`;
                }

                Swal.fire({
                    title: `<span class="text-xl md:text-2xl font-extrabold text-slate-800">${formatThaiDateFull(dateStr)}</span>`,
                    html: `
                        ${contentHtml}
                        <div class="flex flex-col gap-3 mt-2">
                            <button onclick="adminShowAddEventForm('${dateStr}')" class="w-full py-3 bg-purple-50 text-purple-600 border border-purple-200 hover:bg-purple-600 hover:text-white rounded-xl font-bold text-sm transition-colors shadow-sm flex justify-center items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4"></i> เพิ่มงานใหม่</button>
                            <button onclick="adminShowAddHolidayForm('${dateStr}')" class="w-full py-3 bg-rose-50 text-rose-500 border border-rose-200 hover:bg-rose-500 hover:text-white rounded-xl font-bold text-sm transition-colors shadow-sm flex justify-center items-center gap-2"><i data-lucide="calendar-plus" class="w-4 h-4"></i> เพิ่มวันหยุด</button>
                        </div>
                    `,
                    showConfirmButton: false,
                    showCloseButton: true,
                    customClass: { popup: 'rounded-3xl w-[90%] md:w-auto max-w-md shadow-2xl border border-white' },
                    didOpen: () => { lucide.createIcons(); }
                });

            } else {
                if (!hasContent) return; 
                let itemToView = hList[0] || eList[0] || lList[0];
                
                if(itemToView.startDate) {
                    Swal.fire({
                        icon: 'info', title: 'ข้อมูลวันลา',
                        html: `<div class="text-left bg-slate-50 p-4 rounded-xl mt-2 text-sm text-slate-600 space-y-2 border border-slate-100"><p>ประเภท: <b class="text-slate-800">${itemToView.type}</b></p><p>สถานะ: <b class="text-slate-800">${itemToView.status}</b></p><p class="pt-2 border-t border-slate-200">ตั้งแต่วันที่ <b>${formatThaiDateFull(itemToView.startDate)}</b><br>ถึง <b>${formatThaiDateFull(itemToView.endDate)}</b></p></div>`,
                        confirmButtonColor: '#6366f1', confirmButtonText: 'รับทราบ',
                        customClass: { popup: 'rounded-3xl w-[90%] max-w-sm shadow-2xl border border-white' }
                    });
                } else {
                    showDetailModal(itemToView.name, itemToView.date, itemToView.detail, itemToView.mapUrl, itemToView.type);
                }
            }
        }

        function showDetailModal(name, date, detail, mapUrl, type) {
            let mapBtn = '';
            if (mapUrl) {
                mapBtn = `<a href="${mapUrl}" target="_blank" class="mt-4 w-full flex items-center justify-center gap-2 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold text-sm transition-all hover:shadow-lg active:scale-95"><i data-lucide="map-pinned" class="w-4 h-4"></i> เปิดตำแหน่งใน Google Maps</a>`;
            }

            let deleteBtn = '';
            if (isAdmin && (type === "event" || type === "national" || type === "company")) {
                let itemType = type === 'event' ? 'event' : 'holiday';
                deleteBtn = `<button onclick="deleteItem('${name}', '${date}', '${itemType}')" class="mt-3 w-full flex items-center justify-center gap-2 py-3 bg-white hover:bg-red-50 text-red-500 hover:text-red-600 border border-red-200 rounded-xl font-bold text-sm transition-colors shadow-sm"><i data-lucide="trash-2" class="w-4 h-4"></i> ลบรายการนี้</button>`;
            }

            let safeDetail = detail ? detail.replace(/\n/g, '<br>') : 'ไม่มีรายละเอียดเพิ่มเติม';

            Swal.fire({
                html: `
                    <div class="text-left mt-2">
                        <h3 class="text-xl md:text-2xl font-extrabold text-slate-800 text-center mb-1 drop-shadow-sm">${name}</h3>
                        <p class="text-xs md:text-sm font-bold text-primary-500 text-center mb-6 bg-primary-50 w-max mx-auto px-3 py-1 rounded-full">${formatThaiDateFull(date)}</p>
                        <div class="bg-slate-50/80 p-4 md:p-5 rounded-2xl border border-slate-200 text-xs md:text-sm text-slate-600 leading-relaxed max-h-[40vh] overflow-y-auto custom-scrollbar shadow-inner">
                            <b class="text-slate-800 mb-2 block flex items-center gap-2"><i data-lucide="align-left" class="w-4 h-4 text-slate-400"></i> รายละเอียด:</b>
                            <div class="text-slate-600">${safeDetail}</div>
                        </div>
                        ${mapBtn}
                        ${deleteBtn}
                    </div>
                `,
                showConfirmButton: true, confirmButtonText: 'ปิดหน้าต่าง', confirmButtonColor: '#6366f1',
                customClass: { popup: 'rounded-[2rem] w-[90%] md:w-auto max-w-md shadow-2xl border border-white' },
                didOpen: () => { lucide.createIcons(); }
            });
        }

        // Logic ส่วนของ Admin Form คงไว้เหมือนเดิม แค่ครอบ Class ปุ่มและช่อง Input ใหม่ให้ดู Clean 
        function deleteItem(name, date, type) { /* เหมือนเดิม */ 
            Swal.fire({
                title: 'ยืนยันการลบ', text: `คุณต้องการลบ "${name}" ใช่หรือไม่?`, icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#cbd5e1',
                confirmButtonText: 'ใช่, ลบเลย', cancelButtonText: 'ยกเลิก',
                customClass: { popup: 'rounded-3xl w-[90%] max-w-sm border border-white shadow-2xl' }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'กำลังลบข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' } });
                    fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteCalendarItem', type: type, date: date, name: name }) })
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 'success') {
                            Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', showConfirmButton: false, timer: 1500, customClass: { popup: 'rounded-3xl w-[90%] max-w-sm border border-white' } });
                            fetchAllDataFromAPI().then(() => { renderCalendar(); renderUpcomingList(); });
                        } else {
                            Swal.fire({icon: 'error', title: 'ข้อผิดพลาด', text: res.message || 'ไม่สามารถลบได้', customClass: { popup: 'rounded-3xl w-[90%] max-w-sm border border-white' }});
                        }
                    }).catch(() => Swal.fire({icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์', customClass: { popup: 'rounded-3xl w-[90%] max-w-sm border border-white' }}));
                }
            });
        }

        function adminShowAddEventForm(dateStr) {
            let userOptions = `<option value="All">ทุกคน (All)</option>`;
            usersListDB.forEach(u => { userOptions += `<option value="${u.username}">${u.name} (${u.username})</option>`; });

            Swal.fire({
                title: 'เพิ่มงานใหม่',
                html: `
                    <div class="text-left space-y-3 md:space-y-4 mt-4">
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">วันที่</label><input type="text" value="${dateStr}" readonly class="w-full mt-1 p-3 bg-slate-100/50 border border-slate-200 rounded-xl text-sm outline-none text-slate-500 cursor-not-allowed"></div>
                        <div>
                            <label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">เลือกพนักงาน (ผู้รับมอบหมาย)</label>
                            <select id="evUser" class="w-full mt-1 p-3 bg-white border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-100 rounded-xl text-sm outline-none transition-all shadow-sm">
                                ${userOptions}
                            </select>
                        </div>
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">ชื่องาน <span class="text-red-500">*</span></label><input type="text" id="evName" placeholder="ระบุชื่องาน..." class="w-full mt-1 p-3 bg-white border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-100 rounded-xl text-sm outline-none transition-all shadow-sm"></div>
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">รายละเอียด</label><textarea id="evDetail" placeholder="เพิ่มรายละเอียดของงาน (ถ้ามี)..." class="w-full mt-1 p-3 bg-white border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-100 rounded-xl text-sm outline-none transition-all shadow-sm custom-scrollbar" rows="3"></textarea></div>
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">ลิงก์ Google Maps (ถ้ามี)</label><input type="text" id="evMap" placeholder="https://maps.app.goo.gl/..." class="w-full mt-1 p-3 bg-white border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-100 rounded-xl text-sm outline-none transition-all shadow-sm"></div>
                    </div>
                `,
                showCancelButton: true, confirmButtonText: 'บันทึกงาน', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#7e22ce',
                customClass: { popup: 'rounded-[2rem] w-[90%] md:w-auto max-w-md shadow-2xl border border-white' },
                preConfirm: () => {
                    const name = document.getElementById('evName').value;
                    if(!name) { Swal.showValidationMessage('กรุณากรอกชื่องาน'); return false; }
                    return { date: dateStr, name: name, detail: document.getElementById('evDetail').value, mapUrl: document.getElementById('evMap').value, type: 'event', username: document.getElementById('evUser').value };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' } });
                    fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "addCalendarEvent", ...result.value }) })
                    .then(res => res.json())
                    .then(res => {
                        if(res.status === "success") {
                            eventsDB.push({ id: Date.now(), ...result.value });
                            Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', showConfirmButton: false, timer: 1500, customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' } });
                            renderCalendar(); renderUpcomingList();
                        } else {
                            Swal.fire({icon: 'error', title: 'ข้อผิดพลาด', text: 'บันทึกไม่สำเร็จ', customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' }});
                        }
                    }).catch(() => Swal.fire({icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์', customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' }}));
                }
            });
        }

        function adminShowAddHolidayForm(dateStr) {
            Swal.fire({
                title: 'เพิ่มวันหยุด',
                html: `
                    <div class="text-left space-y-3 md:space-y-4 mt-4">
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">วันที่</label><input type="text" value="${dateStr}" readonly class="w-full mt-1 p-3 bg-slate-100/50 border border-slate-200 rounded-xl text-sm outline-none text-slate-500 cursor-not-allowed"></div>
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">ชื่อวันหยุด <span class="text-red-500">*</span></label><input type="text" id="holName" placeholder="เช่น วันขึ้นปีใหม่..." class="w-full mt-1 p-3 bg-white border border-slate-200 focus:border-rose-500 focus:ring-2 focus:ring-rose-100 rounded-xl text-sm outline-none transition-all shadow-sm"></div>
                        <div>
                            <label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">ประเภท</label>
                            <select id="holType" class="w-full mt-1 p-3 bg-white border border-slate-200 focus:border-rose-500 focus:ring-2 focus:ring-rose-100 rounded-xl text-sm outline-none transition-all shadow-sm">
                                <option value="national">วันหยุดราชการ / นักขัตฤกษ์</option>
                                <option value="company">วันหยุดพิเศษบริษัท</option>
                            </select>
                        </div>
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-500 ml-1">รายละเอียด (ถ้ามี)</label><textarea id="holDetail" placeholder="เหตุผลหรือข้อความเพิ่มเติม..." class="w-full mt-1 p-3 bg-white border border-slate-200 focus:border-rose-500 focus:ring-2 focus:ring-rose-100 rounded-xl text-sm outline-none transition-all shadow-sm custom-scrollbar" rows="3"></textarea></div>
                    </div>
                `,
                showCancelButton: true, confirmButtonText: 'บันทึกวันหยุด', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#e11d48',
                customClass: { popup: 'rounded-[2rem] w-[90%] md:w-auto max-w-md shadow-2xl border border-white' },
                preConfirm: () => {
                    const name = document.getElementById('holName').value;
                    if(!name) { Swal.showValidationMessage('กรุณากรอกชื่อวันหยุด'); return false; }
                    return { date: dateStr, name: name, detail: document.getElementById('holDetail').value, type: document.getElementById('holType').value };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' } });
                    fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "addCalendarEvent", ...result.value }) })
                    .then(res => res.json())
                    .then(res => {
                        if(res.status === "success") {
                            holidaysDB.push({ id: Date.now(), ...result.value });
                            Swal.fire({ icon: 'success', title: 'เพิ่มวันหยุดเรียบร้อย', showConfirmButton: false, timer: 1500, customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' } });
                            renderCalendar(); renderUpcomingList();
                        } else {
                            Swal.fire({icon: 'error', title: 'ข้อผิดพลาด', text: 'บันทึกไม่สำเร็จ', customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' }});
                        }
                    }).catch(() => Swal.fire({icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์', customClass: { popup: 'rounded-3xl w-[90%] max-w-sm' }}));
                }
            });
        }

        // --- Utils ---
        function changeMonth(step) {
            currentMonth += step;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; } 
            else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        }

        function goToToday() {
            currentMonth = actualToday.getMonth(); currentYear = actualToday.getFullYear();
            renderCalendar();
        }

        function isDateInRange(dateStr, startStr, endStr) {
            const d = new Date(dateStr), s = new Date(startStr), e = new Date(endStr);
            return d >= s && d <= e;
        }

        function formatThaiDateFull(dateStr) {
            const d = new Date(dateStr);
            return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear() + 543}`;
        }
    </script>
</body>
</html>
