<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Login - Business Portal</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f5f5f5; }
        .login-box { border: 1px solid #ddd; padding: 30px; border-radius: 12px; width: 320px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; margin-bottom: 15px; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="login-box">
    <h2 style="text-align: center;">Login</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="handleLogin()">เข้าสู่ระบบ</button>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzehwXrrfuioHK68BXQGLpKyBPM5ElXZKgRm0o55yzwXgtx_YGkItjkM090zceA_t7Jcg/exec"; // วาง URL จาก Google Apps Script

    async function handleLogin() {
        const payload = {
            action: "login",
            username: document.getElementById('user').value,
            password: document.getElementById('pass').value
        };

        try {
            const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.json();

            if (result.status === "success") {
                // เก็บข้อมูลชั่วคราวไว้ใน Browser
                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("userName", result.name);
                sessionStorage.setItem("userRole", result.role);
                
                // ย้ายไปหน้า Dashboard
                window.location.href = "dashboard.html";
            } else {
                alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
            }
        } catch (err) {
            alert("เชื่อมต่อไม่สำเร็จ");
        }
    }
</script>
</body>
</html>
