<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Test Business Portal Connection</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; }
        input, select, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        #adminPanel { display: none; margin-top: 20px; border-top: 2px solid #eee; pt: 10px; }
    </style>
</head>
<body>

<div class="box">
    <div id="loginPanel">
        <h3>Login Test</h3>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
    </div>

    <div id="adminPanel">
        <h3>Admin: Add User</h3>
        <input type="text" id="newU" placeholder="New Username">
        <input type="text" id="newP" placeholder="New Password">
        <input type="text" id="newN" placeholder="Full Name">
        <select id="newR">
            <option value="Admin">Admin</option>
            <option value="User">User</option>
        </select>
        <button onclick="handleAddUser()">Add to Sheet</button>
    </div>
</div>

<script>
    // วาง URL ที่ได้จาก Google Apps Script ตรงนี้
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyqvJQR_kcDDHq0g9C0swtYtlK0xcwp4sgZy8rN2e9qvddhUSviNCDxpH2R0ik7MlfaZQ/exec";

    async function handleLogin() {
        const payload = {
            action: "login",
            username: document.getElementById('user').value,
            password: document.getElementById('pass').value
        };

        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === "success") {
                alert("Login สำเร็จ! ยินดีต้อนรับ " + result.name);
                if (result.role === "Admin") {
                    document.getElementById('adminPanel').style.display = "block";
                }
            } else {
                alert("Login ไม่ผ่าน!");
            }
        } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
        }
    }

    async function handleAddUser() {
        const payload = {
            action: "addUser",
            newUsername: document.getElementById('newU').value,
            newPassword: document.getElementById('newP').value,
            newName: document.getElementById('newN').value,
            newRole: document.getElementById('newR').value
        };

        const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.status === "added") {
            alert("เพิ่มข้อมูลลง Google Sheets เรียบร้อย!");
        }
    }
</script>

</body>
</html>
