<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check-in | CubicPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #fcfdfe; min-height: 100vh; overflow-x: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.03); }
        .loader-overlay { position: fixed; inset: 0; background: #fff; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .spinner { width: 45px; height: 45px; border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.1); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="loader" class="loader-overlay">
        <div class="spinner mb-4"></div>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em]">CubicPlus System</p>
    </div>

    <div class="max-w-6xl mx-auto mb-8 flex justify-between items-center px-4">
        <div class="text-left">
            <p id="userDisp" class="text-slate-900 font-bold italic text-xl leading-none">...</p>
            <p class="text-[10px] uppercase font-bold text-indigo-400 tracking-[0.2em] mt-2">Staff Presence</p>
        </div>
        <button onclick="location.href='dashboard.html'" class="p-3 bg-white rounded-2xl shadow-sm border border-slate-100 text-slate-400 hover:text-indigo-600 transition-all">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
    </div>

    <div id="customAlert" class="modal">
        <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-10 text-center shadow-2xl">
            <div id="alertIcon" class="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-6"></div>
            <h3 id="alertTitle" class="text-xl font-bold text-slate-800 mb-2">Notice</h3>
            <p id="alertMsg" class="text-slate-500 text-sm mb-8 leading-relaxed"></p>
            <button onclick="closeAlert()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-xs uppercase tracking-widest active:scale-95 transition-all">OK</button>
        </div>
    </div>

    <div id="locationModal" class="modal">
        <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-10 space-y-6 shadow-2xl">
            <h3 class="text-center font-bold text-slate-800 tracking-tight text-lg">Check In Location</h3>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="confirmRecord('OFFICE')" class="p-4 bg-slate-50 hover:bg-white border border-transparent hover:border-indigo-100 rounded-2xl flex items-center gap-4 transition-all">
                    <span class="text-xl">🏢</span> <span class="font-bold text-slate-700">OFFICE</span>
                </button>
                <button onclick="confirmRecord('WFH')" class="p-4 bg-slate-50 hover:bg-white border border-transparent hover:border-indigo-100 rounded-2xl flex items-center gap-4 transition-all">
                    <span class="text-xl">🏠</span> <span class="font-bold text-slate-700">WFH</span>
                </button>
                <button onclick="confirmRecord('ON-SITE')" class="p-4 bg-slate-50 hover:bg-white border border-transparent hover:border-indigo-100 rounded-2xl flex items-center gap-4 transition-all">
                    <span class="text-xl">🚗</span> <span class="font-bold text-slate-700">ON-SITE</span>
                </button>
            </div>
            <button onclick="closeLocation()" class="w-full text-center text-[10px] text-slate-400 font-bold uppercase py-2">CANCEL</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-8">
                <div class="glass-panel rounded-[3.5rem] p-10 md:p-14 text-center border-b-[10px] border-indigo-500/10">
                    <div id="todayDate" class="text-[10px] uppercase tracking-[0.5em] text-indigo-400 font-bold mb-4"></div>
                    <div id="clock" class="text-6xl md:text-7xl font-extralight text-slate-800 tracking-tighter mb-10 leading-none">00:00:00</div>
                    
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <button id="inBtn" onclick="openLocationModal('Check In')" class="py-6 bg-slate-900 text-white rounded-[1.8rem] font-bold text-xs uppercase tracking-widest shadow-2xl active:scale-95 transition-all">Check In</button>
                            <button id="outBtn" onclick="confirmRecord('-')" class="py-6 bg-white text-slate-900 border border-slate-200 rounded-[1.8rem] font-bold text-xs uppercase tracking-widest active:scale-95 transition-all">Check Out</button>
                        </div>
                        <div class="text-left bg-white/60 p-6 rounded-[2rem] border border-white">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 block mb-3 tracking-widest">Daily Summary</label>
                            <textarea id="memo" rows="3" class="w-full bg-transparent border-none text-base font-normal focus:ring-0 placeholder:text-slate-200 p-2" placeholder="วันนี้คุณทำอะไรสำเร็จบ้าง..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="px-2">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-[0.3em] mb-6 flex items-center gap-3 px-2">
                        <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i> My Today Activity
                    </h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass-panel p-6 rounded-[2rem] border-l-4 border-indigo-400">
                            <div class="flex justify-between items-start mb-4">
                                <div class="p-2 bg-indigo-50 text-indigo-500 rounded-xl"><i data-lucide="clock" class="w-4 h-4"></i></div>
                                <span class="text-[9px] font-bold text-indigo-300 uppercase tracking-widest">In</span>
                            </div>
                            <p id="inTimeText" class="text-2xl font-bold text-slate-700 tracking-tighter">--:--</p>
                            <p id="inLocText" class="text-[10px] text-slate-400 font-medium mt-1 uppercase">Ready</p>
                        </div>
                        <div class="glass-panel p-6 rounded-[2rem] border-l-4 border-slate-400">
                            <div class="flex justify-between items-start mb-4">
                                <div class="p-2 bg-slate-50 text-slate-400 rounded-xl"><i data-lucide="log-out" class="w-4 h-4"></i></div>
                                <span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">Out</span>
                            </div>
                            <p id="outTimeText" class="text-2xl font-bold text-slate-700 tracking-tighter">--:--</p>
                            <p id="outLocText" class="text-[10px] text-slate-400 font-medium mt-1 uppercase">Done</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-8">
                <div class="glass-panel rounded-[3rem] p-10">
                    <div class="flex justify-between items-center mb-8 px-2">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Team Status</h4>
                        <span id="activeCount" class="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full uppercase">0 Online</span>
                    </div>
                    <div id="colleagueStatus" class="space-y-3 max-h-[300px] overflow-y-auto pr-2"></div>
                </div>

                <div class="glass-panel rounded-[3rem] p-10">
                    <div class="flex justify-between items-center mb-8 px-2">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Reports</h4>
                        <div class="flex bg-slate-100 p-1 rounded-xl scale-90">
                            <button onclick="updateRange(7)" id="btn7" class="px-4 py-1.5 rounded-lg font-bold text-xs transition-all bg-white shadow-sm text-indigo-600">7D</button>
                            <button onclick="updateRange(30)" id="btn30" class="px-4 py-1.5 rounded-lg font-bold text-xs transition-all text-slate-400">30D</button>
                        </div>
                    </div>
                    <div id="historyTable" class="space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzehwXrrfuioHK68BXQGLpKyBPM5ElXZKgRm0o55yzwXgtx_YGkItjkM090zceA_t7Jcg/exec";
        const user = sessionStorage.getItem("userName") || sessionStorage.getItem("username");
        const name = sessionStorage.getItem("userName") || "พนักงาน";
        let globalData = [];
        let pendingType = '';

        document.getElementById('userDisp').innerText = name;

        // 🟢 Balanced Dynamic Logic: 
        // ก่อนเที่ยง -> ช้า 1 นาที | หลังเที่ยง -> เร็ว 1 นาที
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            if (hours < 12) {
                now.setMinutes(now.getMinutes() - 1); 
            } else {
                now.setMinutes(now.getMinutes() + 1);
            }
            document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH');
            document.getElementById('todayDate').innerText = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateClock, 1000);

        function showCustomAlert(title, msg, icon = "check-circle", color = "indigo") {
            const modal = document.getElementById('customAlert');
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            const iconBox = document.getElementById('alertIcon');
            iconBox.className = `w-20 h-20 bg-${color}-50 text-${color}-500 rounded-full flex items-center justify-center mx-auto mb-6`;
            iconBox.innerHTML = `<i data-lucide="${icon}" class="w-10 h-10"></i>`;
            lucide.createIcons();
            modal.classList.add('active');
        }

        function closeAlert() { document.getElementById('customAlert').classList.remove('active'); }
        function openLocationModal(type) { pendingType = type; document.getElementById('locationModal').classList.add('active'); }
        function closeLocation() { document.getElementById('locationModal').classList.remove('active'); }

        async function confirmRecord(loc) {
            closeLocation();
            const typeToSend = (loc === '-') ? 'Check Out' : 'Check In';
            const btn = typeToSend === 'Check In' ? document.getElementById('inBtn') : document.getElementById('outBtn');
            btn.disabled = true;
            btn.innerText = "WAIT...";
            const payload = { action: "recordTime", username: user, name: name, type: typeToSend, location: loc === '-' ? "" : loc, memo: (typeToSend === 'Check Out') ? document.getElementById('memo').value : "-" };
            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                showCustomAlert("Success", `บันทึก ${typeToSend} สำเร็จ`, "check-circle", "emerald");
                if(typeToSend === 'Check Out') document.getElementById('memo').value = "";
                await loadData();
            } catch(e) { await loadData(); } finally { btn.disabled = false; btn.innerText = typeToSend.toUpperCase(); }
        }

        async function loadData() {
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: "fetchData"}) });
                globalData = await res.json();
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                const today = new Date().toLocaleDateString();
                const myToday = globalData.filter(d => (d.Username === user || d.Name === name) && new Date(d.Timestamp).toLocaleDateString() === today);
                const hasIn = myToday.some(d => d.Type === "Check In");
                const hasOut = myToday.some(d => d.Type === "Check Out");
                document.getElementById('inBtn').disabled = hasIn;
                document.getElementById('outBtn').disabled = !hasIn || hasOut;
                const inLog = myToday.find(d => d.Type === "Check In");
                const outLog = myToday.find(d => d.Type === "Check Out");
                if(inLog) {
                    document.getElementById('inTimeText').innerText = new Date(inLog.Timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                    document.getElementById('inLocText').innerText = "AT: " + inLog.Location;
                }
                if(outLog) {
                    document.getElementById('outTimeText').innerText = new Date(outLog.Timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                    document.getElementById('outLocText').innerText = "DONE";
                }
                renderUI();
                lucide.createIcons();
            } catch(e) { console.log(e); }
        }

        function renderUI() {
            const colleagueBox = document.getElementById("colleagueStatus");
            colleagueBox.innerHTML = "";
            const today = new Date().toLocaleDateString();
            const latestMap = new Map();
            globalData.forEach(d => { if (new Date(d.Timestamp).toLocaleDateString() === today) latestMap.set(d.Name, d); });
            let activeCount = 0;
            latestMap.forEach((v, k) => {
                const isOnline = v.Type === "Check In";
                if(isOnline) activeCount++;
                const locIcon = v.Location === 'OFFICE' ? '🏢' : v.Location === 'WFH' ? '🏠' : v.Location === 'ON-SITE' ? '🚗' : '🕒';
                colleagueBox.innerHTML += `<div class="flex items-center justify-between p-4 bg-white/40 rounded-2xl border border-white">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-indigo-50 text-indigo-400 rounded-full flex items-center justify-center text-xs font-bold border-2 border-white shadow-sm">${k.charAt(0)}</div>
                        <div><p class="font-bold text-slate-700 text-[11px]">${k}</p><p class="text-[9px] text-slate-400 flex items-center gap-1 uppercase tracking-tighter">${locIcon} ${v.Location || '-'}</p></div>
                    </div>
                    <div class="w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-slate-200'}"></div>
                </div>`;
            });
            document.getElementById('activeCount').innerText = `${activeCount} ONLINE`;
            updateRange(7);
        }

        function updateRange(days) {
            const table = document.getElementById("historyTable");
            table.innerHTML = "";
            const myLogs = globalData.filter(d => d.Username === user || d.Name === name);
            const reportMap = new Map();
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            myLogs.forEach(log => {
                const logDate = new Date(log.Timestamp);
                if (logDate >= cutoff) {
                    const dStr = logDate.toLocaleDateString('th-TH', {day:'2-digit', month:'2-digit'});
                    if (!reportMap.has(dStr)) reportMap.set(dStr, {in:'-', out:'-'});
                    if (log.Type === "Check In") reportMap.get(dStr).in = logDate.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
                    if (log.Type === "Check Out") reportMap.get(dStr).out = logDate.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
                }
            });
            Array.from(reportMap.keys()).reverse().forEach(date => {
                const v = reportMap.get(date);
                table.innerHTML += `<div class="flex justify-between items-center p-4 bg-white/30 rounded-2xl mb-1 text-[11px] font-bold border border-slate-50 transition-all hover:bg-white/60">
                    <span class="text-slate-400 w-12 tracking-tight">${date}</span>
                    <div class="flex gap-6 text-slate-700"><span class="w-8 text-center">${v.in}</span><span class="w-8 text-center">${v.out}</span></div>
                </div>`;
            });
        }

        window.onload = () => { lucide.createIcons(); loadData(); };
    </script>
</body>
</html>
