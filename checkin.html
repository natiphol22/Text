<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in | CubicPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background: #fcfdfe;
            background-image: radial-gradient(circle at top right, #f0f7ff, transparent),
                              radial-gradient(circle at bottom left, #f5f3ff, transparent);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.03);
        }
        .input-luxe {
            background: rgba(248, 250, 252, 0.5);
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-luxe:focus {
            background: #fff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.05);
            outline: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <button onclick="location.href='dashboard.html'" class="group flex items-center gap-2 text-slate-400 hover:text-indigo-600 transition-all text-sm">
                <i data-lucide="chevron-left" class="w-4 h-4"></i> กลับหน้าหลัก
            </button>
            <div class="text-right">
                <p class="text-[10px] uppercase font-bold text-slate-400 tracking-widest">Active User</p>
                <p id="userDisp" class="text-slate-900 font-semibold italic">...</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-panel rounded-[2.5rem] p-8 text-center relative overflow-hidden">
                    <div id="todayDate" class="text-[10px] uppercase tracking-[0.4em] text-indigo-400 font-bold mb-2"></div>
                    <div id="clock" class="text-5xl font-extralight text-slate-800 tracking-tighter mb-4">00:00:00</div>
                    
                    <div class="space-y-4 text-left mt-6">
                        <select id="location" class="input-luxe w-full p-4 rounded-2xl text-slate-700 font-medium text-sm">
                            <option value="OFFICE">🏢 OFFICE</option>
                            <option value="WFH">🏠 WFH</option>
                            <option value="ON-SITE">🚗 ON-SITE</option>
                        </select>
                        <textarea id="memo" rows="2" class="input-luxe w-full p-4 rounded-2xl text-sm" placeholder="Memo..."></textarea>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="record('Check In')" class="py-4 bg-slate-900 text-white rounded-xl font-bold text-[10px] uppercase tracking-[0.2em] hover:bg-indigo-600 transition-all shadow-lg">Check In</button>
                            <button onclick="record('Check Out')" class="py-4 bg-white text-slate-900 border border-slate-200 rounded-xl font-bold text-[10px] uppercase tracking-[0.2em] hover:border-rose-500 hover:text-rose-500 transition-all">Check Out</button>
                        </div>
                    </div>
                </div>

                <div class="px-2">
                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="history" class="w-3 h-3"></i> My Timeline
                    </h4>
                    <div id="myHistoryBody" class="space-y-3"></div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-4">
                <div class="glass-panel rounded-[2.5rem] p-6 min-h-[400px]">
                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                        <i data-lucide="users" class="w-3 h-3"></i> Colleague Status (Today)
                    </h4>
                    <div id="colleagueStatus" class="space-y-3">
                        <p class="text-xs text-slate-300 italic">กำลังโหลดข้อมูลทีม...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzehwXrrfuioHK68BXQGLpKyBPM5ElXZKgRm0o55yzwXgtx_YGkItjkM090zceA_t7Jcg/exec";
        
        const user = sessionStorage.getItem("userName") || sessionStorage.getItem("username") || "Guest";
        const name = sessionStorage.getItem("userName") || sessionStorage.getItem("name") || "พนักงาน";

        document.getElementById('userDisp').innerText = name;

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('th-TH');
        }, 1000);
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' });

        async function record(type) {
            const btn = event.currentTarget;
            btn.disabled = true;
            btn.innerText = "WAIT...";

            const payload = {
                action: "recordTime",
                username: user,
                name: name,
                type: type,
                location: document.getElementById('location').value,
                memo: document.getElementById('memo').value || "-"
            };

            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === "success") {
                    alert("บันทึก " + type + " สำเร็จ");
                    document.getElementById('memo').value = "";
                    loadData();
                }
            } catch(e) {
                loadData();
                alert("ระบบบันทึกเรียบร้อย");
            } finally {
                btn.disabled = false;
                btn.innerText = type.toUpperCase();
            }
        }

        async function loadData() {
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: "fetchData"}) });
                const data = await res.json();
                const today = new Date().toLocaleDateString();

                // 1. จัดการประวัติส่วนตัว (My Timeline)
                const historyBox = document.getElementById("myHistoryBody");
                historyBox.innerHTML = "";
                data.filter(d => d.Username === user || d.Name === name).reverse().slice(0, 5).forEach(d => {
                    const time = new Date(d.Timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                    historyBox.innerHTML += `
                        <div class="glass-panel p-3 rounded-2xl flex justify-between items-center border border-white text-[11px]">
                            <div class="flex items-center gap-3">
                                <span class="${d.Type === 'Check In' ? 'text-emerald-500' : 'text-rose-500'} font-bold">${d.Type}</span>
                                <span class="text-slate-400">@ ${d.Location}</span>
                            </div>
                            <span class="font-bold text-slate-700">${time}</span>
                        </div>`;
                });

                // 2. จัดการสถานะเพื่อนร่วมงาน (Colleague Status)
                const colleagueBox = document.getElementById("colleagueStatus");
                colleagueBox.innerHTML = "";
                
                const latestMap = new Map();
                data.forEach(d => {
                    if (new Date(d.Timestamp).toLocaleDateString() === today) {
                        latestMap.set(d.Name, { type: d.Type, loc: d.Location });
                    }
                });

                if(latestMap.size === 0) {
                    colleagueBox.innerHTML = `<p class="text-xs text-slate-400">ยังไม่มีใครเช็คอินวันนี้</p>`;
                }

                latestMap.forEach((val, key) => {
                    const isOnline = val.type === "Check In";
                    colleagueBox.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-white/50 rounded-2xl border border-slate-50">
                            <div class="flex items-center gap-3">
                                <div class="w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}"></div>
                                <div>
                                    <p class="text-xs font-semibold text-slate-700">${key}</p>
                                    <p class="text-[9px] text-slate-400">${val.loc}</p>
                                </div>
                            </div>
                            <span class="text-[9px] px-2 py-1 rounded-full ${isOnline ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-400'}">
                                ${val.type}
                            </span>
                        </div>`;
                });

                lucide.createIcons();
            } catch(e) { console.log("Load error"); }
        }

        window.onload = () => {
            lucide.createIcons();
            loadData();
        };
    </script>
</body>
</html>
