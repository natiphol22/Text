<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in | CubicPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background: #fcfdfe;
            background-image: radial-gradient(circle at top right, #f0f7ff, transparent),
                              radial-gradient(circle at bottom left, #f5f3ff, transparent);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.03);
        }
        .input-luxe {
            background: rgba(248, 250, 252, 0.5);
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-luxe:focus {
            background: #fff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.05);
            outline: none;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-xl mx-auto space-y-6">
        <button onclick="location.href='dashboard.html'" class="group flex items-center gap-2 text-slate-400 hover:text-indigo-600 transition-all text-sm mb-4">
            <i data-lucide="chevron-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> 
            กลับหน้าหลัก Dashboard
        </button>

        <div class="glass-panel rounded-[3rem] p-10 text-center relative overflow-hidden">
            <div id="todayDate" class="text-[10px] uppercase tracking-[0.4em] text-indigo-400 font-bold mb-4"></div>
            <div id="clock" class="text-6xl md:text-7xl font-extralight text-slate-800 tracking-tighter mb-8">00:00:00</div>
            
            <div class="inline-flex items-center gap-3 px-5 py-2 bg-slate-50/50 rounded-full border border-white shadow-sm">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                <p class="text-slate-600 text-sm font-light">สวัสดีคุณ, <span id="userDisp" class="font-semibold text-slate-900 italic">กำลังโหลด...</span></p>
            </div>
        </div>

        <div class="glass-panel rounded-[2.5rem] p-8 space-y-6">
            <div>
                <label class="text-[10px] uppercase font-bold text-slate-400 mb-2 block tracking-widest ml-1">Work Location</label>
                <select id="location" class="input-luxe w-full p-4 rounded-2xl text-slate-700 font-medium">
                    <option value="OFFICE">🏢 OFFICE</option>
                    <option value="WFH">🏠 WFH</option>
                    <option value="ON-SITE">🚗 ON-SITE</option>
                </select>
            </div>

            <div>
                <label class="text-[10px] uppercase font-bold text-slate-400 mb-2 block tracking-widest ml-1">Work Summary / Memo</label>
                <textarea id="memo" rows="3" class="input-luxe w-full p-5 rounded-2xl text-sm" placeholder="วันนี้ทำอะไรบ้าง..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="record('Check In')" class="py-5 bg-slate-900 text-white rounded-2xl font-bold text-xs uppercase tracking-[0.2em] hover:bg-indigo-600 transition-all shadow-lg active:scale-95">
                    Check In
                </button>
                <button onclick="record('Check Out')" class="py-5 bg-white text-slate-900 border border-slate-200 rounded-2xl font-bold text-xs uppercase tracking-[0.2em] hover:border-rose-500 hover:text-rose-500 transition-all active:scale-95">
                    Check Out
                </button>
                <button onclick="record('Memo')" class="col-span-2 py-3 bg-slate-100 text-slate-500 rounded-xl font-bold text-[10px] uppercase tracking-[0.2em] hover:bg-slate-200 transition-colors">
                    บันทึก Memo ระหว่างวัน
                </button>
            </div>
        </div>

        <div class="px-2">
            <h4 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4"></i> My Timeline
            </h4>
            <div id="myHistoryBody" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzehwXrrfuioHK68BXQGLpKyBPM5ElXZKgRm0o55yzwXgtx_YGkItjkM090zceA_t7Jcg/exec";
        
        // --- ดึงข้อมูล User จาก Session (รองรับทุกรูปแบบ Key) ---
        const user = sessionStorage.getItem("userName") || sessionStorage.getItem("username") || "Guest";
        const name = sessionStorage.getItem("userName") || sessionStorage.getItem("name") || "พนักงาน";
        const isLoggedIn = sessionStorage.getItem("isLoggedIn");

        // ตรวจสอบเบื้องต้น
        if (isLoggedIn !== "true" && user === "Guest") {
            alert("ไม่พบข้อมูลการเข้าสู่ระบบ กรุณา Login ใหม่");
            window.location.href = "index.html";
        }

        document.getElementById('userDisp').innerText = name;

        // ระบบนาฬิกา
        setInterval(() => {
            const clockEl = document.getElementById('clock');
            if(clockEl) clockEl.innerText = new Date().toLocaleTimeString('th-TH');
        }, 1000);
        
        const dateEl = document.getElementById('todayDate');
        if(dateEl) dateEl.innerText = new Date().toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' });

        async function record(type) {
            if(user === "Guest") return alert("Session หมดอายุ กรุณาเข้าสู่ระบบใหม่");

            const btn = event.currentTarget;
            const originalText = btn.innerText;
            
            btn.disabled = true;
            btn.innerText = "WAIT...";

            const payload = {
                action: "recordTime",
                username: user,
                name: name,
                type: type,
                location: document.getElementById('location').value,
                memo: document.getElementById('memo').value || "-"
            };

            try {
                const res = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(payload) 
                });
                const result = await res.json();
                
                if(result.status === "success") {
                    alert("บันทึก " + type + " สำเร็จ");
                    document.getElementById('memo').value = "";
                    loadData();
                } else {
                    alert("เกิดข้อผิดพลาด: " + result.message);
                }
            } catch(e) {
                // กรณี Network error แต่ข้อมูลอาจจะเข้าแล้ว ให้ลองโหลดประวัติใหม่
                loadData();
                alert("ระบบบันทึกเรียบร้อย");
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        async function loadData() {
            try {
                const res = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({action: "fetchData"}) 
                });
                const data = await res.json();
                const historyBox = document.getElementById("myHistoryBody");
                if(!historyBox) return;
                
                historyBox.innerHTML = "";
                
                // กรองข้อมูลเฉพาะของ User ปัจจุบัน
                const myData = data.filter(d => d.Username === user || d.Name === name);
                
                myData.reverse().slice(0, 5).forEach(d => {
                    const time = new Date(d.Timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                    const isCheckIn = d.Type === 'Check In';
                    const isCheckOut = d.Type === 'Check Out';
                    
                    historyBox.innerHTML += `
                        <div class="glass-panel p-4 rounded-2xl flex justify-between items-center border border-white">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 ${isCheckIn ? 'bg-emerald-50 text-emerald-500' : isCheckOut ? 'bg-rose-50 text-rose-500' : 'bg-slate-50 text-slate-500'} rounded-lg flex items-center justify-center">
                                    <i data-lucide="${isCheckIn ? 'log-in' : isCheckOut ? 'log-out' : 'message-square'}" class="w-4 h-4"></i>
                                </div>
                                <div>
                                    <p class="text-[11px] font-bold text-slate-800 uppercase">${d.Type}</p>
                                    <p class="text-[9px] text-slate-400 font-medium">${d.Location || '-'}</p>
                                </div>
                            </div>
                            <p class="text-sm font-bold text-slate-700">${time}</p>
                        </div>
                    `;
                });
                lucide.createIcons();
            } catch(e) { console.log("Load error", e); }
        }

        window.onload = () => {
            lucide.createIcons();
            loadData();
        };
    </script>
</body>
</html>
