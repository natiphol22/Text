<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubicPlus | Executive Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --primary: #6366f1; --emerald: #10b981; --rose: #f43f5e; }
        body { font-family: 'Kanit', sans-serif; background: #f8fafc; overflow-x: hidden; }
        
        #mainLoader {
            position: fixed; inset: 0; z-index: 100; background: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.03);
        }

        .aura-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background: radial-gradient(circle at 0% 0%, #eff6ff 0%, transparent 40%),
                        radial-gradient(circle at 100% 100%, #f5f3ff 0%, transparent 40%);
        }

        .pulse-emerald { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse-e 2s infinite; }
        @keyframes pulse-e { 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        
        .swal2-popup { border-radius: 2.5rem !important; font-family: 'Kanit', sans-serif !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 md:p-12">

    <div id="mainLoader">
        <div class="w-12 h-12 border-4 border-slate-100 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
        <p class="text-slate-400 text-xs font-medium tracking-widest uppercase">CubicPlus Loading</p>
    </div>

    <div class="aura-bg"></div>

    <div class="w-full max-w-xl space-y-8">
        <div class="flex justify-between items-end px-2">
            <div>
                <button onclick="location.href='dashboard.html'" class="text-slate-400 text-xs mb-2 flex items-center gap-1 hover:text-indigo-500 transition-colors">
                    <i data-lucide="chevron-left" class="w-3 h-3"></i> กลับหน้าหลัก
                </button>
                <p id="greetingText" class="text-slate-400 text-sm font-light italic">Welcome back,</p>
                <h1 id="userDisp" class="text-3xl font-semibold text-slate-800 tracking-tight leading-none">พนักงาน</h1>
            </div>
            <div class="text-right">
                <div class="inline-flex items-center gap-2 bg-white/80 px-4 py-2 rounded-2xl glass-panel shadow-sm border border-white">
                    <div id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
                    <span id="statusText" class="text-xs font-bold text-slate-500 uppercase tracking-widest text-[10px]">Checking...</span>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-[3.5rem] p-12 text-center relative overflow-hidden border border-white/50 shadow-2xl shadow-indigo-100/20">
            <h2 id="clock" class="text-7xl md:text-8xl font-extralight text-slate-800 tracking-tighter mb-4">00:00:00</h2>
            <p id="todayDate" class="text-indigo-500/80 font-medium tracking-[0.3em] uppercase text-[10px] mb-10"></p>

            <div class="space-y-6">
                <div class="max-w-xs mx-auto">
                    <label class="text-[10px] uppercase font-bold text-slate-400 mb-2 block tracking-widest">Work Location</label>
                    <select id="location" class="w-full bg-white/50 border border-slate-100 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all">
                        <option value="OFFICE">🏢 OFFICE</option>
                        <option value="WFH">🏠 WFH</option>
                        <option value="ON-SITE">🚗 ON-SITE</option>
                    </select>
                </div>

                <div class="flex gap-4 justify-center">
                    <button onclick="record('Check In')" class="w-full max-w-[160px] py-6 bg-slate-900 text-white rounded-[2rem] shadow-xl hover:-translate-y-1 transition-all active:scale-95 flex flex-col items-center gap-2">
                        <i data-lucide="shield-check" class="w-6 h-6 text-emerald-400"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Check In</span>
                    </button>
                    <button onclick="record('Check Out')" class="w-full max-w-[160px] py-6 bg-white text-slate-900 border border-slate-100 rounded-[2rem] shadow-lg hover:-translate-y-1 transition-all active:scale-95 flex flex-col items-center gap-2">
                        <i data-lucide="log-out" class="w-6 h-6 text-rose-500"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Check Out</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="glass-panel p-6 rounded-[2.5rem] space-y-4 shadow-sm border border-white">
            <div class="flex items-center gap-2 px-2">
                <i data-lucide="pen-tool" class="w-4 h-4 text-indigo-500"></i>
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Daily Journal / Memo</h3>
            </div>
            <textarea id="memo" rows="2" class="w-full bg-white/40 border border-slate-100 rounded-[1.5rem] p-4 text-sm outline-none focus:ring-2 focus:ring-indigo-500/10 transition-all" placeholder="วันนี้ทำอะไรไปบ้าง..."></textarea>
            <button onclick="record('Memo')" class="w-full py-3 bg-slate-100 text-slate-600 rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-slate-200 transition-colors">
                บันทึก Memo ระหว่างวัน
            </button>
        </div>

        <div class="space-y-4">
            <div class="flex items-center justify-between px-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="users" class="w-4 h-4 text-indigo-400"></i>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Team Presence</h3>
                </div>
                <span id="teamCount" class="text-[10px] bg-indigo-50 text-indigo-500 px-2 py-0.5 rounded-full font-bold uppercase">0 Active</span>
            </div>
            <div id="colleagueStatus" class="flex flex-wrap gap-2 px-2"></div>
        </div>

        <div class="space-y-4 pt-4">
            <div class="flex justify-between items-center px-4">
                <h3 class="text-lg font-semibold text-slate-800 tracking-tight">Today's Timeline</h3>
                <button onclick="loadData()" class="p-2 hover:bg-white rounded-full transition-all text-indigo-500">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="myHistoryList" class="space-y-3 px-2"></div>
        </div>
    </div>

    <script>
        // ใช้ URL เดิมของคุณ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzehwXrrfuioHK68BXQGLpKyBPM5ElXZKgRm0o55yzwXgtx_YGkItjkM090zceA_t7Jcg/exec";
        
        const user = sessionStorage.getItem("username") || "Guest";
        const name = sessionStorage.getItem("userName") || sessionStorage.getItem("name") || "พนักงาน";
        document.getElementById('userDisp').innerText = name;

        // Clock & Greeting
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH', { hour12: false });
            const h = now.getHours();
            document.getElementById('greetingText').innerText = h < 12 ? "Good Morning," : h < 17 ? "Good Afternoon," : "Good Evening,";
        }, 1000);
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' });

        // ฟังก์ชันบันทึกเวลา (ปรับให้เสถียรที่สุด)
        async function record(type) {
            if(!user || user === "Guest") return Swal.fire('Oops!', 'กรุณาเข้าสู่ระบบก่อน', 'warning');

            const memoVal = document.getElementById('memo').value;
            const locVal = document.getElementById('location').value;

            Swal.fire({
                title: 'Processing...',
                text: 'กำลังบันทึกลงฐานข้อมูล',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            // ส่งข้อมูลแบบ POST Body (แบบที่หน้าสีฟ้าใช้)
            const payload = {
                action: "recordTime",
                username: user,
                name: name,
                type: type,
                location: locVal,
                memo: memoVal
            };

            try {
                // ลองส่งแบบ POST ปกติก่อน
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if(result.status === "success") {
                    Swal.fire({ icon: 'success', title: 'สำเร็จ', text: `บันทึก ${type} เรียบร้อย`, timer: 1500, showConfirmButton: false });
                    document.getElementById('memo').value = "";
                    loadData();
                } else {
                    throw new Error("API Error");
                }
            } catch(e) {
                console.warn("Retrying with Query Params...");
                // ถ้า POST ติดปัญหา ลองใช้ Query Params (Fallback)
                try {
                    const q = new URLSearchParams(payload).toString();
                    const resBackup = await fetch(`${WEB_APP_URL}?${q}`);
                    const resJson = await resBackup.json();
                    if(resJson.status === "success") {
                        Swal.fire({ icon: 'success', title: 'สำเร็จ', timer: 1500, showConfirmButton: false });
                        document.getElementById('memo').value = "";
                        loadData();
                    }
                } catch(err2) {
                    Swal.fire('Error', 'ไม่สามารถบันทึกได้ กรุณาแจ้งผู้ดูแล', 'error');
                }
            }
        }

        // ฟังก์ชันดึงข้อมูล
        async function loadData() {
            try {
                const res = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({action: "fetchData"}) 
                });
                const data = await res.json();
                const todayStr = new Date().toLocaleDateString();

                // 1. เพื่อนร่วมงาน
                const colleagueBox = document.getElementById('colleagueStatus');
                colleagueBox.innerHTML = "";
                const latest = new Map();
                data.forEach(d => {
                    if(new Date(d.Timestamp).toLocaleDateString() === todayStr) {
                        latest.set(d.Name, { loc: d.Location, type: d.Type });
                    }
                });

                let activeCount = 0;
                latest.forEach((val, key) => {
                    if(val.type !== "Check Out") {
                        activeCount++;
                        colleagueBox.innerHTML += `
                            <div class="flex items-center gap-2 bg-white/60 border border-white px-3 py-1.5 rounded-full shadow-sm">
                                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-emerald"></div>
                                <span class="text-[11px] font-medium text-slate-600">${key}</span>
                                <span class="text-[9px] px-1.5 py-0.5 bg-indigo-50 text-indigo-500 rounded-md font-black uppercase">${val.loc}</span>
                            </div>`;
                    }
                });
                document.getElementById('teamCount').innerText = `${activeCount} Active`;

                // 2. ประวัติส่วนตัว
                const historyList = document.getElementById('myHistoryList');
                historyList.innerHTML = "";
                const myHistory = data.filter(d => d.Username === user).reverse().slice(0, 5);
                
                if(myHistory.length === 0) {
                    historyList.innerHTML = `<p class="text-center py-6 text-slate-300 text-[10px] uppercase tracking-widest">No entries yet</p>`;
                } else {
                    myHistory.forEach(d => {
                        const isIn = d.Type === 'Check In';
                        const isOut = d.Type === 'Check Out';
                        const timeStr = new Date(d.Timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                        historyList.innerHTML += `
                            <div class="glass-panel p-4 rounded-[2rem] flex justify-between items-center border border-white">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-2xl ${isIn ? 'bg-emerald-50 text-emerald-500' : isOut ? 'bg-rose-50 text-rose-500' : 'bg-slate-50 text-slate-500'} flex items-center justify-center">
                                        <i data-lucide="${isIn ? 'log-in' : isOut ? 'log-out' : 'sticky-note'}" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-700 text-sm">${d.Type}</h4>
                                        <p class="text-[10px] text-indigo-400 font-medium uppercase tracking-tighter">${d.Location || 'General'} ${d["WorkSummary/Memo"] ? '• ' + d["WorkSummary/Memo"] : ''}</p>
                                    </div>
                                </div>
                                <p class="text-lg font-bold text-slate-800">${timeStr}</p>
                            </div>`;
                    });

                    // อัปเดตเม็ดไฟ Status บนหัว
                    const statusInd = document.getElementById('statusIndicator');
                    const statusTxt = document.getElementById('statusText');
                    const lastAction = myHistory.find(h => h.Type === 'Check In' || h.Type === 'Check Out');
                    
                    if(lastAction && lastAction.Type === 'Check In') {
                        statusInd.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-emerald";
                        statusTxt.innerText = "Online - Working";
                        statusTxt.className = "text-xs font-bold text-emerald-500 uppercase tracking-widest text-[10px]";
                    } else {
                        statusInd.className = "w-2.5 h-2.5 rounded-full bg-slate-300";
                        statusTxt.innerText = "Offline";
                        statusTxt.className = "text-xs font-bold text-slate-500 uppercase tracking-widest text-[10px]";
                    }
                }
                lucide.createIcons();
            } catch(e) { console.error("Load error", e); }
        }

        window.onload = async () => {
            await loadData();
            document.getElementById('mainLoader').style.opacity = '0';
            setTimeout(() => document.getElementById('mainLoader').style.display = 'none', 600);
            lucide.createIcons();
        };
    </script>

</body>
</html>
