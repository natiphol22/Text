<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check-in | CubicPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #fcfdfe; min-height: 100vh; overflow-x: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.03); }
        .loader-overlay { position: fixed; inset: 0; background: #fff; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .spinner { width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 1. Custom Popup Styles */
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.1); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; transition: all 0.3s; }
        .modal.active { display: flex; }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="loader" class="loader-overlay">
        <div class="spinner mb-4"></div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">CubicPlus Portal</p>
    </div>

    <div id="customAlert" class="modal">
        <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 text-center animate-in fade-in zoom-in duration-300">
            <div id="alertIcon" class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
            <h3 id="alertTitle" class="text-xl font-bold text-slate-800 mb-2">แจ้งเตือน</h3>
            <p id="alertMsg" class="text-slate-500 text-sm mb-8 leading-relaxed">รายละเอียดข้อความแจ้งเตือน</p>
            <button onclick="closeAlert()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-xs uppercase tracking-[0.2em] shadow-lg active:scale-95">ตกลง</button>
        </div>
    </div>

    <div id="locationModal" class="modal">
        <div class="glass-panel w-full max-w-sm rounded-[3rem] p-10 space-y-6">
            <h3 class="text-center font-bold text-slate-800 tracking-tight text-lg">ระบุสถานที่ปฏิบัติงาน</h3>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="confirmRecord('OFFICE')" class="group p-4 bg-slate-50 hover:bg-white border border-transparent hover:border-indigo-100 rounded-2xl text-left flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">🏢</span> <span class="font-semibold text-slate-700">OFFICE</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-indigo-400"></i>
                </button>
                <button onclick="confirmRecord('WFH')" class="group p-4 bg-slate-50 hover:bg-white border border-transparent hover:border-indigo-100 rounded-2xl text-left flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">🏠</span> <span class="font-semibold text-slate-700">WFH</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-indigo-400"></i>
                </button>
                <button onclick="confirmRecord('ON-SITE')" class="group p-4 bg-slate-50 hover:bg-white border border-transparent hover:border-indigo-100 rounded-2xl text-left flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">🚗</span> <span class="font-semibold text-slate-700">ON-SITE</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-indigo-400"></i>
                </button>
            </div>
            <button onclick="closeLocation()" class="w-full text-center text-[10px] text-slate-400 font-bold uppercase py-2 hover:text-rose-500 transition-colors">ยกเลิก</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="flex justify-between items-center px-2">
            <button onclick="location.href='dashboard.html'" class="p-2 -ml-2 text-slate-400 hover:text-indigo-600 transition-all"><i data-lucide="chevron-left"></i></button>
            <div class="text-right">
                <p id="userDisp" class="text-slate-900 font-bold italic text-sm">...</p>
                <p class="text-[9px] uppercase font-bold text-slate-300 tracking-widest leading-none mt-1">CubicPlus Staff</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-panel rounded-[3rem] p-8 md:p-12 text-center border-b-8 border-indigo-500/10">
                    <div id="todayDate" class="text-[10px] uppercase tracking-[0.5em] text-indigo-400 font-bold mb-4"></div>
                    <div id="clock" class="text-7xl md:text-8xl font-extralight text-slate-800 tracking-tighter mb-10 leading-none">00:00:00</div>
                    
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <button id="inBtn" onclick="openLocationModal('Check In')" class="py-6 bg-slate-900 text-white rounded-[2rem] font-bold text-xs uppercase tracking-[0.2em] shadow-2xl active:scale-95 disabled:bg-slate-100 disabled:text-slate-300">
                                Check In
                            </button>
                            <button id="outBtn" onclick="openLocationModal('Check Out')" class="py-6 bg-white text-slate-900 border border-slate-200 rounded-[2rem] font-bold text-xs uppercase tracking-[0.2em] shadow-sm active:scale-95 disabled:bg-slate-50 disabled:text-slate-200">
                                Check Out
                            </button>
                        </div>
                        <div class="text-left bg-white/50 p-6 rounded-[2rem] border border-white">
                            <label class="text-[9px] font-bold text-slate-400 uppercase ml-2 block mb-3 tracking-widest">Daily Summary (บันทึกตอนเลิกงาน)</label>
                            <textarea id="memo" rows="3" class="w-full bg-transparent border-none text-sm focus:ring-0 placeholder:text-slate-300 p-2" placeholder="วันนี้คุณทำอะไรสำเร็จบ้าง..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="px-2">
                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2 px-1">
                        <i data-lucide="history" class="w-3 h-3 text-indigo-400"></i> My Timeline
                    </h4>
                    <div id="myHistoryBody" class="space-y-3"></div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-6">
                <div class="glass-panel rounded-[3rem] p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="users" class="w-3 h-3 text-indigo-400"></i> Team Presence
                        </h4>
                        <span id="activeCount" class="text-[10px] font-bold text-emerald-500 bg-emerald-50 px-3 py-1 rounded-full leading-none">0 ACTIVE</span>
                    </div>
                    <div id="colleagueStatus" class="space-y-3 max-h-[300px] overflow-y-auto pr-1"></div>
                </div>

                <div class="glass-panel rounded-[3rem] p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="calendar" class="w-3 h-3 text-indigo-400"></i> Log History
                        </h4>
                        <div class="flex bg-slate-100 p-1 rounded-xl scale-90">
                            <button onclick="updateRange(7)" id="btn7" class="px-4 py-1.5 rounded-lg font-bold transition-all bg-white shadow-sm text-indigo-600 text-[9px]">7D</button>
                            <button onclick="updateRange(30)" id="btn30" class="px-4 py-1.5 rounded-lg font-bold transition-all text-slate-400 text-[9px]">30D</button>
                        </div>
                    </div>
                    <div id="historyTable" class="space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzehwXrrfuioHK68BXQGLpKyBPM5ElXZKgRm0o55yzwXgtx_YGkItjkM090zceA_t7Jcg/exec";
        const user = sessionStorage.getItem("userName") || sessionStorage.getItem("username");
        const name = sessionStorage.getItem("userName") || "Staff Account";
        let pendingType = '';
        let globalData = [];

        // Check Login Security
        if(!sessionStorage.getItem("isLoggedIn")) {
            showCustomAlert("Oops!", "กรุณาเข้าสู่ระบบก่อน", "alert-triangle", "rose");
            setTimeout(() => window.location.href = "index.html", 2000);
        }

        document.getElementById('userDisp').innerText = name;

        // Custom Popup Functions
        function showCustomAlert(title, msg, icon = "check-circle", color = "indigo") {
            const modal = document.getElementById('customAlert');
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            const iconBox = document.getElementById('alertIcon');
            iconBox.className = `w-16 h-16 bg-${color}-50 text-${color}-500 rounded-full flex items-center justify-center mx-auto mb-6`;
            iconBox.innerHTML = `<i data-lucide="${icon}" class="w-8 h-8"></i>`;
            lucide.createIcons();
            modal.classList.add('active');
        }

        function closeAlert() {
            document.getElementById('customAlert').classList.remove('active');
        }

        // Smart Clock with 30s Delay
        function updateClock() {
            const now = new Date();
            now.setSeconds(now.getSeconds() - 30);
            document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH');
            document.getElementById('todayDate').innerText = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateClock, 1000);

        function openLocationModal(type) {
            pendingType = type;
            document.getElementById('locationModal').classList.add('active');
        }

        function closeLocation() {
            document.getElementById('locationModal').classList.remove('active');
        }

        async function confirmRecord(loc) {
            closeLocation();
            const btn = pendingType === 'Check In' ? document.getElementById('inBtn') : document.getElementById('outBtn');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "WAITING...";

            const finalMemo = (pendingType === 'Check Out') ? document.getElementById('memo').value : "-";

            const payload = {
                action: "recordTime",
                username: user,
                name: name,
                type: pendingType,
                location: loc,
                memo: finalMemo
            };

            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === "success") {
                    showCustomAlert("สำเร็จ", `บันทึก ${pendingType} เรียบร้อยแล้ว`, "check-circle", "emerald");
                    if(pendingType === 'Check Out') document.getElementById('memo').value = "";
                    await loadData();
                }
            } catch(e) {
                await loadData();
                showCustomAlert("บันทึกแล้ว", "ข้อมูลถูกบันทึกลงระบบเรียบร้อย", "check-circle", "emerald");
            } finally {
                btn.innerText = originalText;
            }
        }

        async function loadData() {
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({action: "fetchData"}) });
                globalData = await res.json();
                
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);

                const today = new Date().toLocaleDateString();
                const myLogsToday = globalData.filter(d => (d.Username === user || d.Name === name) && new Date(d.Timestamp).toLocaleDateString() === today);

                const hasIn = myLogsToday.some(d => d.Type === "Check In");
                const hasOut = myLogsToday.some(d => d.Type === "Check Out");
                
                document.getElementById('inBtn').disabled = hasIn;
                document.getElementById('outBtn').disabled = !hasIn || hasOut;

                renderUI();
                lucide.createIcons();
            } catch(e) { console.log(e); }
        }

        function renderUI() {
            const historyBox = document.getElementById("myHistoryBody");
            historyBox.innerHTML = "";
            globalData.filter(d => d.Username === user || d.Name === name).reverse().slice(0, 3).forEach(d => {
                const time = new Date(d.Timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                historyBox.innerHTML += `
                <div class="glass-panel p-4 rounded-2xl flex justify-between items-center text-[11px] border border-white">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full ${d.Type === 'Check In' ? 'bg-emerald-50 text-emerald-500' : 'bg-rose-50 text-rose-500'} flex items-center justify-center">
                            <i data-lucide="${d.Type === 'Check In' ? 'log-in' : 'log-out'}" class="w-3 h-3"></i>
                        </div>
                        <div>
                            <p class="font-bold text-slate-800 tracking-wide">${d.Type.toUpperCase()}</p>
                            <p class="text-[9px] text-slate-400 font-medium">at ${d.Location}</p>
                        </div>
                    </div>
                    <span class="font-bold text-slate-700 bg-white px-3 py-1 rounded-full shadow-sm">${time} น.</span>
                </div>`;
            });

            // 2. Team Status - Show WHO and WHERE
            const colleagueBox = document.getElementById("colleagueStatus");
            colleagueBox.innerHTML = "";
            const today = new Date().toLocaleDateString();
            const latestMap = new Map();
            globalData.forEach(d => {
                if (new Date(d.Timestamp).toLocaleDateString() === today) latestMap.set(d.Name, d);
            });
            
            let activeCount = 0;
            latestMap.forEach((v, k) => {
                const isOnline = v.Type === "Check In";
                if(isOnline) activeCount++;
                
                const locIcon = v.Location === 'OFFICE' ? '🏢' : v.Location === 'WFH' ? '🏠' : '🚗';

                colleagueBox.innerHTML += `
                <div class="flex items-center justify-between p-4 bg-white/40 rounded-[1.5rem] border border-white text-[10px] transition-all hover:bg-white/80">
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-xs border-2 border-white shadow-sm">${k.charAt(0)}</div>
                            <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-white ${isOnline ? 'bg-emerald-500' : 'bg-slate-300'}"></div>
                        </div>
                        <div>
                            <p class="font-bold text-slate-700">${k}</p>
                            <p class="text-[9px] text-slate-400 flex items-center gap-1">${locIcon} ${v.Location}</p>
                        </div>
                    </div>
                    <span class="px-3 py-1 rounded-lg font-bold tracking-tighter ${isOnline ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-50 text-slate-400'}">
                        ${v.Type.replace('Check ', '').toUpperCase()}
                    </span>
                </div>`;
            });
            document.getElementById('activeCount').innerText = `${activeCount} ACTIVE`;

            updateRange(7);
        }

        function updateRange(days) {
            const table = document.getElementById("historyTable");
            table.innerHTML = "";
            const myLogs = globalData.filter(d => d.Username === user || d.Name === name);
            const reportMap = new Map();
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);

            myLogs.forEach(log => {
                const logDate = new Date(log.Timestamp);
                if (logDate >= cutoff) {
                    const dStr = logDate.toLocaleDateString('th-TH', {day:'2-digit', month:'2-digit'});
                    if (!reportMap.has(dStr)) reportMap.set(dStr, {in:'-', out:'-'});
                    if (log.Type === "Check In") reportMap.get(dStr).in = logDate.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
                    if (log.Type === "Check Out") reportMap.get(dStr).out = logDate.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
                }
            });

            Array.from(reportMap.keys()).reverse().forEach(date => {
                const v = reportMap.get(date);
                table.innerHTML += `
                <div class="flex justify-between items-center p-3 hover:bg-indigo-50/30 rounded-xl transition-colors text-[10px]">
                    <span class="text-slate-400 font-bold tracking-tighter">${date}</span>
                    <div class="flex gap-6">
                        <div class="flex flex-col items-center">
                            <span class="text-emerald-500 font-bold">${v.in}</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-rose-400 font-bold">${v.out}</span>
                        </div>
                    </div>
                </div>`;
            });
        }

        window.onload = () => { lucide.createIcons(); loadData(); };
    </script>
</body>
</html>
