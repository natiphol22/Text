<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant | CubicPlus Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #f8fafc;
            /* โทนสีพื้นหลังแบบเดียวกับหน้าอื่นๆ */
            background-image: radial-gradient(at 10% 0%, hsla(228, 100%, 74%, 0.15) 0px, transparent 50%), radial-gradient(at 80% 0%, hsla(189, 100%, 56%, 0.15) 0px, transparent 50%);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* สไตล์กล่องข้อความแชท */
        .chat-bubble-ai { background: #eef2ff; color: #1e293b; border-bottom-left-radius: 0; }
        .chat-bubble-user { background: #4f46e5; color: #ffffff; border-bottom-right-radius: 0; }
    </style>
</head>
<body class="p-4 md:p-6 lg:p-10">

    <div class="max-w-4xl mx-auto h-full flex flex-col glass-panel rounded-[2rem] overflow-hidden relative">
        
        <div class="h-20 border-b border-slate-100 flex items-center justify-between px-6 bg-white/50 shrink-0">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-primary-600 transition-colors"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-primary-500"></i> CubicPlus AI
                    </h1>
                    <p class="text-xs text-emerald-500 font-medium flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online</p>
                </div>
            </div>
            <button class="px-4 py-2 bg-slate-50 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-100 transition-colors flex items-center gap-2">
                <i data-lucide="book-plus" class="w-4 h-4"></i> สอน AI
            </button>
        </div>

        <div id="chatArea" class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6 bg-slate-50/30">
            <div class="flex justify-start">
                <div class="w-8 h-8 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center shrink-0 mr-3 border border-primary-200"><i data-lucide="bot" class="w-4 h-4"></i></div>
                <div class="max-w-[80%] chat-bubble-ai px-5 py-3 rounded-2xl shadow-sm border border-primary-50 text-sm leading-relaxed">
                    สวัสดีครับ! ผมคือผู้ช่วย AI ของ CubicPlus วันนี้มีอะไรให้ผมช่วยไหมครับ? คุณสามารถพิมพ์คำถาม หรือเลือกจากหัวข้อด้านล่างได้เลยครับ
                </div>
            </div>
        </div>

        <div class="px-6 py-3 overflow-x-auto whitespace-nowrap custom-scrollbar flex gap-2 border-t border-slate-100 bg-white/40">
            <button class="px-4 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-bold hover:border-primary-300 hover:text-primary-600 shadow-sm transition-all">ตั้งค่า NAS เบื้องต้น</button>
            <button class="px-4 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-bold hover:border-primary-300 hover:text-primary-600 shadow-sm transition-all">ตรวจสอบประกัน ARS</button>
            <button class="px-4 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-bold hover:border-primary-300 hover:text-primary-600 shadow-sm transition-all">เบิกค่าเดินทาง</button>
        </div>

        <div class="p-4 bg-white/60 border-t border-slate-100 shrink-0">
            <div class="relative flex items-center">
                <input type="text" id="chatInput" placeholder="พิมพ์คำถามของคุณที่นี่..." class="w-full pl-6 pr-14 py-4 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-primary-400 focus:ring-4 focus:ring-primary-50 transition-all shadow-sm">
                <button class="absolute right-2 p-2.5 bg-primary-600 text-white rounded-xl hover:bg-primary-700 transition-colors shadow-md">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
