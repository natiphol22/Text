<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synology Super AI Support</title>
    
    <link rel="icon" type="image/png" href="LOGO.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind & Icons & Alerts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- OCR AI Engine (Tesseract.js v5) สำหรับอ่านรูปภาพ -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' } },
                    animation: { 
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'bounce-soft': 'bounceSoft 1.4s infinite ease-in-out both'
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px) scale(0.98)' },
                            '100%': { opacity: 1, transform: 'translateY(0) scale(1)' }
                        },
                        bounceSoft: {
                            '0%, 80%, 100%': { transform: 'scale(0)' },
                            '40%': { transform: 'scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.15) 0px, transparent 50%);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            padding: 1rem;
        }
        @media (min-width: 768px) { body { padding: 2rem; } }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(24px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px;}
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .swal2-popup { font-family: 'Kanit', sans-serif !important; border-radius: 1.5rem !important; }
        
        /* สไตล์ Bubble ของแชท */
        .chat-bubble-ai { background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%); border: 1px solid #e2e8f0; }
        .chat-bubble-user { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2); }
    </style>
</head>
<body>

    <div class="max-w-5xl mx-auto w-full h-full flex flex-col glass-panel rounded-3xl overflow-hidden relative shadow-2xl">
        
        <!-- ================= HEADER ================= -->
        <div class="h-[76px] border-b border-slate-200 flex items-center justify-between px-4 md:px-6 bg-white/90 shrink-0 backdrop-blur-xl z-20">
            <div class="flex items-center gap-3 md:gap-4">
                <div class="relative w-12 h-12 rounded-2xl bg-gradient-to-br from-primary-600 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-primary-500/30 border border-white/20">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                    <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-400 border-2 border-white rounded-full animate-pulse"></div>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold text-slate-800 leading-tight flex items-center gap-2">
                        Synology AI 
                        <span class="bg-primary-100 text-primary-700 text-[9px] px-2 py-0.5 rounded-full uppercase tracking-widest font-black">Vision</span>
                    </h1>
                    <p class="text-[11px] md:text-xs text-slate-500 font-medium">ถาม-ตอบ & วิเคราะห์ภาพอัจฉริยะ</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5 md:gap-2">
                <button onclick="showFAQPopup()" class="p-2 md:p-2.5 text-amber-500 hover:bg-amber-50 rounded-xl transition-all border border-transparent hover:border-amber-200" title="คำถามพบบ่อย">
                    <i data-lucide="lightbulb" class="w-5 h-5"></i>
                </button>
                <button onclick="undoLastMessage()" class="p-2 md:p-2.5 text-slate-500 hover:text-primary-600 hover:bg-primary-50 rounded-xl transition-all border border-transparent hover:border-primary-200" title="ย้อนกลับ (Ctrl+Z)">
                    <i data-lucide="undo-2" class="w-5 h-5"></i>
                </button>
                <button onclick="clearChat()" class="p-2 md:p-2.5 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all border border-transparent hover:border-rose-200" title="ล้างหน้าจอ">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
                <div class="w-px h-6 bg-slate-200 mx-1"></div>
                <button onclick="openTeachAI()" class="px-3 py-2 md:px-4 md:py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-black hover:scale-105 transition-all flex items-center gap-2 shadow-lg shadow-slate-900/20">
                    <i data-lucide="database-zap" class="w-4 h-4"></i> <span class="hidden sm:block">สอน AI</span>
                </button>
            </div>
        </div>

        <!-- ================= CHAT AREA ================= -->
        <div class="flex-1 flex flex-col overflow-hidden bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-slate-50/60 relative">
            
            <div id="chatMessages" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 space-y-6 scroll-smooth">
                <!-- Welcome Message จะถูกสร้างผ่าน JS -->
            </div>
            
            <!-- Input Area -->
            <div class="p-4 bg-white/80 backdrop-blur-md border-t border-slate-200 shrink-0 relative z-10 shadow-[0_-10px_40px_rgba(0,0,0,0.03)]">
                
                <div class="relative flex items-end max-w-4xl mx-auto gap-2 md:gap-3">
                    <!-- ปุ่มแนบรูป (Vision AI) -->
                    <button onclick="document.getElementById('imageUpload').click()" class="p-3.5 md:p-4 bg-white text-slate-500 rounded-2xl hover:bg-primary-50 hover:text-primary-600 transition-all shrink-0 border border-slate-200 shadow-sm group relative" title="อัปโหลดรูปภาพเพื่อดึง รุ่น/SN">
                        <i data-lucide="image-plus" class="w-5 h-5 md:w-6 md:h-6 group-hover:scale-110 transition-transform"></i>
                        <span class="absolute -top-1.5 -right-1.5 flex h-3.5 w-3.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-primary-500 border-2 border-white"></span>
                        </span>
                    </button>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

                    <!-- กล่องข้อความแบบขยายได้ -->
                    <div class="relative flex-1 bg-white border border-slate-200 rounded-2xl shadow-sm focus-within:border-primary-500 focus-within:ring-4 focus-within:ring-primary-50 transition-all overflow-hidden flex items-center">
                        <textarea id="chatInput" rows="1" placeholder="พิมพ์คำถามที่นี่ หรือกด Shift+Enter เพื่อขึ้นบรรทัดใหม่..." 
                                  class="w-full pl-4 md:pl-5 pr-14 py-4 md:py-4 bg-transparent text-sm md:text-base focus:outline-none resize-none custom-scrollbar max-h-32 text-slate-700"
                                  onkeydown="handleKeydown(event)" oninput="autoResize(this)"></textarea>
                        <button onclick="handleChatSubmit()" class="absolute right-2 bottom-2 p-2.5 bg-gradient-to-r from-primary-600 to-blue-600 text-white rounded-xl hover:shadow-lg hover:shadow-primary-500/40 hover:-translate-y-0.5 transition-all flex items-center justify-center">
                            <i data-lucide="send" class="w-4 h-4 md:w-5 md:h-5 ml-0.5"></i>
                        </button>
                    </div>
                </div>
                
                <div class="text-center mt-3 hidden md:flex justify-center items-center gap-6 text-[10px] text-slate-400 font-medium">
                    <span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-200 rounded-md text-slate-500 font-mono">Enter</kbd> ส่งข้อความ</span>
                    <span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-200 rounded-md text-slate-500 font-mono">Shift + Enter</kbd> ขึ้นบรรทัดใหม่</span>
                    <span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-200 rounded-md text-slate-500 font-mono">Ctrl + Z</kbd> เลิกทำล่าสุด</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ใส่ URL Web App ของคุณ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxI6bmlpJslBjsT-zaedzjl1O3DxxJRtCDwry9-8whtsfwi6bAFiid6i-h7nU6_vxDS/exec";
        let masterData = [];
        let chatHistory = []; // เก็บ History เพื่อทำ Undo

        window.onload = () => {
            lucide.createIcons();
            initWelcomeMessage();
            loadData();
        };

        // --- ระบบ Auto Resize Textarea ---
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight < 128 ? el.scrollHeight : 128) + 'px';
        }

        // --- ระบบคีย์บอร์ดลัด ---
        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); 
                handleChatSubmit();
            }
            if (event.ctrlKey && event.key === 'z') {
                event.preventDefault();
                undoLastMessage();
            }
        }

        // --- ล้างหน้าจอ ---
        function clearChat() {
            if(document.getElementById('chatMessages').children.length <= 1) return; // ถ้ามีแค่ข้อความแรกไม่ต้องล้าง
            
            Swal.fire({
                title: 'ยืนยันการล้างแชท?', text: "ข้อความสนทนาทั้งหมดจะหายไป", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#cbd5e1',
                confirmButtonText: 'ใช่, ล้างเลย', cancelButtonText: 'ยกเลิก',
                customClass: { popup: 'rounded-2xl' }
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('chatMessages').innerHTML = '';
                    chatHistory = [];
                    initWelcomeMessage();
                }
            });
        }

        // --- Undo (Ctrl+Z) ---
        function undoLastMessage() {
            if (chatHistory.length === 0) return;
            const lastPair = chatHistory.pop(); 
            
            const userMsg = document.getElementById(lastPair.user);
            const aiMsg = document.getElementById(lastPair.ai);
            
            if(userMsg) userMsg.remove();
            if(aiMsg) aiMsg.remove();
            
            // ถ้าเป็นข้อความ (ไม่ใช่รูปภาพ) ให้คืนค่ากลับไปที่ Input
            if(lastPair.text !== "(ส่งรูปภาพ)") {
                const inputEl = document.getElementById('chatInput');
                inputEl.value = lastPair.text;
                autoResize(inputEl);
                inputEl.focus();
            }
        }

        // --- โหลดข้อมูล Knowledge Base ---
        async function loadData() {
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "getSupportData" }) });
                const result = await res.json();
                if(result.status === "success") { masterData = result.data.reverse(); }
            } catch (error) { console.error("Database connection failed."); }
        }

        // --- FAQ Popup ---
        function showFAQPopup() {
            Swal.fire({
                title: '<div class="flex items-center justify-center gap-2 text-amber-500"><i data-lucide="lightbulb" class="w-6 h-6"></i> คำถามที่พบบ่อย</div>',
                html: `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4 text-left">
                        <button onclick="Swal.close(); triggerFAQ('ลืมรหัสผ่าน admin ต้องทำยังไง?')" class="p-4 bg-white border border-slate-200 rounded-2xl hover:border-primary-400 hover:shadow-md transition-all flex items-start gap-3 group">
                            <div class="p-2 bg-amber-50 rounded-lg group-hover:bg-amber-100 transition-colors"><i data-lucide="key" class="w-5 h-5 text-amber-500"></i></div>
                            <div><div class="text-sm font-bold text-slate-800">รีเซ็ตรหัสผ่าน</div><div class="text-[10px] text-slate-500 mt-1">ลืมรหัส Admin เข้าเครื่องไม่ได้</div></div>
                        </button>
                        <button onclick="Swal.close(); triggerFAQ('อัปเดต DSM ไม่ได้')" class="p-4 bg-white border border-slate-200 rounded-2xl hover:border-primary-400 hover:shadow-md transition-all flex items-start gap-3 group">
                            <div class="p-2 bg-blue-50 rounded-lg group-hover:bg-blue-100 transition-colors"><i data-lucide="refresh-cw" class="w-5 h-5 text-blue-500"></i></div>
                            <div><div class="text-sm font-bold text-slate-800">อัปเดต DSM</div><div class="text-[10px] text-slate-500 mt-1">อัปเดตล้มเหลว หรือค้าง</div></div>
                        </button>
                        <button onclick="Swal.close(); triggerFAQ('แจ้งเตือน Bad Sector')" class="p-4 bg-white border border-slate-200 rounded-2xl hover:border-primary-400 hover:shadow-md transition-all flex items-start gap-3 group">
                            <div class="p-2 bg-rose-50 rounded-lg group-hover:bg-rose-100 transition-colors"><i data-lucide="hard-drive" class="w-5 h-5 text-rose-500"></i></div>
                            <div><div class="text-sm font-bold text-slate-800">Bad Sector</div><div class="text-[10px] text-slate-500 mt-1">ฮาร์ดดิสก์แจ้งเตือนสีแดง</div></div>
                        </button>
                        <button onclick="Swal.close(); triggerFAQ('ไฟกระพริบสีส้ม')" class="p-4 bg-white border border-slate-200 rounded-2xl hover:border-primary-400 hover:shadow-md transition-all flex items-start gap-3 group">
                            <div class="p-2 bg-orange-50 rounded-lg group-hover:bg-orange-100 transition-colors"><i data-lucide="alert-triangle" class="w-5 h-5 text-orange-500"></i></div>
                            <div><div class="text-sm font-bold text-slate-800">ไฟ Status กระพริบ</div><div class="text-[10px] text-slate-500 mt-1">ไฟสีส้มกระพริบหน้าเครื่อง</div></div>
                        </button>
                    </div>
                `,
                showConfirmButton: false, showCloseButton: true, width: '600px', customClass: { popup: 'rounded-3xl' }
            });
            setTimeout(() => lucide.createIcons(), 50);
        }

        function triggerFAQ(q) {
            document.getElementById('chatInput').value = q;
            handleChatSubmit();
        }

        // --- ระบบแสดงผลแชท (UI) ---
        function getTimestamp() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        function initWelcomeMessage() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = `
                <div class="flex gap-3 animate-slide-up w-full">
                    <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-gradient-to-br from-primary-600 to-blue-600 flex items-center justify-center text-white shadow-lg shrink-0 border-2 border-white"><i data-lucide="bot" class="w-5 h-5 md:w-6 md:h-6"></i></div>
                    <div class="chat-bubble-ai p-4 md:p-5 rounded-2xl rounded-tl-none shadow-sm text-sm text-slate-700 max-w-[85%] relative">
                        <p class="font-bold text-primary-800 text-base mb-2 border-b border-slate-200 pb-2">สวัสดีครับ! ผมคือ Synology AI 🤖</p>
                        <p class="mb-2 leading-relaxed">มีปัญหาอะไรให้ผมช่วยดูแลระบบ NAS ของคุณวันนี้ครับ? พิมพ์อาการด้านล่างมาได้เลย</p>
                        <div class="bg-primary-50 p-3 rounded-xl border border-primary-100 text-xs text-primary-700 flex items-start gap-2">
                            <i data-lucide="info" class="w-4 h-4 shrink-0 mt-0.5"></i>
                            <p><b>ทริคลับ:</b> กดปุ่ม <kbd class="px-1.5 py-0.5 bg-white border rounded shadow-sm text-[10px] mx-1"><i data-lucide="image-plus" class="w-3 h-3 inline text-slate-500"></i></kbd> เพื่อส่งรูปภาพสติ๊กเกอร์หลังเครื่องให้ผมสแกนหา <b>Serial Number</b> หรือ <b>รุ่น</b> ให้ได้ทันทีครับ!</p>
                        </div>
                        <span class="absolute -bottom-6 left-2 text-[10px] text-slate-400 font-medium">${getTimestamp()}</span>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- การประมวลผลข้อความ ---
        function handleChatSubmit() {
            const inputEl = document.getElementById('chatInput');
            let text = inputEl.value.trim();
            if(!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto'; 
            
            const userId = appendChatMessage('user', text);
            const typingId = appendChatPlaceholder();

            setTimeout(() => {
                const aiId = processAIResponse(text, typingId);
                chatHistory.push({ user: userId, ai: aiId, text: text });
            }, 800);
        }

        function processAIResponse(text, typingId) {
            const lowerText = text.toLowerCase();
            let matches = [];

            // ระบบให้คะแนนอัจฉริยะ
            masterData.forEach(item => {
                let score = 0;
                let qText = item.question.toLowerCase();
                let kText = item.keywords.toLowerCase();

                if(qText.includes(lowerText)) score += 20;
                if(kText.includes(lowerText)) score += 15;
                
                const keywords = lowerText.split(/[\s,]+/).filter(w => w.length > 2);
                keywords.forEach(word => {
                    if(kText.includes(word)) score += 5;
                    if(qText.includes(word)) score += 3;
                    if(item.answer.toLowerCase().includes(word)) score += 1;
                });

                if(score > 0) matches.push({ item: item, score: score });
            });

            matches.sort((a, b) => b.score - a.score);
            document.getElementById(typingId).remove();

            const aiId = 'msg-' + Date.now(); 

            if(matches.length > 0 && matches[0].score >= 8) {
                const bm = matches[0].item;
                let res = `<div class="font-bold text-slate-800 mb-2 border-b border-slate-200 pb-2 flex items-center gap-2"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500"></i> ${bm.question}</div>`;
                res += `<div class="whitespace-pre-wrap leading-relaxed text-slate-700 mb-4">${bm.answer}</div>`;
                
                res += `<div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-100 pt-3">`;
                
                if(bm.link && bm.link !== '-') {
                    let url = bm.link.startsWith('http') ? bm.link : 'https://' + bm.link;
                    res += `<a href="${url}" target="_blank" class="text-[11px] font-bold text-primary-600 hover:text-white hover:bg-primary-600 border border-primary-200 transition-colors flex items-center gap-1.5 bg-primary-50 px-3 py-1.5 rounded-lg w-max shadow-sm"><i data-lucide="external-link" class="w-3 h-3"></i> ดูคู่มืออ้างอิง</a>`;
                } else {
                    res += `<div></div>`;
                }
                
                res += `<button onclick="copyToClipboard(this, \`${bm.answer.replace(/`/g, '\\`')}\`)" class="text-[11px] text-slate-500 hover:text-primary-700 font-medium flex items-center gap-1.5 bg-white border border-slate-200 hover:border-primary-300 px-3 py-1.5 rounded-lg transition-all shadow-sm"><i data-lucide="copy" class="w-3 h-3"></i> คัดลอกคำตอบ</button></div>`;
                
                appendAIMessage(aiId, res, bm.category);
            } else {
                appendAIMessage(aiId, `<p class="leading-relaxed">ขออภัยครับ ผมยังไม่มีข้อมูลในส่วนนี้ 🥲<br>ลองเปลี่ยนคำค้นหา หรือสามารถกดปุ่ม <kbd class="px-2 py-0.5 bg-slate-900 text-white rounded text-[10px] mx-1"><i data-lucide="database-zap" class="w-3 h-3 inline"></i> สอน AI</kbd> ที่มุมขวาบนเพื่อเพิ่มฐานข้อมูลนี้ได้เลยครับ</p>`, "ไม่พบข้อมูล");
            }
            return aiId;
        }

        // --- ระบบอ่านรูปภาพ (OCR) ด้วย Tesseract ---
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            const objUrl = URL.createObjectURL(file);
            const userId = appendChatMessage('user', `<img src="${objUrl}" class="max-w-[220px] md:max-w-[280px] rounded-xl border-2 border-white/20 shadow-md">`);
            
            const typingId = appendChatPlaceholder('Vision AI กำลังวิเคราะห์รูปภาพ...');

            try {
                const result = await Tesseract.recognize(file, 'eng');
                const text = result.data.text;
                
                document.getElementById(typingId).remove();

                const modelRegex = /(?:DS|RS|FS|SA|UC|NVR|VS|RX|DX|FX)[0-9]{2,4}[a-zA-Z0-9]*\+?/gi;
                const models = text.match(modelRegex) || [];
                const uniqueModels = [...new Set(models)];

                const snRegex = /\b[A-Z0-9]{13}\b/g;
                const sns = text.match(snRegex) || [];
                const uniqueSns = [...new Set(sns)];

                const aiId = 'msg-' + Date.now();
                let reply = `<div class="font-bold text-primary-700 flex items-center gap-2 mb-3 border-b border-primary-100 pb-2"><i data-lucide="scan-line" class="w-5 h-5"></i> วิเคราะห์รูปภาพสำเร็จ</div>`;
                
                if (uniqueModels.length > 0 || uniqueSns.length > 0) {
                    reply += `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3 mb-3 shadow-inner">`;
                    if (uniqueModels.length > 0) reply += `<div><span class="text-[10px] font-bold text-slate-400 block uppercase tracking-wider mb-1">Device Model</span><span class="font-bold text-primary-700 text-lg bg-primary-50 px-2 py-1 rounded-lg">${uniqueModels[0]}</span></div>`;
                    if (uniqueSns.length > 0) reply += `<div><span class="text-[10px] font-bold text-slate-400 block uppercase tracking-wider mb-1">Serial Number</span><span class="font-mono bg-white border border-slate-200 px-3 py-1 rounded-lg text-sm text-slate-700 font-bold tracking-widest shadow-sm flex items-center justify-between w-full">${uniqueSns[0]} <button onclick="copyToClipboard(this, '${uniqueSns[0]}')" class="text-slate-400 hover:text-primary-600"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button></span></div>`;
                    reply += `</div>`;
                    reply += `<p class="text-sm text-slate-600">ให้ผมช่วยเช็คข้อมูลหรือมีคำถามเกี่ยวกับการใช้งานรุ่นนี้ไหมครับ?</p>`;
                } else {
                    reply += `<p class="text-sm text-slate-600 mb-2">ผมพยายามสแกนแล้ว แต่ไม่พบเลขรุ่น หรือ Serial Number ที่ชัดเจนในรูปนี้ครับ ข้อความที่อ่านได้มีประมาณนี้:</p>`;
                    reply += `<pre class="bg-slate-800 p-3 rounded-xl text-[10px] text-emerald-400 max-h-32 overflow-y-auto font-mono custom-scrollbar shadow-inner whitespace-pre-wrap">${text.substring(0, 200)}...</pre>`;
                }

                appendAIMessage(aiId, reply, "Vision AI");
                chatHistory.push({ user: userId, ai: aiId, text: "(ส่งรูปภาพ)" });

            } catch (err) {
                document.getElementById(typingId).remove();
                appendAIMessage('msg-' + Date.now(), `เกิดข้อผิดพลาดในการประมวลผลรูปภาพครับ กรุณาลองอัปโหลดรูปที่ชัดเจนกว่านี้อีกครั้ง`, "Error");
            }
            
            event.target.value = '';
        }

        // --- Core UI Append Functions (Fix Bug โหลดหน้าขาว) ---
        function appendChatMessage(sender, htmlContent) {
            const container = document.getElementById('chatMessages');
            const msgId = 'msg-user-' + Date.now();
            const div = document.createElement('div');
            
            div.id = msgId;
            div.className = 'flex gap-3 justify-end animate-slide-up w-full relative mb-8';
            div.innerHTML = `
                <div class="chat-bubble-user p-3 md:p-4 rounded-2xl rounded-tr-none text-sm md:text-base max-w-[85%] break-words whitespace-pre-wrap leading-relaxed shadow-lg shadow-primary-500/20">
                    ${htmlContent}
                </div>
                <span class="absolute -bottom-6 right-2 text-[10px] text-slate-400 font-medium">${getTimestamp()}</span>
            `;
            
            container.appendChild(div);
            scrollToBottom();
            return msgId;
        }

        function appendChatPlaceholder(msg = '') {
            const container = document.getElementById('chatMessages');
            const msgId = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = msgId;
            div.className = 'flex gap-3 animate-slide-up w-full mb-6 relative';
            div.innerHTML = `
                <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-gradient-to-br from-primary-600 to-blue-600 flex items-center justify-center text-white shadow-lg shrink-0 border-2 border-white"><i data-lucide="bot" class="w-5 h-5 md:w-6 md:h-6"></i></div>
                <div class="chat-bubble-ai px-4 py-3 md:py-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-3">
                    <div class="flex gap-1.5">
                        <span class="w-2 h-2 bg-primary-400 rounded-full animate-[bounceSoft_1.4s_infinite_ease-in-out_both]" style="animation-delay: -0.32s"></span>
                        <span class="w-2 h-2 bg-primary-400 rounded-full animate-[bounceSoft_1.4s_infinite_ease-in-out_both]" style="animation-delay: -0.16s"></span>
                        <span class="w-2 h-2 bg-primary-400 rounded-full animate-[bounceSoft_1.4s_infinite_ease-in-out_both]"></span>
                    </div>
                    ${msg ? `<span class="text-xs text-slate-500 font-medium animate-pulse">${msg}</span>` : ''}
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
            lucide.createIcons();
            return msgId;
        }

        // ใช้ Fade-in HTML โดยตรงแทน Typewriter เพื่อป้องกันบัคโครงสร้าง HTML พัง
        function appendAIMessage(id, htmlString, category) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex gap-3 animate-slide-up w-full relative mb-8';
            
            let catBadge = category ? `<span class="text-[9px] bg-indigo-50 text-indigo-700 border border-indigo-100 px-2 py-0.5 rounded-full font-bold uppercase mb-2 inline-block shadow-sm tracking-wider">${category}</span><br>` : '';
            
            div.innerHTML = `
                <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-gradient-to-br from-primary-600 to-blue-600 flex items-center justify-center text-white shadow-lg shrink-0 border-2 border-white"><i data-lucide="bot" class="w-5 h-5 md:w-6 md:h-6"></i></div>
                <div class="chat-bubble-ai p-4 md:p-5 rounded-2xl rounded-tl-none shadow-md text-sm md:text-base max-w-[85%] w-full overflow-hidden">
                    ${catBadge}
                    <div class="text-slate-700">${htmlString}</div>
                </div>
                <span class="absolute -bottom-6 left-14 md:left-16 text-[10px] text-slate-400 font-medium">${getTimestamp()}</span>
            `;
            container.appendChild(div);
            lucide.createIcons({root: div});
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        function copyToClipboard(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600"></i> <span class="text-emerald-600 font-bold">คัดลอกสำเร็จ</span>`;
                btn.classList.add('bg-emerald-50', 'border-emerald-200');
                lucide.createIcons();
                setTimeout(() => { 
                    btn.innerHTML = originalHtml; 
                    btn.classList.remove('bg-emerald-50', 'border-emerald-200');
                    lucide.createIcons(); 
                }, 2000);
            });
        }

        // --- ระบบสอน AI ---
        function openTeachAI() {
            Swal.fire({
                title: '<div class="flex items-center justify-center gap-2 text-slate-800"><i data-lucide="database-zap" class="w-6 h-6 text-primary-600"></i> สอนความรู้ให้ AI</div>',
                html: `
                    <div class="text-left space-y-3 mt-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="col-span-2 sm:col-span-1">
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">หมวดหมู่</label>
                                <select id="ai-cat" class="w-full mt-1 p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:border-primary-400 outline-none transition-colors">
                                    <option value="Disk/Storage">Disk / Storage</option>
                                    <option value="Network">Network / IP</option>
                                    <option value="Login/Account">Login / Account</option>
                                    <option value="Backup">Backup</option>
                                    <option value="DSM Update">DSM Update</option>
                                    <option value="อื่นๆ">อื่นๆ</option>
                                </select>
                            </div>
                            <div class="col-span-2 sm:col-span-1">
                                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">ลิงก์อ้างอิง</label>
                                <input id="ai-link" class="w-full mt-1 p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:border-primary-400 outline-none transition-colors" placeholder="https://kb.synology.com/...">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">คำถาม / อาการ</label>
                            <input id="ai-q" class="w-full mt-1 p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:border-primary-400 outline-none transition-colors" placeholder="เช่น ลืมรหัสผ่าน Admin">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">คำตอบ / วิธีแก้ไข</label>
                            <textarea id="ai-a" rows="4" class="w-full mt-1 p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:border-primary-400 outline-none transition-colors custom-scrollbar resize-none" placeholder="อธิบายขั้นตอน..."></textarea>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">คีย์เวิร์ด</label>
                            <input id="ai-kw" class="w-full mt-1 p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:border-primary-400 outline-none transition-colors" placeholder="รหัส,ลืมพาส,admin">
                        </div>
                    </div>
                `,
                showCancelButton: true, confirmButtonColor: '#0f172a', cancelButtonColor: '#f1f5f9',
                confirmButtonText: 'บันทึกข้อมูลเข้าฐาน', cancelButtonText: '<span class="text-slate-600">ยกเลิก</span>',
                width: '600px', customClass: { popup: 'rounded-3xl' },
                preConfirm: () => {
                    const q = document.getElementById('ai-q').value.trim();
                    const a = document.getElementById('ai-a').value.trim();
                    if (!q || !a) { Swal.showValidationMessage('กรุณากรอก คำถาม และ คำตอบ ให้ครบถ้วน'); return false; }
                    return {
                        action: "addKnowledge", category: document.getElementById('ai-cat').value,
                        link: document.getElementById('ai-link').value.trim() || "-",
                        question: q, keywords: document.getElementById('ai-kw').value.trim(), answer: a
                    }
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(result.value) });
                        const resJson = await res.json();
                        if(resJson.status === "success") {
                            Swal.fire({ icon: 'success', title: 'เยี่ยมมาก!', text: 'AI เรียนรู้ข้อมูลใหม่เรียบร้อยแล้ว', timer: 2000, showConfirmButton: false, customClass: { popup: 'rounded-3xl' } });
                            loadData(); 
                        } else { Swal.fire('ผิดพลาด', 'ไม่สามารถบันทึกได้', 'error'); }
                    } catch (e) { Swal.fire('ผิดพลาด', 'การเชื่อมต่อขัดข้อง', 'error'); }
                }
            });
            setTimeout(() => lucide.createIcons(), 50);
        }
    </script>
</body>
</html>
