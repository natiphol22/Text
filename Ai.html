<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assistant | CubicPlus</title>
    
    <link rel="icon" type="image/png" href="LOGO.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 10% 0%, hsla(228, 100%, 74%, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189, 100%, 56%, 0.15) 0px, transparent 50%);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px;}
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .chat-bubble-ai { background: #eef2ff; color: #1e293b; border-bottom-left-radius: 0; }
        .chat-bubble-user { background: #4f46e5; color: #ffffff; border-bottom-right-radius: 0; }
        
        .swal2-popup { font-family: 'Kanit', sans-serif !important; border-radius: 1.5rem !important; }
    </style>
</head>
<body class="p-4 md:p-6 lg:p-10 selection:bg-primary-200 selection:text-primary-900">

    <div class="max-w-4xl mx-auto h-full flex flex-col glass-panel rounded-[2rem] overflow-hidden relative shadow-2xl border border-slate-100">
        
        <div class="h-20 border-b border-slate-100 flex items-center justify-between px-4 md:px-6 bg-white/60 shrink-0 backdrop-blur-md z-10">
            <div class="flex items-center gap-3 md:gap-4">
                <a href="dashboard.html" class="p-2 bg-white rounded-xl shadow-sm border border-slate-200 text-slate-500 hover:text-primary-600 transition-colors"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
                <div>
                    <h1 class="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-primary-500"></i> CubicPlus AI
                    </h1>
                    <p class="text-[10px] md:text-xs text-emerald-500 font-bold flex items-center gap-1.5 uppercase tracking-wider"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online System</p>
                </div>
            </div>
            <button onclick="openTeachAI()" class="px-3 py-2 md:px-4 md:py-2.5 bg-white border border-slate-200 text-primary-600 rounded-xl text-xs font-bold hover:bg-primary-50 hover:border-primary-200 transition-colors flex items-center gap-2 shadow-sm">
                <i data-lucide="book-plus" class="w-4 h-4"></i> <span class="hidden sm:block">สอนบอท</span>
            </button>
        </div>

        <div id="chatArea" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-6 bg-slate-50/50">
            <div class="flex justify-start">
                <div class="w-8 h-8 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center shrink-0 mr-3 border border-primary-200 shadow-sm"><i data-lucide="bot" class="w-4 h-4"></i></div>
                <div class="max-w-[85%] md:max-w-[70%] chat-bubble-ai px-5 py-3 rounded-2xl shadow-sm border border-primary-100 text-sm leading-relaxed">
                    สวัสดีครับ <b><span id="userNameDisplay"></span></b>! ผมคือผู้ช่วยอัจฉริยะของ CubicPlus มีคำถามอะไรให้ผมช่วยหาคำตอบไหมครับ?
                </div>
            </div>
        </div>

        <div id="faqContainer" class="px-4 py-3 overflow-x-auto whitespace-nowrap custom-scrollbar flex gap-2 border-t border-slate-100 bg-white/80 shrink-0">
            <span class="text-xs text-slate-400 italic flex items-center gap-2"><i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> กำลังโหลดหัวข้อแนะนำ...</span>
        </div>

        <div class="p-4 bg-white/90 border-t border-slate-100 shrink-0">
            <div class="relative flex items-center">
                <input type="text" id="chatInput" placeholder="พิมพ์คำถามที่นี่..." onkeypress="if(event.key === 'Enter') sendChat()" class="w-full pl-5 pr-14 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-primary-400 focus:bg-white transition-colors shadow-inner">
                <button onclick="sendChat()" class="absolute right-2 p-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors shadow-md active:scale-95">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        // ใส่ URL Web App ที่คุณให้มา
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhzDczt_UxXNIYeKZsu7nvlPrqM17JRU7OHjN_Hk8NiouWbCIoAgcKPx3pkpEl8OWu/exec";
        
        // ดึงข้อมูลผู้ใช้จาก Session (ถ้าเปิดเทสต์ตรงๆ ไม่มี Session ระบบจะใช้ชื่อ "พนักงาน" แทน)
        const username = sessionStorage.getItem("userLoginName") || "User";
        const name = sessionStorage.getItem("userName") || "พนักงาน";
        const role = sessionStorage.getItem("userRole") || "User";

        window.onload = () => {
            lucide.createIcons();
            document.getElementById('userNameDisplay').innerText = name;
            loadFAQ();
        };

        async function loadFAQ() {
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getFAQ", role: role })
                });
                const result = await res.json();
                
                const container = document.getElementById('faqContainer');
                container.innerHTML = '';
                
                if(result.status === "success" && result.data.length > 0) {
                    result.data.forEach(q => {
                        container.innerHTML += `<button onclick="sendChat('${q}')" class="px-4 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-bold hover:border-primary-300 hover:text-primary-600 hover:bg-primary-50 shadow-sm transition-all">${q}</button>`;
                    });
                } else {
                    container.innerHTML = `<span class="text-xs text-slate-400 italic">ยังไม่มีข้อมูลหัวข้อแนะนำ (ลองสอนบอทดูสิครับ)</span>`;
                }
            } catch (error) {
                document.getElementById('faqContainer').innerHTML = `<span class="text-xs text-rose-400 italic">ไม่สามารถดึงข้อมูลได้</span>`;
            }
        }

        async function sendChat(quickText = null) {
            const inputEl = document.getElementById('chatInput');
            const message = quickText || inputEl.value.trim();
            if (!message) return;
            
            inputEl.value = '';
            appendMessage('user', message);
            
            const typingId = appendTypingIndicator();
            scrollToBottom();

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "askAI", query: message, role: role })
                });
                const result = await res.json();
                removeTypingIndicator(typingId);
                
                if(result.status === "success") {
                    appendMessage('ai', result.answer);
                } else {
                    appendMessage('ai', "เกิดข้อผิดพลาดในการค้นหาข้อมูลครับ");
                }
            } catch (error) {
                removeTypingIndicator(typingId);
                appendMessage('ai', "ระบบขัดข้อง ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ครับ");
            }
        }

        function appendMessage(sender, text) {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} fade-in-up`;
            
            let html = '';
            if(sender === 'ai') {
                html = `
                    <div class="w-8 h-8 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center shrink-0 mr-3 border border-primary-200 shadow-sm"><i data-lucide="bot" class="w-4 h-4"></i></div>
                    <div class="max-w-[85%] md:max-w-[70%] chat-bubble-ai px-5 py-3 rounded-2xl shadow-sm border border-primary-100 text-sm leading-relaxed whitespace-pre-wrap">${text}</div>
                `;
            } else {
                html = `
                    <div class="max-w-[85%] md:max-w-[70%] chat-bubble-user px-5 py-3 rounded-2xl shadow-sm text-sm leading-relaxed whitespace-pre-wrap">${text}</div>
                    <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center shrink-0 ml-3 shadow-sm text-xs font-bold">${name.charAt(0)}</div>
                `;
            }
            msgDiv.innerHTML = html;
            chatArea.appendChild(msgDiv);
            lucide.createIcons();
            scrollToBottom();
        }

        function appendTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const id = 'typing-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = `flex justify-start fade-in-up`;
            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center shrink-0 mr-3 border border-primary-200"><i data-lucide="bot" class="w-4 h-4"></i></div>
                <div class="chat-bubble-ai px-5 py-4 rounded-2xl shadow-sm border border-primary-100 flex gap-1 items-center">
                    <div class="w-2 h-2 bg-primary-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                    <div class="w-2 h-2 bg-primary-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    <div class="w-2 h-2 bg-primary-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                </div>
            `;
            chatArea.appendChild(msgDiv);
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function openTeachAI() {
            Swal.fire({
                title: 'สอน AI / เพิ่มความรู้ใหม่',
                html: `
                    <div class="text-left space-y-4 mt-2">
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">1. คีย์เวิร์ด (คำค้นหา)</label>
                            <input id="ai-kw" class="w-full mt-1 p-3 border border-slate-200 rounded-xl text-sm" placeholder="เช่น ขอฟอร์ม, เบิกเงิน, ค่าเดินทาง">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">2. หัวข้อคำถาม (สำหรับขึ้นเป็นปุ่ม)</label>
                            <input id="ai-q" class="w-full mt-1 p-3 border border-slate-200 rounded-xl text-sm" placeholder="เช่น ขอแบบฟอร์มเบิกค่าเดินทาง">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">3. คำตอบที่ให้ AI ตอบ</label>
                            <textarea id="ai-a" rows="3" class="w-full mt-1 p-3 border border-slate-200 rounded-xl text-sm custom-scrollbar resize-none" placeholder="พิมพ์คำอธิบาย หรือแปะลิงก์ตรงนี้..."></textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#4f46e5',
                cancelButtonColor: '#f1f5f9',
                confirmButtonText: 'บันทึกข้อมูล',
                cancelButtonText: '<span class="text-slate-600">ยกเลิก</span>',
                preConfirm: () => {
                    const kw = document.getElementById('ai-kw').value.trim();
                    const q = document.getElementById('ai-q').value.trim();
                    const a = document.getElementById('ai-a').value.trim();
                    if (!kw || !q || !a) {
                        Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบทุกช่อง');
                        return false;
                    }
                    return { keywords: kw, question: q, answer: a }
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                        
                        const payload = {
                            action: "addKnowledge",
                            keywords: result.value.keywords,
                            question: result.value.question,
                            answer: result.value.answer,
                            role: role,
                            name: name
                        };

                        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                        const resJson = await res.json();
                        
                        if(resJson.status === "success") {
                            Swal.fire('สำเร็จ', 'บอทเรียนรู้ข้อมูลเรียบร้อย พร้อมใช้งานทันทีครับ', 'success');
                            loadFAQ(); // รีเฟรชปุ่มด้านล่าง
                        } else {
                            Swal.fire('ผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
                        }
                    } catch (e) {
                        Swal.fire('ผิดพลาด', 'ระบบขัดข้อง', 'error');
                    }
                }
            });
        }
    </script>
</body>
</html>
