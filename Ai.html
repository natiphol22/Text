<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synology Super AI Supporttitle>
    
    <link rel="icon" type="image/png" href="LOGO.png">
    <link href="[https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
    
    <!-- Tailwind & Icons & Alerts -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script src="[https://unpkg.com/lucide@latest](https://unpkg.com/lucide@latest)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/sweetalert2@11](https://cdn.jsdelivr.net/npm/sweetalert2@11)"></script>
    
    <!-- OCR AI Engine (Tesseract.js) -->
    <script src="[https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js](https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js)"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' } },
                    animation: { 
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite' 
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px) scale(0.95)' },
                            '100%': { opacity: 1, transform: 'translateY(0) scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #0f172a; /* Darker background for contrast */
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.2) 0px, transparent 50%);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            padding: 1rem;
        }
        @media (min-width: 768px) { body { padding: 2rem; } }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(24px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px;}
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .swal2-popup { font-family: 'Kanit', sans-serif !important; border-radius: 1.5rem !important; }
        
        /* แอนิเมชันพิมพ์ดีดสไตล์ Hacker/AI */
        .typewriter-cursor { display: inline-block; width: 8px; height: 1.2em; background-color: #4f46e5; vertical-align: bottom; margin-left: 4px; animation: blink 0.8s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* แชท Bubble สไตล์ล้ำๆ */
        .chat-bubble-ai { background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); border: 1px solid #e2e8f0; }
        .chat-bubble-user { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; }
    </style>
</head>
<body>

    <div class="max-w-5xl mx-auto w-full h-full flex flex-col glass-panel rounded-3xl overflow-hidden relative shadow-2xl">
        
        <!-- ================= HEADER ================= -->
        <div class="h-[72px] border-b border-slate-200 flex items-center justify-between px-4 md:px-6 bg-white/90 shrink-0 backdrop-blur-xl z-20">
            <div class="flex items-center gap-3">
                <div class="relative w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-primary-500/30">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                    <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight">Synology AI <span class="bg-primary-100 text-primary-700 text-[10px] px-2 py-0.5 rounded-full ml-1 uppercase tracking-wider">Vision</span></h1>
                    <p class="text-[11px] text-slate-500 font-medium">ถาม-ตอบ & อ่านรูปภาพอัจฉริยะ</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- ปุ่มเครื่องมือด้านบน -->
                <button onclick="showFAQPopup()" class="hidden md:flex p-2 text-slate-500 hover:text-amber-500 hover:bg-amber-50 rounded-xl transition-all" title="คำถามพบบ่อย">
                    <i data-lucide="lightbulb" class="w-5 h-5"></i>
                </button>
                <button onclick="undoLastMessage()" class="p-2 text-slate-500 hover:text-primary-600 hover:bg-primary-50 rounded-xl transition-all" title="ย้อนกลับ (Ctrl+Z)">
                    <i data-lucide="undo-2" class="w-5 h-5"></i>
                </button>
                <button onclick="clearChat()" class="p-2 text-slate-500 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all" title="ล้างหน้าจอ">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
                <div class="w-px h-6 bg-slate-200 mx-1"></div>
                <button onclick="openTeachAI()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-black transition-all flex items-center gap-2 shadow-lg shadow-slate-900/20">
                    <i data-lucide="database-zap" class="w-<4 h-4"></i> <span class="hidden sm:block">สอน AI</span>
                </button>
            </div>
        </div>

        <!-- ================= CHAT AREA ================= -->
        <div id="chatView" class="flex-1 flex flex-col overflow-hidden bg-[url('[https://www.transparenttextures.com/patterns/cubes.png](https://www.transparenttextures.com/patterns/cubes.png)')] bg-slate-50/50">
            
            <div id="chatMessages" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-6 scroll-smooth">
                <!-- Welcome Message จะถูกสร้างผ่าน JS -->
            </div>
            
            <!-- Input Area -->
            <div class="p-4 bg-white/80 backdrop-blur-md border-t border-slate-200 shrink-0 relative">
                
                <!-- Quick Menu Mobile (FAQ) -->
                <div class="md:hidden flex gap-2 mb-3 overflow-x-auto custom-scrollbar pb-1">
                    <button onclick="showFAQPopup()" class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-full flex items-center gap-1.5 whitespace-nowrap"><i data-lucide="lightbulb" class="w-3 h-3"></i> คำถามพบบ่อย<</button>
                    <button onclick="triggerFAQ('ลืมรหัสผ่าน')" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full whitespace-nowrap">ลืมรหัสผ่าน</button>
                    <button onclick="triggerFAQ('อัปเดต DSM')" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full whitespace-nowrap">อัปเดต DSM</button>
                </div>

                <div class="relative flex items-end max-w-4xl mx-auto gap-2">
                    <!-- ปุ่มแนบรูป (Vision AI) -->
                    <button onclick="document.getElementById('imageUpload').click()" class="p-3.5 bg-slate-100 text-slate-500 rounded-2xl hover:bg-primary-50 hover:text-primary-600 transition-all shrink-0 border border-slate-200 group relative" title="อัปโหลดรูปภาพเพื่อดึง รุ่น/SN">
                        <i data-lucide="image-plus" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        <span class="absolute -top-2 -right-2 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-primary-500"></span></span>
                    </button>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

                    <!-- กล่องข้อความแบบขยายได้ -->
                    div class="relative flex-1 bg-slate-50 border border-slate-200 rounded-2xl shadow-inner focus-within:border-primary-500 focus-within:ring-4 focus-within:ring-primary-50 focus-within:bg-white transition-all overflow-hidden flex items-center">
                        <textarea id="chatInput" rows="1" placeholder="พิมพ์คำถาม หรือกด Shift+Enter เพื่อขึ้นบรรทัดใหม่..." 
                                  class="w-full pl-4 pr-12 py-3.5 bg-transparent text-sm focus:outline-none resize-none custom-scrollbar max-h-32"
                                  onkeydown="handleKeydown(event)" oninput="autoResize(this)"></textarea>
                        <button onclick="handleChatSubmit()" class="absolute right-2 bottom-2 p-2 bg-gradient-to-r from-primary-600 to-blue-600 text-white rounded-xl hover:shadow-lg hover:shadow-primary-500/40 hover:-translate-y-0.5 transition-all flex items-center justify-center">
                            <i data-lucide="send" class="w-4 h-4 ml-0.5"></i>
                        </button>
                    </div>
                </div>
                <div class="text-center mt-2 flex justify-center items-center gap-4 text-[10px] text-slate-400 font-medium">
                    <span>💡 ส่งข้อความ: <kbd class="px-1 py-0.5 bg-slate-100 border rounded">Enter</kbd></span>
                    <span>ขึ้นบรรทัดใหม่: kbd class="px-1 py-0.5 bg-slate-100 border rounded">Shift + Enter</kbd></span>
                    <span>ย้อนกลับ: kbd class="px-1 py-0.5 bg-slate-100 border rounded">Ctrl + Z</kbd></span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const WEB_APP_URL = "[https://script.google.com/macros/s/AKfycbxI6bmlpJslBjsT-zaedzjl1O3DxxJRtCDwry9-8whtsfwi6bAFiid6i-h7nU6_vxDS/exec](https://script.google.com/macros/s/AKfycbxI6bmlpJslBjsT-zaedzjl1O3DxxJRtCDwry9-8whtsfwi6bAFiid6i-h7nU6_vxDS/exec)";
        let masterData = [];
        let chatHistory = []; // เก็บ History เพื่อทำ Undo

        window.onload = () => {
            lucide.createIcons();
            initWelcomeMessage();
            loadData();
        };

        // --- ระบบ Auto Resize Textarea ---
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        // --- ระบบคีย์บอร์ดลัด (Ctrl+Z, Enter) ---
        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); // ป้องกันการขึ้นบรรทัดใหม่
                handleChatSubmit();
            }
            if (event.ctrlKey && event.key === 'z') {
                event.preventDefault();
                undoLastMessage();
            }
        }

        // --- ล้างหน้าจอ ---
        function clearChat() {
            Swal.fire({
                title: 'ยืนยันการล้างแชท?', text: "ข้อความทั้งหมดจะหายไป", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#cbd5e1',
                confirmButtonText: 'ใช่, ล้างเลย', cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('chatMessages').innerHTML = '';
                    chatHistory = [];
                    initWelcomeMessage();
                }
            });
        }

        // --- Undo (Ctrl+Z) ---
        function undoLastMessage() {
            if (chatHistory.length === 0) return;
            const lastPair = chatHistory.pop(); // ดึง ID ของ User และ AI ออกมา
            
            const userMsg = document.getElementById(lastPair.user);
            const aiMsg = document.getElementById(lastPair.ai);
            
            if(userMsg) userMsg.remove();
            if(aiMsg) aiMsg.remove();
            
            // คืนค่าข้อความกลับไปที่ช่อง Input
            const inputEl = document.getElementById('chatInput');
            inputEl.value = lastPair.text;
            autoResize(inputEl);
            inputEl.focus();
        }

        // --- โหลดข้อมูล Knowledge Base ---
        async function loadData() {
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "getSupportData" }) });
                const result = await res.json();
                if(result.status === "success") { masterData = result.data.reverse(); }
            } catch (error) { console.error("DB Load Error"); }
        }

        // --- FAQ Popup ---
        function showFAQPopup() {
            Swal.fire({
                title: '💡 คำถามที่พบบ่อย',
                html: `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4 text-left">
                        <button onclick="Swal.close(); triggerFAQ('ลืมรหัสผ่าน admin ต้องทำยังไง?')" class="p-3 bg-slate-50 border border-slate-200 rounded-xl hover:border-primary-400 hover:bg-primary-50 transition-all flex items-start gap-3">
                            <i data-lucide="key" class="w-5 h-5 text-amber-500 shrink-0"></i> <div class="text-sm font-medium text-slate-700">รีเซ็ตรหัสผ่าน Admin</div>
                        </button>
                        <button onclick="Swal.close(); triggerFAQ('อัปเดต DSM ไม่ได้')" class="p-3 bg-slate-50 border border-slate-200 rounded-xl hover:border-primary-400 hover:bg-primary-50 transition-all flex items-start gap-3">
                            <i data-lucide="refresh-cw" class="w-5 h-5 text-blue-500 shrink-0"></i> <div class="text-sm font-medium text-slate-700">ปัญหาอัปเดต DSM</div>
                        </button>
                        <button onclick="Swal.close(); triggerFAQ('แจ้งเตือน Bad Sector')" class="p-3 bg-slate-50 border border-slate-200 rounded-xl hover:border-primary-400 hover:bg-primary-50 transition-all flex items-start gap-3">
                            <i data-lucide="hard-drive" class="w-5 h-5 text-rose-500 shrink-0"></i> <div class="text-sm font-medium text-slate-700">Disk ติด Bad Sector</div>
                        </button>
                        <button onclick="Swal.close(); triggerFAQ('ไฟกระพริบสีส้ม')" class="p-3 bg-slate-50 border border-slate-200 rounded-xl hover:border-primary-400 hover:bg-primary-50 transition-all flex items-start gap-3">
                            <i data-lucide="alert-triangle" class="w-5 h-5 text-orange-500 shrink-0"></i> <div class="text-sm font-medium text-slate-700">สถานะไฟกระพริบสีส้ม</div>
                        </button>
                    </div>
                `,
                showConfirmButton: false, showCloseButton: true, width: '600px'
            });
            setTimeout(() => lucide.createIcons(), 100);
        }

        function triggerFAQ(q<) {
            document.getElementById('chatInput').value = q;
            handleChatSubmit();
        }

        // --- ระบบแสดงผลแชท (UI) ---
        function getTimestamp() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        function initWelcomeMessage() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = `
                <div class="flex gap-3 animate-slide-up w-full">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-blue-600 flex items-center justify-center text-white shadow-lg shrink-0 border-2 border-white"><i data-lucide="bot" class="w-5 h-5"></i></div>
                    <div class="chat-bubble-ai p-4 rounded-2xl rounded-tl-none shadow-sm text-sm text-slate-700 max-w-[85%] relative">
                        <p class="font-bold text-primary-800 text-base mb-1">สวัสดีครับ! ผมคือ Synology AI 🤖</p>
                        <p class="mb-2">มีอะไรให้ผมช่วยดูแลระบบ NAS ของคุณวันนี้ครับ? พิมพ์อาการด้านล่าง หรือกดที่ปุ่ม <kbd class="px-1.5 py-0.5 bg-white border rounded text-[10px]"><i data-lucide="image-plus" class="w-3 h-3 inline"></i></kbd> เพื่อส่งรูปสติ๊กเกอร์เครื่องให้ผมดึง Serial Number/รุ่น ให้ได้เลยครับ</p>
                        <span class="absolute -bottom-5 left-1 text-[10px] text-slate-400">${getTimestamp()}</span>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- การประมวลผลแชท ---
        function handleChatSubmit() {
            const inputEl = document.getElementById('chatInput');
            let text = inputEl.value.trim();
            if(!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto'; // Reset height
            
            const userId = appendChatMessage('user', text);
            const typingId = appendChatPlaceholder();

            setTimeout(() => {
                const aiId = processAIResponse(text, typingId);
                // บันทึก History สำหรับ Undo
                chatHistory.push({ user: userId, ai: aiId, text: text });
            }, 800);
        }

        function processAIResponse(text, typingId) {
            const lowerText = text.toLowerCase();
            let matches = [];

            // AI Scoring
            masterData.forEach(item => {
                let score = 0;
                let qText = item.question.toLowerCase();
                let kText = item.keywords.toLowerCase();

                if(qText.includes(lowerText)) score += 20;
                if(kText.includes(lowerText)) score += 15;
                
                const keywords = lowerText.split(/[\s,]+/).filter(w => w.length > 2);
                keywords.forEach(word => {
                    if(kText.includes(word)) score += 5;
                    if(qText.includes(word)) score += 3;
                    if(item.answer.toLowerCase().includes(word)) score += 1;
                });

                if(score > 0) matches.push({ item: item, score: score });
            });

            matches.sort((a, b) => b.score - a.score);
            document.getElementById(typingId).remove();

            const aiId = 'msg-' + Date.now(); // ID สำหรับอ้างอิงตอน Undo

            if(matches.length > 0 && matches[0].score >= 8) {
                const bm = matches[0].item;
                let res = `<div class="font-bold text-slate-800 mb-2 border-b border-slate-200/60 pb-2 flex items-center gap-2">i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500"></i> ${bm.question}</div>`;
                res += `<div class="whitespace-pre-wrap leading-relaxed text-slate-700 mb-3">${bm.answer}</div>`;
                
                if(bm.link && bm.link !== '-') {
                    let url = bm.link.startsWith('http') ? bm.link : 'https://' + bm.link;
                    res += `<a href="${url}" target="_blank" class="text-[11px] font-bold text-primary-600 hover:text-white hover:bg-primary-600 border border-primary-200 transition-colors flex items-center gap-1.5 bg-primary-50 px-3 py-1.5 rounded-lg w-max mb-3"><i data-lucide="external-link" class="w-3 h-3"></i> ดูคู่มืออ้างอิง</a>`;
                }
                
                res += `<button onclick="copyToClipboard(this, \`${bm.answer.replace(/`/g, '\\`')}\`)" class="text-[10px] text-slate-500 hover:text-primary-700 font-medium flex items-center gap-1.5 bg-white border border-slate-200 hover:border-primary-300 px-3 py-1 rounded-lg transition-all"><i data-lucide="copy" class="w-3 h-3"></i> ก๊อปปี้</button>`;
                
                appendTypewriterMessage(aiId, res, bm.category);
            } else {
                appendTypewriterMessage(aiId, `<p>ขออภัยครับ ผมยังไม่มีข้อมูลในส่วนนี้ ลองเปลี่ยนคำค้นหาดูนะครับ หรือกดปุ่ม <b>สอน AI</b> ด้านบนเพื่อเพิ่มเคสนี้ได้เลย</p>`, "ไม่พบข้อมูล");
            }
            return aiId;
        }

        // --- ระบบอ่านรูปภาพ (OCR) ด้วย Tesseract ---
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            // แสดงรูปที่ User อัปโหลด
            const objUrl = URL.createObjectURL(file);
            const userId = appendChatMessage('user', `<img src="${objUrl}" class="max-w-[200px] rounded-lg border border-white/20 shadow-sm">`);
            
            // แจ้งสถานะกำลังประมวลผล (Tesseract อาจใช้เวลาโหลดครั้งแรก)
            const typingId = appendChatPlaceholder('กำลังประมวลผลภาพ (Vision AI) อาจใช้เวลาสักครู่...');

            try {
                // เรียกใช้ Tesseract อ่านข้อความภาษาอังกฤษ/ตัวเลข
                const result = await Tesseract.recognize(file, 'eng', { logger: m => console.log(m) });
                const text = result.data.text;
                
                document.getElementById(typingId).remove();

                // Regex ดึงข้อมูล
                // หาชื่อรุ่น (Model) เช่น DS920+, RS2418RP+
                const modelRegex = /(?:DS|RS|FS|SA|UC|NVR|VS|RX|DX|FX)[0-9]{2,4}[a-zA-Z0-9]*\+?/gi;
                const models = text.match(modelRegex) || [];
                const uniqueModels = [...new Set(models)];

                // หา Serial Number (ของ Synology ปกติจะมี 13 ตัวอักษร พิมพ์ใหญ่ผสมตัวเลข)
                const snRegex = /\b[A-Z0-9]{13}\b/g;
                const sns = text.match(snRegex) || [];
                const uniqueSns = [...new Set(sns)];

                const aiId = 'msg-' + Date.now();
                let reply = `<div class="font-bold text-primary-700 flex items-center gap-2 mb-2"><i data-lucide="scan-line" class="w-4 h-4"></i> วิเคราะห์รูปภาพสำเร็จ</div>`;
                
                if (uniqueModels.length > 0 || uniqueSns.length > 0) {
                    reply += `<div class="bg-slate-100 p-3 rounded-xl border border-slate-200 space-y-2 mb-3">`;
                    if (uniqueModels.length > 0) reply += `<div><span class="text-xs text-slate-500 block uppercase">Device Model</span><span class="font-bold text-slate-800 text-lg">${uniqueModels[0]}</span></div>`;
                    if (uniqueSns.length > 0) reply += `<div><span class="text-xs text-slate-500 block uppercase">Serial Number</span><span class="font-mono bg-white border border-slate-200 px-2 py-0.5 rounded text-sm text-slate-700">${uniqueSns[0]}</span></div>`;
                    reply += `</div>`;
                    reply += `<p class="text-sm">ต้องการสอบถามปัญหาเกี่ยวกับรุ่นนี้ หรือให้ตรวจสอบประกันไหมครับ?</p>`;
                } else {
                    reply += `<p class="text-sm text-slate-600 mb-2">ระบบไม่พบชื่อรุ่น หรือ Serial Number ที่ชัดเจนในรูปนี้ครับ แต่ดึงข้อความมาได้ตามนี้:</p>`;
                    reply += `<pre class="bg-slate-100 p-2 rounded text-[10px] text-slate-500 max-h-32 overflow-y-auto">${text.substring(0, 200)}...</pre>`;
                }

                appendTypewriterMessage(aiId, reply, "Vision AI");
                chatHistory.push({ user: userId, ai: aiId, text: "(ส่งรูปภาพ)" });

            } catch (err) {
                document.getElementById(typingId).remove();
                appendTypewriterMessage('msg-' + Date.now(), `เกิดข้อผิดพลาดในการวิเคราะห์รูปภาพ กรุณาลองใหม่อีกครั้ง`, "Error");
            }
            
            // ล้าง input file
            event.target.value = '';
        }

        // --- Core UI Append Functions ---
        function appendChatMessage(sender, htmlContent) {
            const container = document.getElementById('chatMessages');
            const msgId = 'msg-user-' + Date.now();
            const div = document.createElement('div');
            
            if(sender === 'user') {
                div.id = msgId;
                div.className = 'flex gap-3 justify-end animate-slide-up w-full relative mb-6';
                div.innerHTML = `
                    <div class="chat-bubble-user p-3 md:p-4 rounded-2xl rounded-tr-none shadow-md text-sm max-w-[85%] break-words whitespace-pre-wrap leading-relaxed">
                        ${htmlContent}
                    </div>
                    <span class="absolute -bottom-5 right-1 text-[10px] text-slate-400">${getTimestamp()}</span>
                `;
            }
            container.appendChild(div);
            scrollToBottom();
            return msgId;
        }

        function appendChatPlaceholder(msg = '') {
            const container = document.getElementById('chatMessages');
            const msgId = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = msgId;
            div.className = 'flex gap-3 animate-slide-up w-full mb-6 relative';
            div.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-blue-600 flex items-center justify-center text-white shadow-lg shrink-0 border-2 border-white"><i data-lucide="bot" class="w-5 h-5"></i></div>
                <div class="chat-bubble-ai px-4 py-3 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-3">
                    <div class="flex gap-1.5">
                        <span class="w-2 h-2 bg-primary-400 rounded-full animate-bounce" style="animation-delay: 0s"></span>
                        <span class="w-2 h-2 bg-primary-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                        <span class="w-2 h-2 bg-primary-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
                    </div>
                    ${msg ? `<span class="text-xs text-slate-500 font-medium">${msg}</span>` : ''}
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
            lucide.createIcons();
            return msgId;
        }

        function appendTypewriterMessage(id, htmlString, category) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex gap-3 animate-slide-up w-full relative mb-6';
            
            let catBadge = category ? `<span class="text-[9px] bg-indigo-50 text-indigo-600 border border-indigo-100 px-2 py-0.5 rounded font-bold uppercase mb-2 inline-block shadow-sm">${category}</span><br>` : '';
            const innerDivId = 'inner-' + id;
            
            div.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-blue-600 flex items-center justify-center text-white shadow-lg shrink-0 border-2 border-white"><i data-lucide="bot" class="w-5 h-5"></i></div>
                <div class="chat-bubble-ai p-4 md:p-5 rounded-2xl rounded-tl-none shadow-sm text-sm max-w-[85%] w-full overflow-hidden">
                    ${catBadge}
                    <div id="${innerDivId}" class="text-slate-700"></div>
                </div>
                <span class="absolute -bottom-5 left-14 text-[10px] text-slate-400">${getTimestamp()}</span>
            `;
            container.appendChild(div);
            
            const targetEl = document.getElementById(innerDivId);
            let i = 0; let currentHTML = ""; let inTag = false;
            
            function typeChar() {
                if (i < htmlString.length) {
                    let char = htmlString.charAt(i);
                    currentHTML += char;
                    if (char === '<') inTag = true;
                    if (char === '>') inTag = false;
                    
                    targetEl.innerHTML = currentHTML + (!inTag && i < htmlString.length - 1 ? '<span class="typewriter-cursor"></span>' : '');
                    if(!inTag && char === '>') lucide.createIcons({root: targetEl}); 
                    
                    scrollToBottom();
                    i++;
                    setTimeout(typeChar, inTag ? 0 : 5); // พิมพ์เร็วขึ้น
                } else {
                    targetEl.innerHTML = htmlString;
                    lucide.createIcons({root: targetEl});
                    scrollToBottom();
                }
            }
            typeChar();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        function copyToClipboard(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-emerald-600"></i> <span class="text-emerald-600">คัดลอกแล้ว</span>`;
                lucide.createIcons();
                setTimeout(() => { btn.innerHTML = originalHtml; lucide.createIcons(); }, 2000);
            });
        }

        // --- ระบบสอน AI (ชุดเดิม) ---
        function openTeachAI() { /* ฟังก์ชันสอน AI เดิมของคุณ... */ 
            Swal.fire({
                title: 'สอน AI (เพิ่มข้อมูล)',
                html: `<div class="text-left space-y-3 mt-2"><input id="ai-q" class="w-full p-3 border rounded-xl text-sm bg-slate-50" placeholder="ปัญหา / คำถาม"><textarea id="ai-a" rows="3" class="w-full p-3 border rounded-xl text-sm bg-slate-50 mt-2" placeholder="คำตอบ / วิธีแก้"></textarea><input id="ai-kw" class="w-full p-3 border rounded-xl text-sm bg-slate-50 mt-2" placeholder="คีย์เวิร์ด (คั่นด้วยลูกน้ำ)"></div>`,
                showCancelButton: true, confirmButtonText: 'บันทึก', preConfirm: () => {
                    const q = document.getElementById('ai-q').value; const a = document.getElementById('ai-a').value;
                    if(!q || !a) { Swal.showValidationMessage('กรอกให้ครบ'); return false; }
                    return { action: "addKnowledge", category: "อื่นๆ", link: "-", question: q, keywords: document.getElementById('ai-kw').value, answer: a }
                }
            }).then(async (r) => {
                if(r.isConfirmed) {
                    Swal.fire({title:'Saving...', didOpen:()=>Swal.showLoading()});
                    await fetch(WEB_APP_URL, {method:'POST', body:JSON.stringify(r.value)});
                    Swal.fire('Success', 'บันทึกเรียบร้อย', 'success'); loadData();
                }
            });
        }
    </script>
</body>
</html>
