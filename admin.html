<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel | CubicPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0.03) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.03) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.03) 0, transparent 50%);
            color: #334155; 
            min-height: 100vh; 
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .time-picker-box { 
            background: #f1f5f9; border: 2px solid transparent; transition: all 0.2s ease; text-align: center; font-size: 1.25rem; font-weight: 600; cursor: pointer; border-radius: 1rem; 
        }
        .time-picker-box:hover, .time-picker-box:focus-within { background: #fff; border-color: #818cf8; box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.15); }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; background: transparent; width: 100%; border: none; padding: 0.75rem 1rem; text-align: center; cursor: pointer; outline: none; }
        
        .settings-nav-btn.active { background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%); color: #4f46e5; border-right: 3px solid #4f46e5; }
        
        /* Custom Scrollbar for dropdowns and table */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Dropdown Animation */
        .dropdown-animate { animation: slideDown 0.2s ease-out forwards; transform-origin: top; }
        @keyframes slideDown { from { opacity: 0; transform: scaleY(0.95); } to { opacity: 1; transform: scaleY(1); } }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12">

    <div class="max-w-7xl mx-auto mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
        <div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-brand-700 to-indigo-400">ระบบจัดการหลังบ้าน</h1>
            <div class="flex items-center gap-2 mt-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <p class="text-slate-500 font-medium text-[11px] uppercase tracking-[0.2em]">CubicPlus Advanced Admin</p>
            </div>
        </div>
        <button onclick="location.href='dashboard.html'" class="group flex items-center gap-2 px-5 py-2.5 bg-white/80 border border-slate-200 rounded-xl text-slate-600 font-semibold text-sm hover:text-brand-600 hover:border-brand-200 shadow-sm transition-all active:scale-95">
            <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> กลับสู่แดชบอร์ด
        </button>
    </div>

    <div class="max-w-7xl mx-auto">

            <button id="tabReport" class="tab-btn active px-8 py-2.5 rounded-xl text-sm font-semibold transition-all text-slate-500 hover:text-slate-700 [&.active]:bg-white [&.active]:text-brand-600 [&.active]:shadow-sm" onclick="openTab(event, 'reportTab'); loadReportData();">
                <div class="flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> รายงานการเช็คอิน</div>
            </button>
            <button id="tabSetting" class="tab-btn px-8 py-2.5 rounded-xl text-sm font-semibold transition-all text-slate-500 hover:text-slate-700 [&.active]:bg-white [&.active]:text-brand-600 [&.active]:shadow-sm" onclick="openTab(event, 'settingTab')">
                <div class="flex items-center gap-2"><i data-lucide="settings" class="w-4 h-4"></i> ตั้งค่าระบบ</div>
            </button>
        </div>

        <div id="reportTab" class="tab-content active">
            <div class="glass-panel rounded-3xl overflow-hidden">
                <div class="p-6 md:p-8 border-b border-slate-100 bg-white/40 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-5 items-end">
                    
                    <div class="space-y-1.5 custom-dropdown-container relative">
                        <label class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider ml-1">ค้นหาชื่อ</label>
                        <div class="relative">
                            <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

                        </div>
                        <div id="nameDropdown" class="custom-dropdown-list absolute z-50 w-full mt-1 bg-white border border-slate-100 rounded-xl shadow-xl max-h-48 overflow-y-auto hidden custom-scrollbar dropdown-animate p-1"></div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider ml-1">ช่วงเวลา</label>
                        <div class="relative">
                            <i data-lucide="calendar" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <select id="filterDateRange" onchange="applyFilters()" class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 focus:border-brand-400 focus:ring-2 focus:ring-brand-50 rounded-xl text-sm transition-all outline-none shadow-sm text-left">

    <div id="customAlert" class="fixed inset-0 z-[100] hidden bg-slate-900/40 backdrop-blur-sm items-center justify-center p-4 transition-opacity">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl transform scale-95 animate-[fadeInScale_0.3s_ease-out_forwards]">
            <style>
                @keyframes fadeInScale { to { opacity: 1; transform: scale(1); } }
            </style>
            <div id="alertIconContainer" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5">
                <div id="alertIcon"></div>
            </div>
            <h3 id="alertTitle" class="text-xl font-bold text-slate-800 mb-2"></h3>
            <p id="alertMsg" class="text-slate-500 text-sm mb-8 leading-relaxed"></p>
            <button onclick="closeAlert()" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-semibold text-sm transition-all active:scale-95">
                ตกลง / ปิดหน้าต่าง
            </button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzaonlmo7WYUqXCeN2ZGyZfp0TaIP4edfRsK_91HVdxo3ItuTpDn5yNsaz7217zqouC6Q/exec";
        let rawData = [];

        // --- Custom Dropdown Logic ---
        // ปิด Dropdown เมื่อคลิกพื้นที่อื่น
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.custom-dropdown-container')) {
                document.querySelectorAll('.custom-dropdown-list').forEach(el => el.classList.add('hidden'));
            }
        });

        // 1. สร้าง Custom Dropdown สำหรับเวลา
        function setupCustomTimePickers() {
            const setups = [
                { id: 'startH', max: 24, step: 1 },
                { id: 'startM', max: 60, step: 5 },
                { id: 'endH', max: 24, step: 1 },
                { id: 'endM', max: 60, step: 5 }
            ];

            setups.forEach(s => {
                const input = document.getElementById(s.id);
                const list = document.getElementById('list-' + s.id);
                
                let html = '';
                for(let i=0; i<s.max; i+=s.step) {
                    const val = i.toString().padStart(2, '0');
                    html += `<div class="p-2.5 rounded-lg hover:bg-brand-50 hover:text-brand-600 text-slate-600 cursor-pointer transition-colors" onclick="selectCustomTime('${s.id}', '${val}')">${val}</div>`;
                }
                list.innerHTML = html;

                input.addEventListener('click', () => {
                    // ปิดอันอื่นก่อน
                    document.querySelectorAll('.custom-dropdown-list').forEach(el => el.classList.add('hidden'));
                    list.classList.remove('hidden');
                });
            });
        }

        function selectCustomTime(id, val) {
            document.getElementById(id).value = val;
            document.getElementById('list-' + id).classList.add('hidden');
        }

        // 2. Custom Autocomplete สำหรับค้นหาชื่อ
        function setupNameAutocomplete() {
            const input = document.getElementById('filterName');
            const list = document.getElementById('nameDropdown');

            const updateList = () => {
                const val = input.value.toLowerCase();
                const uniqueNames = [...new Set(rawData.map(d => d.Name).filter(Boolean))];
                const filtered = uniqueNames.filter(n => n.toLowerCase().includes(val));
                
                if (filtered.length > 0) {
                    list.innerHTML = filtered.map(name => 
                        `<div class="p-3 rounded-lg hover:bg-brand-50 hover:text-brand-600 text-slate-600 cursor-pointer transition-colors text-sm" onclick="selectCustomName('${name}')">${name}</div>`
                    ).join('');
                } else {
                    list.innerHTML = `<div class="p-3 text-slate-400 text-sm text-center">ไม่พบชื่อนี้</div>`;
                }
                list.classList.remove('hidden');
            };

            input.addEventListener('input', () => { updateList(); applyFilters(); });
            input.addEventListener('focus', updateList);
        }

        function selectCustomName(name) {
            document.getElementById('filterName').value = name;
            document.getElementById('nameDropdown').classList.add('hidden');
            applyFilters();
        }
        // --- จบ Custom Dropdown Logic ---


        async function loadCurrentConfig() {
            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "fetchConfig" }) });
                const config = await response.json();
                const start = config.StartTime || "09:00";
                const end = config.EndTime || "18:00";
                
                document.getElementById('curStart').innerText = start;
                document.getElementById('curEnd').innerText = end;

                const [sh, sm] = start.split(':');
                const [eh, em] = end.split(':');
                document.getElementById('startH').value = sh;
                document.getElementById('startM').value = sm;
                document.getElementById('endH').value = eh;
                document.getElementById('endM').value = em;
            } catch (e) { console.error("Config Load Error"); }
        }

        async function loadReportData() {
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "<tr><td colspan='5' class='py-16 text-center text-slate-400'><div class='flex flex-col items-center gap-3'><i data-lucide='loader-2' class='w-6 h-6 animate-spin text-brand-500'></i><span>กำลังโหลดข้อมูล...</span></div></td></tr>";
            lucide.createIcons();
            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "fetchData" }) });
                rawData = await resp.json();
                applyFilters();
            } catch (e) { showAlert("แจ้งเตือน", "ไม่สามารถดึงข้อมูลได้", "alert-triangle", "rose"); }
        }

        function renderTable(data) {
            const tbody = document.querySelector("#reportTable tbody");
            const policyStart = document.getElementById('curStart').innerText;
            
            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' class='py-16 text-center text-slate-400'><div class='flex flex-col items-center gap-3'><i data-lucide='inbox' class='w-8 h-8 text-slate-300'></i><span>ไม่พบข้อมูลการเช็คอิน</span></div></td></tr>";
                lucide.createIcons();
                return;
            }
            
            tbody.innerHTML = "";
            
            data.forEach(d => {
                const dateObj = new Date(d.Timestamp);
                const timeStr = dateObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                const isLate = (d.Type === 'Check In' && timeStr > policyStart);
                
                const typeStyle = d.Type === 'Check In' 
                    ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' 
                    : 'bg-rose-50 text-rose-600 border border-rose-200';
                
                const lateBadge = isLate 
                    ? `<span class="ml-2 px-2 py-0.5 bg-amber-100 text-amber-700 text-[10px] font-bold rounded-md border border-amber-200">สาย</span>` 
                    : '';

                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50/80 transition-colors group">
                        <td class="py-4 px-6 text-sm text-slate-600 whitespace-nowrap">
                            <div class="font-medium text-slate-800">${timeStr} น.</div>
                            <div class="text-[11px] text-slate-400">${dateStr}</div>
                        </td>
                        <td class="py-4 px-6 whitespace-nowrap">
                            <div class="font-semibold text-slate-800 flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-xs font-bold">${(d.Name || "U").charAt(0)}</div>
                                ${d.Name || "-"}
                            </div>
                        </td>
                        <td class="py-4 px-6 whitespace-nowrap">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold ${typeStyle}">
                                ${d.Type === 'Check In' ? 'เข้างาน' : 'ออกงาน'}
                            </span>
                            ${lateBadge}
                        </td>
                        <td class="py-4 px-6 text-sm font-medium text-slate-500 whitespace-nowrap">
                            <div class="flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 opacity-70"></i> ${d.Location || "-"}</div>
                        </td>
                        <td class="py-4 px-6 text-center whitespace-nowrap">
                            <button onclick="showAlert('รายละเอียดบันทึก', '${d["WorkSummary/Memo"] || "ไม่มีบันทึกเพิ่มเติม"}', 'file-text', 'brand')" class="p-2 rounded-lg text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition-all opacity-70 group-hover:opacity-100">
                                <i data-lucide="eye" class="w-4 h-4 mx-auto"></i>
                            </button>
                        </td>
                    </tr>
                `);
            });
            lucide.createIcons();
        }

        async function saveSettings() {
            const start = `${document.getElementById('startH').value}:${document.getElementById('startM').value}`;
            const end = `${document.getElementById('endH').value}:${document.getElementById('endM').value}`;
            const btn = document.getElementById('saveConfigBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true; 
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังบันทึก...`;
            lucide.createIcons();

            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "saveConfig", startTime: start, endTime: end }) });
                const res = await resp.json();
                if (res.status === "success") {
                    showAlert("บันทึกสำเร็จ", "ระบบได้อัปเดตเกณฑ์เวลาเรียบร้อยแล้ว", "check-circle", "emerald");
                    await loadCurrentConfig(); 
                }
            } catch (e) { showAlert("ล้มเหลว", "เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่", "x-circle", "rose"); }
            finally { 
                btn.disabled = false; 
                btn.innerHTML = originalText; 
                lucide.createIcons();
            }
        }

        // --- Tab & Nav Logic ---
        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
            lucide.createIcons();
        }

        function openSettingSection(evt, sectionId) {
            document.querySelectorAll('.setting-section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.settings-nav-btn').forEach(b => {
                b.classList.remove('active');
                b.querySelector('div').classList.remove('text-brand-600');
                b.querySelector('div').classList.add('text-slate-500');
            });
            document.getElementById(sectionId).classList.remove('hidden');
            evt.currentTarget.classList.add('active');
            evt.currentTarget.querySelector('div').classList.add('text-brand-600');
            evt.currentTarget.querySelector('div').classList.remove('text-slate-500');
            lucide.createIcons();
        }

        function applyFilters() {
            const nameF = document.getElementById('filterName').value.toLowerCase();
            const locF = document.getElementById('filterLoc').value;
            const typeF = document.getElementById('filterType').value;
            const dateRangeF = document.getElementById('filterDateRange').value;
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const filtered = rawData.filter(d => {
                const itemDate = new Date(d.Timestamp);
                const dateMatch = dateRangeF === "today" ? itemDate >= startOfToday : true;
                const nameMatch = (d.Name || "").toLowerCase().includes(nameF);
                const locMatch = !locF || d.Location === locF;
                const typeMatch = !typeF || d.Type === typeF;
                return dateMatch && nameMatch && locMatch && typeMatch;
            });
            renderTable(filtered);
        }

        async function handleAddUser() {
            const u = document.getElementById('newU').value, p = document.getElementById('newP').value, n = document.getElementById('newN').value, r = document.getElementById('newR').value;
            if (!u || !p || !n) return showAlert("ข้อมูลไม่ครบ", "กรุณาระบุข้อมูลพนักงานให้ครบทุกช่อง", "alert-circle", "amber");
            
            const btn = document.getElementById('addBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังดำเนินการ...`;
            lucide.createIcons();

            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "addUser", newUsername: u, newPassword: p, newName: n, newRole: r }) });
                const res = await resp.json();
                if (res.status === "added") {
                    showAlert("ลงทะเบียนเรียบร้อย", `เพิ่มพนักงานคุณ ${n} เข้าสู่ระบบสำเร็จ`, "user-check", "brand");
                    document.getElementById('newU').value = ''; document.getElementById('newP').value = ''; document.getElementById('newN').value = '';
                }
            } catch (e) { showAlert("ผิดพลาด", "ไม่สามารถส่งข้อมูลได้", "x-circle", "rose"); }
            finally { 
                btn.disabled = false; 
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        }

        function showAlert(title, msg, icon = "info", theme = "brand") {
            const modal = document.getElementById('customAlert');
            const iconContainer = document.getElementById('alertIconContainer');
            
            iconContainer.className = `w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5`;
            let iconColorClass = "text-slate-500";
            
            if(theme === 'emerald') { iconContainer.classList.add('bg-emerald-50'); iconColorClass = "text-emerald-500"; }
            else if(theme === 'rose') { iconContainer.classList.add('bg-rose-50'); iconColorClass = "text-rose-500"; }
            else if(theme === 'amber') { iconContainer.classList.add('bg-amber-50'); iconColorClass = "text-amber-500"; }
            else { iconContainer.classList.add('bg-brand-50'); iconColorClass = "text-brand-500"; }

            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('alertIcon').innerHTML = `<i data-lucide="${icon}" class="w-8 h-8 ${iconColorClass}"></i>`;
            
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        function closeAlert() { 
            const modal = document.getElementById('customAlert');
            modal.querySelector('.bg-white').classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.style.display = 'none'; 
                modal.querySelector('.bg-white').classList.remove('scale-95', 'opacity-0');
            }, 200);
        }

        function exportToCSV() {
            if (rawData.length === 0) {
                showAlert("ไม่พบข้อมูล", "ไม่มีข้อมูลสำหรับการ Export", "file-x", "amber");
                return;
            }
            let csv = "data:text/csv;charset=utf-8,\uFEFFวันเวลา,ชื่อ,ประเภท,สถานที่,บันทึก\n";
            rawData.forEach(d => { 
                const dateObj = new Date(d.Timestamp);
                const dateStr = dateObj.toLocaleString('th-TH');
                const typeStr = d.Type === 'Check In' ? 'เข้างาน' : 'ออกงาน';
                csv += `"${dateStr}","${d.Name || "-"}","${typeStr}","${d.Location || "-"}","${d["WorkSummary/Memo"] || "-"}"\n`; 
            });
            const link = document.createElement("a");
            link.href = encodeURI(csv);
            link.download = `Report_Attendance_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        window.onload = async () => { 
            setupCustomTimePickers();
            setupNameAutocomplete();
            lucide.createIcons(); 
            await loadCurrentConfig(); 
            loadReportData(); 
        };
    </script>
</body>
