<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Business Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f7f6; color: #333; }
        h2 { color: #2c3e50; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: none; border-radius: 5px; background: #e0e0e0; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #007bff; color: white; box-shadow: 0 4px 6px rgba(0,123,255,0.3); }
        .tab-content { display: none; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Table Style */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #f8f9fa; color: #666; font-weight: 600; }
        tr:hover { background-color: #f9f9f9; }
        
        /* Filter Bar */
        .filter-bar { display: flex; flex-wrap: wrap; gap: 15px; background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee; }
        .filter-bar select, .filter-bar input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; flex: 1; min-width: 150px; }
        
        .form-box { max-width: 450px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; }
        .btn-export { background: #28a745; color: white; width: auto; font-weight: bold; cursor: pointer; border: none; padding: 10px 20px; }
        .btn-export:hover { background: #218838; }
        .back-btn { background: #6c757d; color: white; width: auto; cursor: pointer; border: none; margin-bottom: 20px; }
    </style>
</head>
<body>

    <button class="back-btn" onclick="location.href='dashboard.html'">← กลับหน้าหลัก</button>
    <h2>Admin Management System</h2>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab(event, 'userTab')">จัดการผู้ใช้งาน</button>
        <button class="tab-btn" onclick="openTab(event, 'reportTab'); loadReportData();">รายงานเข้า-ออกงาน</button>
        <button class="tab-btn" onclick="openTab(event, 'settingTab')">ตั้งค่าระบบ</button>
    </div>

    <div id="userTab" class="tab-content active">
        <div class="form-box">
            <h3>เพิ่มผู้ใช้งานใหม่</h3>
            <input type="text" id="newU" placeholder="Username">
            <input type="text" id="newP" placeholder="Password">
            <input type="text" id="newN" placeholder="ชื่อ-นามสกุล">
            <select id="newR">
                <option value="User">User (พนักงานทั่วไป)</option>
                <option value="Admin">Admin (ผู้ดูแลระบบ)</option>
            </select>
            <button onclick="handleAddUser()" style="background: #28a745; color: white; font-weight: bold; cursor: pointer;">ยืนยันเพิ่มข้อมูล</button>
        </div>
    </div>

    <div id="reportTab" class="tab-content">
        <h3>รายงานการเข้า-ออกงาน</h3>
        
        <div class="filter-bar">
            <input type="text" id="filterName" placeholder="ค้นหาชื่อพนักงาน..." oninput="applyFilters()">
            
            <select id="filterDateRange" onchange="applyFilters()">
                <option value="all">ทุกช่วงเวลา</option>
                <option value="today">วันนี้</option>
                <option value="week">สัปดาห์นี้</option>
                <option value="month">เดือนนี้</option>
            </select>

            <select id="filterLoc" onchange="applyFilters()">
                <option value="">ทุกสถานที่</option>
                <option value="OFFICE">OFFICE</option>
                <option value="WFH">WFH</option>
                <option value="ON-SITE">ON-SITE</option>
            </select>
            
            <select id="filterType" onchange="applyFilters()">
                <option value="">ทุกประเภท</option>
                <option value="Check In">เข้างาน</option>
                <option value="Check Out">ออกงาน</option>
                <option value="Memo">Memo/สรุปงาน</option>
            </select>

            <button class="btn-export" onclick="exportToCSV()">ส่งออกไฟล์ CSV</button>
        </div>

        <table id="reportTable">
            <thead>
                <tr>
                    <th>วัน/เวลา</th>
                    <th>ชื่อ</th>
                    <th>ประเภท</th>
                    <th>สถานที่</th>
                    <th>Memo (สรุปงาน)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="settingTab" class="tab-content">
        <h3>ตั้งค่าระบบ</h3>
        <div class="form-box">
            <label>เวลาเริ่มงาน:</label>
            <input type="time" id="startTime" value="09:00">
            <label>เวลาเลิกงาน:</label>
            <input type="time" id="endTime" value="18:00">
            <button onclick="alert('บันทึกการตั้งค่าแล้ว')" style="background: #007bff; color: white;">บันทึกค่าพื้นฐาน</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzehwXrrfuioHK68BXQGLpKyBPM5ElXZKgRm0o55yzwXgtx_YGkItjkM090zceA_t7Jcg/exec";
        let rawData = []; 

        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (evt) evt.currentTarget.classList.add('active');
        }

        async function loadReportData() {
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>กำลังโหลดข้อมูล...</td></tr>";
            
            try {
                const response = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: "fetchData" }) 
                });
                rawData = await response.json();
                applyFilters();
            } catch (error) {
                console.error(error);
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>ไม่สามารถโหลดข้อมูลได้</td></tr>";
            }
        }

        function applyFilters() {
            const nameF = document.getElementById('filterName').value.toLowerCase();
            const locF = document.getElementById('filterLoc').value;
            const typeF = document.getElementById('filterType').value;
            const dateRangeF = document.getElementById('filterDateRange').value;

            // ตั้งค่าวันที่เพื่อเปรียบเทียบ
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            const startOfWeek = new Date(startOfToday);
            startOfWeek.setDate(startOfToday.getDate() - startOfToday.getDay()); // เริ่มวันอาทิตย์

            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

            const filtered = rawData.filter(d => {
                // เช็คเงื่อนไขวันที่
                const itemDate = new Date(d.Timestamp);
                let dateMatch = true;
                if (dateRangeF === "today") dateMatch = itemDate >= startOfToday;
                else if (dateRangeF === "week") dateMatch = itemDate >= startOfWeek;
                else if (dateRangeF === "month") dateMatch = itemDate >= startOfMonth;

                const nameMatch = (d.Name || "").toLowerCase().includes(nameF);
                const locMatch = locF === "" || (d["Location"] || "") === locF;
                const typeMatch = typeF === "" || (d.Type || "") === typeF;
                
                return dateMatch && nameMatch && locMatch && typeMatch;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>ไม่พบข้อมูล</td></tr>";
                return;
            }

            data.forEach(d => {
                let row = tbody.insertRow();
                row.insertCell(0).innerText = d.Timestamp || "-";
                row.insertCell(1).innerText = d.Name || "-";
                row.insertCell(2).innerText = d.Type || "-";
                row.insertCell(3).innerText = d["Location"] || "-";
                
                let memoCell = row.insertCell(4);
                let fullMemo = d["WorkSummary/Memo"] || "-"; 
                memoCell.innerText = fullMemo.length > 30 ? fullMemo.substring(0, 30) + "..." : fullMemo;
                memoCell.style.cursor = "pointer";
                memoCell.onclick = () => alert("บันทึกงานฉบับเต็ม:\n" + fullMemo);
            });
        }

        function exportToCSV() {
            if (rawData.length === 0) return alert("ไม่มีข้อมูล");
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "วันเวลา,ชื่อ,ประเภท,สถานที่,Memo\n";
            
            // ใช้ข้อมูลที่ Filter แล้วในการ Export
            const nameF = document.getElementById('filterName').value.toLowerCase();
            const locF = document.getElementById('filterLoc').value;
            const typeF = document.getElementById('filterType').value;
            const dateRangeF = document.getElementById('filterDateRange').value;
            
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startOfWeek = new Date(startOfToday);
            startOfWeek.setDate(startOfToday.getDate() - startOfToday.getDay());
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

            rawData.filter(d => {
                const itemDate = new Date(d.Timestamp);
                let dateMatch = true;
                if (dateRangeF === "today") dateMatch = itemDate >= startOfToday;
                else if (dateRangeF === "week") dateMatch = itemDate >= startOfWeek;
                else if (dateRangeF === "month") dateMatch = itemDate >= startOfMonth;
                return dateMatch && (d.Name || "").toLowerCase().includes(nameF) && (locF === "" || d["Location"] === locF) && (typeF === "" || d.Type === typeF);
            }).forEach(d => {
                csvContent += `"${d.Timestamp}","${d.Name}","${d.Type}","${d["Location"] || "-"}","${d["WorkSummary/Memo"] || "-"}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Report_Admin_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function handleAddUser() {
            const u = document.getElementById('newU').value;
            const p = document.getElementById('newP').value;
            const n = document.getElementById('newN').value;
            const r = document.getElementById('newR').value;
            if (!u || !p || !n) return alert("กรุณากรอกข้อมูลให้ครบ");

            const payload = { action: "addUser", newUsername: u, newPassword: p, newName: n, newRole: r };
            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.status === "added") { alert("เพิ่มสำเร็จ!"); location.reload(); }
            } catch (e) { alert("ล้มเหลว"); }
        }
    </script>
</body>
</html>
