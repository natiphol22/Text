<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel | CubicPlus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3' }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(20, 184, 166, 0.08) 0px, transparent 50%);
            color: #334155; 
            min-height: 100vh; 
        }
        
        /* Modern Glass Card */
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 1); 
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 4px 6px rgba(0,0,0,0.02); 
            border-radius: 2rem;
        }

        /* Modern Input */
        .input-glass {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.01);
            transition: all 0.2s ease-in-out;
        }
        .input-glass:focus-within, .input-glass:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        /* Tabs */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; background: transparent; width: 100%; border: none; padding: 0.75rem 1rem; cursor: pointer; outline: none; }
        
        /* Time Picker (Native) */
        input[type="time"], input[type="month"] {
            font-family: 'Kanit', sans-serif;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
        }
        input[type="time"]::-webkit-calendar-picker-indicator, input[type="month"]::-webkit-calendar-picker-indicator {
            cursor: pointer; opacity: 0.6; transition: 0.2s;
        }
        input[type="time"]::-webkit-calendar-picker-indicator:hover, input[type="month"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
        
        .settings-nav-btn { position: relative; overflow: hidden; border: 1px solid transparent; }
        .settings-nav-btn::before { content: ''; position: absolute; left: 0; top: 15%; bottom: 15%; width: 4px; border-radius: 0 4px 4px 0; background: #6366f1; transform: scaleY(0); transition: transform 0.2s ease; transform-origin: center; }
        .settings-nav-btn.active { background: #fff; color: #4f46e5; border-color: #e2e8f0; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.03); }
        .settings-nav-btn.active::before { transform: scaleY(1); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Table Styling */
        table { border-collapse: separate; border-spacing: 0; }
        th { border-bottom: 2px solid #f1f5f9; }
        tr.table-row { transition: all 0.2s; }
        tr.table-row:hover td { background-color: #f8fafc; }
        td { border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body class="p-4 md:p-8 lg:p-12 font-sans selection:bg-primary-200 selection:text-primary-900">

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxCxgtJBdY2GXJDY90emZyuw6rLP_00-yUBi7YBdLV3SQ5yn6g_8JaJCWHNUj_N036H/exec";
        let rawData = [];

        // 🟢 ดึงชื่ออัจฉริยะแบบตัดคำซ้ำซ้อนทิ้ง (Deduplicate Prefix Names)
        function populateSmartNameFilter() {
            const select = document.getElementById('filterName');
            
            // 1. ดึงชื่อทั้งหมดที่ไม่ว่างเปล่า และตัดช่องว่างหน้าหลัง
            let allNames = [...new Set(rawData.map(d => (d.Name || "").trim()).filter(Boolean))];
            
            // 2. ระบบ AI กรองชื่อที่ซ้ำซ้อน (ถ้ามี "เนติพล" และ "เนติพล ชาญชนะโรจน์" จะลบ "เนติพล" ทิ้ง)
            let smartNames = allNames.filter(name => {
                // เก็บชื่อไว้ ถ้าไม่มีชื่อไหนเลยที่ 'ยาวกว่า' และ 'ขึ้นต้นด้วยชื่อนี้'
                return !allNames.some(otherName => otherName !== name && otherName.startsWith(name) && otherName.length > name.length);
            });

            // 3. เรียงลำดับตัวอักษร
            smartNames.sort();

            // 4. สร้าง Option
            let html = '<option value="">ทั้งหมด (All Staff)</option>';
            smartNames.forEach(n => {
                html += `<option value="${n}">${n}</option>`;
            });
            select.innerHTML = html;
        }

        // 🟢 ฟังก์ชันเคลียร์วันที่ให้แสดงทั้งหมด
        function resetMonthFilter() {
            document.getElementById('filterMonth').value = '';
            applyFilters();
        }

        // 🟢 โหลด Config เวลาเข้างาน (ใช้ <input type="time"> แก้ปัญหาบันทึกไม่ได้ 100%)
        async function loadCurrentConfig() {
            let start = "09:00"; 
            let end = "18:00";
            
            try {
                const response = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: "fetchConfig" }) 
                });
                const textResult = await response.text(); 
                if(textResult) {
                    const config = JSON.parse(textResult);
                    if (config.StartTime) start = config.StartTime;
                    if (config.EndTime) end = config.EndTime;
                }
            } catch (e) { 
                console.warn("ไม่สามารถดึงข้อมูล Config ได้ ระบบจะใช้ค่าเริ่มต้นแทน");
            } finally {
                document.getElementById('curStart').innerText = start;
                document.getElementById('curEnd').innerText = end;

                // ใส่ค่าให้ Native Time Input
                document.getElementById('startTime').value = start;
                document.getElementById('endTime').value = end;
            }
        }

        async function loadReportData() {
            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "fetchData" }) });
                rawData = await resp.json();
                
                // หลังจากโหลดข้อมูลเสร็จ ให้สร้าง Dropdown ชื่อ
                populateSmartNameFilter();
                
                applyFilters();
            } catch (e) { 
                showAlert("แจ้งเตือน", "ไม่สามารถเชื่อมต่อฐานข้อมูลได้", "wifi-off", "rose"); 
                renderTable([]);
            }
        }

        // --- Render ตาราง ---
        function renderTable(data) {
            const tbody = document.querySelector("#reportTable tbody");
            const policyStart = document.getElementById('curStart').innerText || "09:00";
            
            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='6' class='py-24 text-center text-slate-400'><div class='flex flex-col items-center gap-3'><div class='w-16 h-16 bg-slate-50 border border-slate-100 rounded-full flex items-center justify-center mb-2'><i data-lucide='inbox' class='w-8 h-8 text-slate-300'></i></div><span class='font-medium'>ไม่พบข้อมูลตามเงื่อนไขที่เลือก</span></div></td></tr>";
                lucide.createIcons();
                return;
            }
            
            let htmlContent = "";
            data.forEach(d => {
                const dateObj = new Date(d.Timestamp);
                const timeStr = dateObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                
                const isLate = (d.Type === 'Check In' && timeStr > policyStart);
                const typeStyle = d.Type === 'Check In' 
                    ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' 
                    : 'bg-slate-100 text-slate-500 border border-slate-200';
                
                let statusBadge = '<span class="text-slate-300">-</span>';
                if (d.Type === 'Check In') {
                    if (isLate) {
                        statusBadge = `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-rose-50 text-rose-600 text-[11px] font-bold border border-rose-100 shadow-sm"><div class="w-1.5 h-1.5 rounded-full bg-rose-500"></div> สาย</span>`;
                    } else {
                        statusBadge = `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-emerald-50 text-emerald-600 text-[11px] font-bold border border-emerald-100 shadow-sm"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div> ปกติ</span>`;
                    }
                }

                htmlContent += `
                    <tr class="table-row group">
                        <td class="py-4 px-6 text-sm whitespace-nowrap">
                            <div class="font-bold text-slate-700">${timeStr} <span class="text-xs font-normal text-slate-400 ml-1">น.</span></div>
                            <div class="text-[11px] text-slate-500 font-medium">${dateStr}</div>
                        </td>
                        <td class="py-4 px-6 whitespace-nowrap">
                            <div class="font-semibold text-slate-700 flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary-100 to-primary-50 border border-primary-200 text-primary-600 flex items-center justify-center text-sm font-bold shadow-sm">${(d.Name || "U").charAt(0)}</div>
                                ${d.Name || "-"}
                            </div>
                        </td>
                        <td class="py-4 px-6 whitespace-nowrap">
                            <span class="inline-flex items-center px-3 py-1 rounded-lg text-xs font-bold ${typeStyle}">
                                ${d.Type === 'Check In' ? 'เข้างาน' : 'ออกงาน'}
                            </span>
                        </td>
                        <td class="py-4 px-6 text-sm font-semibold text-slate-500 whitespace-nowrap">
                            <div class="flex items-center gap-2"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-primary-400"></i> ${d.Location || "-"}</div>
                        </td>
                        <td class="py-4 px-6 whitespace-nowrap text-center">
                            ${statusBadge}
                        </td>
                        <td class="py-4 px-6 text-center whitespace-nowrap">
                            <button onclick="showAlert('รายละเอียดบันทึก', '${d["WorkSummary/Memo"] || "ไม่มีบันทึกหมายเหตุเพิ่มเติม"}', 'file-text', 'primary')" class="p-2.5 rounded-xl text-slate-400 hover:text-primary-600 hover:bg-primary-50 transition-all opacity-60 group-hover:opacity-100 border border-transparent hover:border-primary-100">
                                <i data-lucide="eye" class="w-4 h-4 mx-auto"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = htmlContent;
            lucide.createIcons();
        }

        // 🟢 บันทึกการตั้งค่าเวลา 
        async function saveSettings() {
            // ดึงค่าจาก input type="time" โดยตรง
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            
            if(!start || !end) {
                showAlert("ข้อมูลไม่ครบ", "กรุณาเลือกเวลาให้ครบทั้งเริ่มงานและเลิกงาน", "alert-circle", "amber");
                return;
            }

            const btn = document.getElementById('saveConfigBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true; 
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> ระบบกำลังบันทึก...`;
            lucide.createIcons();

            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "saveConfig", startTime: start, endTime: end }) });
                const res = await resp.json();
                if (res.status === "success") {
                    showAlert("บันทึกสำเร็จ", "ระบบได้อัปเดตเกณฑ์เวลาเรียบร้อยแล้ว การเปลี่ยนแปลงจะมีผลทันที", "check-circle-2", "emerald");
                    await loadCurrentConfig(); 
                    applyFilters();
                }
            } catch (e) { showAlert("ล้มเหลว", "เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้ง", "x-octagon", "rose"); }
            finally { 
                btn.disabled = false; 
                btn.innerHTML = originalText; 
                lucide.createIcons();
            }
        }

        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
            lucide.createIcons();
        }

        function openSettingSection(evt, sectionId) {
            document.querySelectorAll('.setting-section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.settings-nav-btn').forEach(b => {
                b.classList.remove('active');
                const iconWrap = b.querySelector('.icon-wrapper');
                iconWrap.classList.remove('bg-primary-50', 'text-primary-600');
                iconWrap.classList.add('bg-slate-100', 'text-slate-500');
            });
            document.getElementById(sectionId).classList.remove('hidden');
            evt.currentTarget.classList.add('active');
            const activeIconWrap = evt.currentTarget.querySelector('.icon-wrapper');
            activeIconWrap.classList.add('bg-primary-50', 'text-primary-600');
            activeIconWrap.classList.remove('bg-slate-100', 'text-slate-500');
            lucide.createIcons();
        }

        // 🟢 อัปเดตฟังก์ชันกรองข้อมูล ให้รองรับปฏิทิน
        function applyFilters() {
            const nameF = document.getElementById('filterName').value.toLowerCase();
            const locF = document.getElementById('filterLoc').value;
            const typeF = document.getElementById('filterType').value;
            const monthF = document.getElementById('filterMonth').value; // คืนค่าเป็น YYYY-MM

            const filtered = rawData.filter(d => {
                const itemDate = new Date(d.Timestamp);
                
                // กรองปฏิทินเดือน (YYYY-MM)
                let dateMatch = true;
                if (monthF) {
                    const [year, month] = monthF.split('-');
                    dateMatch = itemDate.getFullYear() === parseInt(year) && (itemDate.getMonth() + 1) === parseInt(month);
                }

                // หากเลือก "เนติพล ชาญชนะโรจน์" เราตรวจจับว่า includes หรือไม่
                const nameMatch = (d.Name || "").toLowerCase().includes(nameF);
                const locMatch = !locF || d.Location === locF;
                const typeMatch = !typeF || d.Type === typeF;
                
                return dateMatch && nameMatch && locMatch && typeMatch;
            });
            
            renderTable(filtered);
        }

        async function handleAddUser() {
            const u = document.getElementById('newU').value, p = document.getElementById('newP').value, n = document.getElementById('newN').value, r = document.getElementById('newR').value;
            if (!u || !p || !n) return showAlert("ข้อมูลไม่ครบถ้วน", "กรุณาระบุข้อมูลพนักงานให้ครบทุกช่องก่อนกดยืนยัน", "alert-circle", "amber");
            
            const btn = document.getElementById('addBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังสร้างบัญชี...`;
            lucide.createIcons();

            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "addUser", newUsername: u, newPassword: p, newName: n, newRole: r }) });
                const res = await resp.json();
                if (res.status === "added") {
                    showAlert("ลงทะเบียนเรียบร้อย", `เพิ่มบัญชีคุณ ${n} เข้าสู่ระบบสำเร็จแล้ว`, "user-check", "primary");
                    document.getElementById('newU').value = ''; document.getElementById('newP').value = ''; document.getElementById('newN').value = '';
                }
            } catch (e) { showAlert("ผิดพลาด", "ไม่สามารถส่งข้อมูลไปที่เซิร์ฟเวอร์ได้", "server-crash", "rose"); }
            finally { 
                btn.disabled = false; 
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        }

        function showAlert(title, msg, icon = "info", theme = "primary") {
            const modal = document.getElementById('customAlert');
            const iconContainer = document.getElementById('alertIconContainer');
            
            iconContainer.className = `w-16 h-16 rounded-[1.25rem] flex items-center justify-center mx-auto mb-6 rotate-3 shadow-sm border`;
            let iconColorClass = "text-slate-500";
            
            if(theme === 'emerald') { iconContainer.classList.add('bg-emerald-50', 'border-emerald-100'); iconColorClass = "text-emerald-500"; }
            else if(theme === 'rose') { iconContainer.classList.add('bg-rose-50', 'border-rose-100'); iconColorClass = "text-rose-500"; }
            else if(theme === 'amber') { iconContainer.classList.add('bg-amber-50', 'border-amber-100'); iconColorClass = "text-amber-500"; }
            else { iconContainer.classList.add('bg-primary-50', 'border-primary-100'); iconColorClass = "text-primary-600"; }

            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('alertIcon').innerHTML = `<i data-lucide="${icon}" class="w-8 h-8 ${iconColorClass}"></i>`;
            
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        function closeAlert() { 
            const modal = document.getElementById('customAlert');
            modal.querySelector('.bg-white').classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.style.display = 'none'; 
                modal.querySelector('.bg-white').classList.remove('scale-95', 'opacity-0');
            }, 200); 
        }

        function exportToCSV() {
            if (rawData.length === 0) {
                showAlert("ไม่พบข้อมูล", "ไม่มีข้อมูลสำหรับการดาวน์โหลด", "file-x", "amber");
                return;
            }
            const policyStart = document.getElementById('curStart').innerText || "09:00";
            let csv = "data:text/csv;charset=utf-8,\uFEFFวันเวลา,ชื่อ,ประเภท,สถานที่,สถานะ,บันทึก\n";
            
            const tableRows = document.querySelectorAll("#reportTable tbody tr");
            
            tableRows.forEach(row => {
                if (row.cells.length > 1) { 
                    const timeCell = row.cells[0].innerText.replace('น.', '').replace(/\n/g, ' ').trim();
                    const nameCell = row.cells[1].innerText.trim();
                    const typeCell = row.cells[2].innerText.trim();
                    const locCell = row.cells[3].innerText.trim();
                    const statusCell = row.cells[4].innerText.trim();
                    const memoMatch = row.cells[5].innerHTML.match(/showAlert\('.*?',\s*'(.*?)'/);
                    const memoCell = memoMatch ? memoMatch[1] : "-";

                    csv += `"${timeCell}","${nameCell}","${typeCell}","${locCell}","${statusCell}","${memoCell}"\n`; 
                }
            });
            
            const link = document.createElement("a");
            link.href = encodeURI(csv);
            link.download = `CubicPlus_Report_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // ตั้งค่าเริ่มต้นของปฏิทินให้เป็นเดือนปัจจุบัน
        function setDefaultMonth() {
            const now = new Date();
            const y = now.getFullYear();
            const m = (now.getMonth() + 1).toString().padStart(2, '0');
            document.getElementById('filterMonth').value = `${y}-${m}`;
        }

        window.onload = () => { 
            setDefaultMonth(); // เซ็ตเดือนปัจจุบัน
            lucide.createIcons(); 
            
            document.getElementById('curStart').innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin inline"></i>`;
            document.getElementById('curEnd').innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin inline"></i>`;
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "<tr><td colspan='6' class='py-20 text-center text-slate-400'><div class='flex flex-col items-center gap-3'><i data-lucide='loader-2' class='w-8 h-8 animate-spin text-primary-500'></i><span class='text-sm font-medium'>กำลังดึงข้อมูล...</span></div></td></tr>";
            lucide.createIcons();

            Promise.all([
                loadCurrentConfig(),
                loadReportData()
            ]).then(() => {
                applyFilters(); 
            });
        };
    </script>
