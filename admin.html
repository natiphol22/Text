<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel | CubicPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #fcfdfe; color: #334155; min-height: 100vh; overflow-x: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.03); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.4s ease-out; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.1); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }

        input, select { transition: all 0.2s ease; }
        input:focus, select:focus { border-color: #6366f1 !important; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); outline: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="customAlert" class="modal">
        <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-10 text-center shadow-2xl">
            <div id="alertIcon" class="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle" class="w-10 h-10"></i>
            </div>
            <h3 id="alertTitle" class="text-xl font-bold text-slate-800 mb-2">Notice</h3>
            <p id="alertMsg" class="text-slate-500 text-sm mb-8 leading-relaxed whitespace-pre-line"></p>
            <button onclick="closeAlert()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-xs uppercase tracking-widest active:scale-95 transition-all">CLOSE</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto space-y-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 px-2">
            <div>
                <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Admin Console</h2>
                <p class="text-indigo-500 font-bold text-[10px] uppercase tracking-[0.3em] mt-1">Advanced Control Panel</p>
            </div>
            <button onclick="location.href='index.html'" class="flex items-center gap-2 px-6 py-3 bg-white border border-slate-100 rounded-2xl text-slate-500 font-bold text-xs uppercase tracking-widest hover:text-indigo-600 shadow-sm transition-all active:scale-95">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
            </button>
        </div>

        <div class="flex gap-2 p-1.5 bg-slate-100/50 rounded-[2rem] w-fit">
            <button id="tabReport" class="tab-btn active px-8 py-3 rounded-[1.5rem] text-xs font-bold uppercase tracking-widest transition-all text-slate-400 [&.active]:bg-white [&.active]:text-indigo-600 [&.active]:shadow-sm" onclick="openTab(event, 'reportTab'); loadReportData();">Reports</button>
            <button id="tabSetting" class="tab-btn px-8 py-3 rounded-[1.5rem] text-xs font-bold uppercase tracking-widest transition-all text-slate-400 [&.active]:bg-white [&.active]:text-indigo-600 [&.active]:shadow-sm" onclick="openTab(event, 'settingTab')">Settings</button>
        </div>

        <div id="reportTab" class="tab-content active">
            <div class="glass-panel rounded-[3rem] overflow-hidden">
                <div class="p-8 border-b border-slate-100 bg-white/50">
                    <div class="flex flex-col lg:flex-row gap-4 justify-between items-end">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Smart Search</label>
                                <input list="nameOptions" id="filterName" oninput="applyFilters()" class="w-full p-3 bg-slate-100/50 border border-transparent rounded-xl text-sm" placeholder="เลือกหรือพิมพ์ชื่อ...">
                                <datalist id="nameOptions"></datalist>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Time Range</label>
                                <select id="filterDateRange" onchange="applyFilters()" class="w-full p-3 bg-slate-100/50 border border-transparent rounded-xl text-sm appearance-none">
                                    <option value="all">ทุกช่วงเวลา</option>
                                    <option value="today">วันนี้</option>
                                    <option value="week">สัปดาห์นี้</option>
                                    <option value="month">เดือนนี้</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Location</label>
                                <select id="filterLoc" onchange="applyFilters()" class="w-full p-3 bg-slate-100/50 border border-transparent rounded-xl text-sm appearance-none">
                                    <option value="">ทุกสถานที่</option>
                                    <option value="OFFICE">OFFICE</option>
                                    <option value="WFH">WFH</option>
                                    <option value="ON-SITE">ON-SITE</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Status</label>
                                <select id="filterType" onchange="applyFilters()" class="w-full p-3 bg-slate-100/50 border border-transparent rounded-xl text-sm appearance-none">
                                    <option value="">ทุกประเภท</option>
                                    <option value="Check In">เข้างาน</option>
                                    <option value="Check Out">ออกงาน</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="exportToCSV()" class="flex items-center gap-2 px-6 py-3.5 bg-emerald-500 text-white rounded-xl font-bold text-[10px] uppercase tracking-widest shadow-lg shadow-emerald-200 active:scale-95 transition-all">
                            <i data-lucide="download" class="w-4 h-4"></i> Export CSV
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table id="reportTable" class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50/30">
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Date / Time</th>
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Staff Name</th>
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Action</th>
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Location</th>
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">Memo</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="settingTab" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="glass-panel rounded-[3rem] p-10">
                    <div class="flex items-center gap-4 mb-10">
                        <div class="p-3 bg-indigo-50 text-indigo-500 rounded-2xl"><i data-lucide="clock" class="w-6 h-6"></i></div>
                        <h3 class="text-xl font-bold text-slate-800">Attendance Settings</h3>
                    </div>
                    <div class="space-y-8">
                        <div class="grid grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Business Start</label>
                                <input type="time" id="startTime" value="09:00" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Business End</label>
                                <input type="time" id="endTime" value="18:00" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl">
                            </div>
                        </div>
                        <button id="saveConfigBtn" onclick="saveSettings()" class="w-full py-5 bg-indigo-600 text-white rounded-[1.8rem] font-bold text-xs uppercase tracking-widest shadow-xl shadow-indigo-100 active:scale-95 transition-all">Save Changes</button>
                    </div>
                </div>

                <div class="glass-panel rounded-[3rem] p-10">
                    <div class="flex items-center gap-4 mb-10">
                        <div class="p-3 bg-emerald-50 text-emerald-500 rounded-2xl"><i data-lucide="user-plus" class="w-6 h-6"></i></div>
                        <h3 class="text-xl font-bold text-slate-800">Staff Registration</h3>
                    </div>
                    <div class="grid grid-cols-1 gap-5">
                        <input type="text" id="newN" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl" placeholder="Full Name (ชื่อ-นามสกุล)">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="newU" class="p-4 bg-slate-50 border border-transparent rounded-2xl" placeholder="Username">
                            <input type="password" id="newP" class="p-4 bg-slate-50 border border-transparent rounded-2xl" placeholder="Password">
                        </div>
                        <select id="newR" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl appearance-none">
                            <option value="User">User (พนักงานทั่วไป)</option>
                            <option value="Admin">Admin (ผู้ดูแลระบบ)</option>
                        </select>
                        <button id="addBtn" onclick="handleAddUser()" class="w-full py-5 bg-slate-900 text-white rounded-[1.8rem] font-bold text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">Register New Staff</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxCxgtJBdY2GXJDY90emZyuw6rLP_00-yUBi7YBdLV3SQ5yn6g_8JaJCWHNUj_N036H/exec";
        let rawData = [];

        // --- UI Pop-up Logic ---
        function showAlert(title, msg, icon = "info", color = "indigo") {
            const modal = document.getElementById('customAlert');
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            const iconBox = document.getElementById('alertIcon');
            iconBox.className = `w-20 h-20 bg-${color}-50 text-${color}-500 rounded-full flex items-center justify-center mx-auto mb-6`;
            iconBox.innerHTML = `<i data-lucide="${icon}" class="w-10 h-10"></i>`;
            lucide.createIcons();
            modal.classList.add('active');
        }

        function closeAlert() { document.getElementById('customAlert').classList.remove('active'); }

        // --- Tab Navigation ---
        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (evt) evt.currentTarget.classList.add('active');
            lucide.createIcons();
        }

        // --- Data Fetching & Filtering ---
        async function loadReportData() {
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "<tr><td colspan='5' class='p-12 text-center text-slate-400 font-medium italic'>Loading report database...</td></tr>";
            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "fetchData" }) });
                rawData = await response.json();
                updateNameDatalist();
                applyFilters();
            } catch (error) {
                showAlert("Error", "ไม่สามารถเชื่อมต่อ Server ได้", "alert-triangle", "red");
            }
        }

        function updateNameDatalist() {
            const list = document.getElementById('nameOptions');
            const uniqueNames = [...new Set(rawData.map(d => d.Name))];
            list.innerHTML = uniqueNames.map(name => `<option value="${name}">`).join('');
        }

        function applyFilters() {
            const nameF = document.getElementById('filterName').value.toLowerCase();
            const locF = document.getElementById('filterLoc').value;
            const typeF = document.getElementById('filterType').value;
            const dateRangeF = document.getElementById('filterDateRange').value;
            
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const filtered = rawData.filter(d => {
                const itemDate = new Date(d.Timestamp);
                let dateMatch = true;
                if (dateRangeF === "today") dateMatch = itemDate >= startOfToday;
                const nameMatch = (d.Name || "").toLowerCase().includes(nameF);
                const locMatch = locF === "" || (d["Location"] || "") === locF;
                const typeMatch = typeF === "" || (d.Type || "") === typeF;
                return dateMatch && nameMatch && locMatch && typeMatch;
            });
            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "";
            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' class='p-12 text-center text-slate-400 italic'>No data found.</td></tr>";
                return;
            }
            data.forEach(d => {
                const typeStyle = d.Type === 'Check In' ? 'text-indigo-500 bg-indigo-50' : 'text-slate-400 bg-slate-50';
                const row = `
                    <tr class="hover:bg-slate-50/50 transition-colors border-b border-slate-50">
                        <td class="p-6 text-[11px] font-medium text-slate-500">${new Date(d.Timestamp).toLocaleString('th-TH')}</td>
                        <td class="p-6 text-sm font-bold text-slate-700">${d.Name || "-"}</td>
                        <td class="p-6"><span class="px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-widest ${typeStyle}">${d.Type || "-"}</span></td>
                        <td class="p-6 text-xs font-bold text-slate-400 tracking-tighter">${d["Location"] || "-"}</td>
                        <td class="p-6 text-center">
                            <button onclick="showAlert('Activity Details', '${d["WorkSummary/Memo"] || "-"}', 'file-text')" class="p-2 hover:bg-indigo-50 rounded-lg transition-all text-indigo-300 hover:text-indigo-600">
                                <i data-lucide="eye" class="w-4 h-4 mx-auto"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
            lucide.createIcons();
        }

        // --- Admin Actions ---
        async function handleAddUser() {
            const u = document.getElementById('newU').value;
            const p = document.getElementById('newP').value;
            const n = document.getElementById('newN').value;
            const r = document.getElementById('newR').value;
            if (!u || !p || !n) return showAlert("Incomplete", "กรุณากรอกข้อมูลพนักงานให้ครบถ้วน", "alert-circle", "orange");
            
            const btn = document.getElementById('addBtn');
            btn.disabled = true; btn.innerText = "REGISTERING...";
            
            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "addUser", newUsername: u, newPassword: p, newName: n, newRole: r }) });
                const result = await response.json();
                if (result.status === "added") {
                    showAlert("Staff Registered", `เพิ่ม ${n} เข้าสู่ระบบเรียบร้อยแล้ว`, "user-check", "emerald");
                    document.getElementById('newU').value = ''; document.getElementById('newP').value = ''; document.getElementById('newN').value = '';
                }
            } catch (e) {
                showAlert("Error", "ล้มเหลวในการส่งข้อมูล", "x-circle", "red");
            } finally {
                btn.disabled = false; btn.innerText = "REGISTER NEW STAFF";
            }
        }

        async function saveSettings() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            const btn = document.getElementById('saveConfigBtn');

            if (!start || !end) return showAlert("Incomplete", "กรุณาระบุเวลาให้ครบถ้วน", "alert-circle", "orange");

            btn.disabled = true; btn.innerText = "SAVING...";

            try {
                const response = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: "saveConfig", startTime: start, endTime: end }) 
                });
                const result = await response.json();
                if (result.status === "success") {
                    showAlert("System Success", "บันทึกเวลาปฏิบัติงานเรียบร้อยแล้ว", "check-circle", "emerald");
                }
            } catch (e) {
                showAlert("Error", "ไม่สามารถบันทึกได้ในขณะนี้", "x-circle", "red");
            } finally {
                btn.disabled = false; btn.innerText = "SAVE CHANGES";
            }
        }

        function exportToCSV() {
            if (rawData.length === 0) return showAlert("Empty", "ไม่มีข้อมูลสำหรับส่งออก", "database");
            let csv = "data:text/csv;charset=utf-8,\uFEFFวันเวลา,ชื่อ,ประเภท,สถานที่,Memo\n";
            rawData.forEach(d => { csv += `"${d.Timestamp}","${d.Name}","${d.Type}","${d["Location"] || "-"}","${d["WorkSummary/Memo"] || "-"}"\n`; });
            const link = document.createElement("a");
            link.href = encodeURI(csv);
            link.download = `CubicPlus_Report_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        window.onload = () => { lucide.createIcons(); loadReportData(); };
    </script>
</body>
</html>
