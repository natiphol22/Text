<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel | CubicPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #fcfdfe; color: #334155; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.03); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.4s ease-out; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        input, select { transition: all 0.2s ease; }
        input:focus, select:focus { border-color: #6366f1 !important; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); outline: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto space-y-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 px-2">
            <div>
                <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Admin Console</h2>
                <p class="text-indigo-500 font-bold text-[10px] uppercase tracking-[0.3em] mt-1">System Management</p>
            </div>
            <button onclick="location.href='dashboard.html'" class="flex items-center gap-2 px-6 py-3 bg-white border border-slate-100 rounded-2xl text-slate-500 font-bold text-xs uppercase tracking-widest hover:text-indigo-600 shadow-sm transition-all active:scale-95">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
            </button>
        </div>

        <div class="flex gap-2 p-1.5 bg-slate-100/50 rounded-[2rem] w-fit">
            <button class="tab-btn active px-6 py-3 rounded-[1.5rem] text-xs font-bold uppercase tracking-widest transition-all text-slate-400 [&.active]:bg-white [&.active]:text-indigo-600 [&.active]:shadow-sm" onclick="openTab(event, 'userTab')">Users</button>
            <button class="tab-btn px-6 py-3 rounded-[1.5rem] text-xs font-bold uppercase tracking-widest transition-all text-slate-400 [&.active]:bg-white [&.active]:text-indigo-600 [&.active]:shadow-sm" onclick="openTab(event, 'reportTab'); loadReportData();">Reports</button>
            <button class="tab-btn px-6 py-3 rounded-[1.5rem] text-xs font-bold uppercase tracking-widest transition-all text-slate-400 [&.active]:bg-white [&.active]:text-indigo-600 [&.active]:shadow-sm" onclick="openTab(event, 'settingTab')">Settings</button>
        </div>

        <div id="userTab" class="tab-content active">
            <div class="glass-panel rounded-[3rem] p-8 md:p-12 max-w-2xl">
                <div class="flex items-center gap-4 mb-8">
                    <div class="p-3 bg-emerald-50 text-emerald-500 rounded-2xl"><i data-lucide="user-plus" class="w-6 h-6"></i></div>
                    <h3 class="text-xl font-bold text-slate-800">เพิ่มผู้ใช้งานใหม่</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Username</label>
                        <input type="text" id="newU" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white" placeholder="Enter username">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Password</label>
                        <input type="password" id="newP" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white" placeholder="••••••••">
                    </div>
                    <div class="md:col-span-2 space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Full Name</label>
                        <input type="text" id="newN" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white" placeholder="ชื่อ-นามสกุล">
                    </div>
                    <div class="md:col-span-2 space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">System Role</label>
                        <select id="newR" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl focus:bg-white appearance-none">
                            <option value="User">User (พนักงานทั่วไป)</option>
                            <option value="Admin">Admin (ผู้ดูแลระบบ)</option>
                        </select>
                    </div>
                </div>
                <button onclick="handleAddUser()" class="w-full mt-10 py-5 bg-slate-900 text-white rounded-[1.8rem] font-bold text-xs uppercase tracking-[0.2em] shadow-xl hover:bg-indigo-600 transition-all active:scale-[0.98]">
                    Confirm Add User
                </button>
            </div>
        </div>

        <div id="reportTab" class="tab-content">
            <div class="glass-panel rounded-[3rem] overflow-hidden">
                <div class="p-8 border-b border-slate-100 bg-white/50">
                    <div class="flex flex-col lg:flex-row gap-4 justify-between items-end">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Search Name</label>
                                <input type="text" id="filterName" oninput="applyFilters()" class="w-full p-3 bg-slate-100/50 border border-transparent rounded-xl text-sm" placeholder="ค้นหาชื่อ...">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Time Range</label>
                                <select id="filterDateRange" onchange="applyFilters()" class="w-full p-3 bg-slate-100/50 border border-transparent rounded-xl text-sm">
                                    <option value="all">ทุกช่วงเวลา</option>
                                    <option value="today">วันนี้</option>
                                    <option value="week">สัปดาห์นี้</option>
                                    <option value="month">เดือนนี้</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Location</label>
                                <select id="filterLoc" onchange="applyFilters()" class="w-full p-3 bg-slate-100/50 border border-transparent rounded-xl text-sm">
                                    <option value="">ทุกสถานที่</option>
                                    <option value="OFFICE">OFFICE</option>
                                    <option value="WFH">WFH</option>
                                    <option value="ON-SITE">ON-SITE</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Type</label>
                                <select id="filterType" onchange="applyFilters()" class="w-full p-3 bg-slate-100/50 border border-transparent rounded-xl text-sm">
                                    <option value="">ทุกประเภท</option>
                                    <option value="Check In">เข้างาน</option>
                                    <option value="Check Out">ออกงาน</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="exportToCSV()" class="flex items-center gap-2 px-6 py-3.5 bg-emerald-500 text-white rounded-xl font-bold text-[10px] uppercase tracking-widest shadow-lg shadow-emerald-200 active:scale-95 transition-all">
                            <i data-lucide="download" class="w-4 h-4"></i> Export CSV
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table id="reportTable" class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50/50">
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Date / Time</th>
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Name</th>
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Type</th>
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Location</th>
                                <th class="p-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Memo</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="settingTab" class="tab-content">
            <div class="glass-panel rounded-[3rem] p-8 md:p-12 max-w-xl">
                <div class="flex items-center gap-4 mb-8">
                    <div class="p-3 bg-indigo-50 text-indigo-500 rounded-2xl"><i data-lucide="settings" class="w-6 h-6"></i></div>
                    <h3 class="text-xl font-bold text-slate-800">ระบบตั้งค่าเวลา</h3>
                </div>
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">เริ่มงาน</label>
                            <input type="time" id="startTime" value="09:00" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">เลิกงาน</label>
                            <input type="time" id="endTime" value="18:00" class="w-full p-4 bg-slate-50 border border-transparent rounded-2xl">
                        </div>
                    </div>
                    <button onclick="alert('บันทึกค่าแล้ว')" class="w-full py-5 bg-indigo-600 text-white rounded-[1.8rem] font-bold text-xs uppercase tracking-widest shadow-xl shadow-indigo-100 active:scale-95 transition-all">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzehwXrrfuioHK68BXQGLpKyBPM5ElXZKgRm0o55yzwXgtx_YGkItjkM090zceA_t7Jcg/exec";
        let rawData = [];

        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (evt) evt.currentTarget.classList.add('active');
            lucide.createIcons();
        }

        async function loadReportData() {
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "<tr><td colspan='5' class='p-12 text-center text-slate-400 font-medium'>กำลังดึงข้อมูลจาก Cloud...</td></tr>";
            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "fetchData" }) });
                rawData = await response.json();
                applyFilters();
            } catch (error) {
                tbody.innerHTML = "<tr><td colspan='5' class='p-12 text-center text-red-400'>Error: ไม่สามารถเชื่อมต่อฐานข้อมูลได้</td></tr>";
            }
        }

        function applyFilters() {
            const nameF = document.getElementById('filterName').value.toLowerCase();
            const locF = document.getElementById('filterLoc').value;
            const typeF = document.getElementById('filterType').value;
            const dateRangeF = document.getElementById('filterDateRange').value;
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startOfWeek = new Date(startOfToday); startOfWeek.setDate(startOfToday.getDate() - startOfToday.getDay());
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

            const filtered = rawData.filter(d => {
                const itemDate = new Date(d.Timestamp);
                let dateMatch = true;
                if (dateRangeF === "today") dateMatch = itemDate >= startOfToday;
                else if (dateRangeF === "week") dateMatch = itemDate >= startOfWeek;
                else if (dateRangeF === "month") dateMatch = itemDate >= startOfMonth;
                const nameMatch = (d.Name || "").toLowerCase().includes(nameF);
                const locMatch = locF === "" || (d["Location"] || "") === locF;
                const typeMatch = typeF === "" || (d.Type || "") === typeF;
                return dateMatch && nameMatch && locMatch && typeMatch;
            });
            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "";
            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' class='p-12 text-center text-slate-400'>ไม่พบข้อมูลที่ค้นหา</td></tr>";
                return;
            }
            data.forEach(d => {
                const typeColor = d.Type === 'Check In' ? 'text-indigo-500 bg-indigo-50' : 'text-slate-500 bg-slate-50';
                const row = `
                    <tr class="hover:bg-slate-50/50 transition-colors">
                        <td class="p-6 text-xs font-medium text-slate-500">${new Date(d.Timestamp).toLocaleString('th-TH')}</td>
                        <td class="p-6 text-sm font-bold text-slate-700">${d.Name || "-"}</td>
                        <td class="p-6">
                            <span class="px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-widest ${typeColor}">
                                ${d.Type || "-"}
                            </span>
                        </td>
                        <td class="p-6 text-xs font-bold text-slate-400">${d["Location"] || "-"}</td>
                        <td class="p-6">
                            <button onclick="alert('Memo: ${d["WorkSummary/Memo"] || "-"}')" class="text-[10px] font-bold text-indigo-400 underline decoration-indigo-200 underline-offset-4">VIEW</button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        async function handleAddUser() {
            const u = document.getElementById('newU').value;
            const p = document.getElementById('newP').value;
            const n = document.getElementById('newN').value;
            const r = document.getElementById('newR').value;
            if (!u || !p || !n) return alert("กรุณากรอกข้อมูลให้ครบ");
            const btn = event.target;
            btn.disabled = true; btn.innerText = "ADDING...";
            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "addUser", newUsername: u, newPassword: p, newName: n, newRole: r }) });
                const result = await response.json();
                if (result.status === "added") { alert("เพิ่มผู้ใช้งานสำเร็จ!"); location.reload(); }
            } catch (e) { alert("เกิดข้อผิดพลาด"); btn.disabled = false; btn.innerText = "CONFIRM ADD USER"; }
        }

        function exportToCSV() {
            if (rawData.length === 0) return alert("ไม่มีข้อมูลให้ส่งออก");
            let csv = "data:text/csv;charset=utf-8,\uFEFFวันเวลา,ชื่อ,ประเภท,สถานที่,Memo\n";
            rawData.forEach(d => {
                csv += `"${d.Timestamp}","${d.Name}","${d.Type}","${d["Location"] || "-"}","${d["WorkSummary/Memo"] || "-"}"\n`;
            });
            const link = document.createElement("a");
            link.href = encodeURI(csv);
            link.download = `CubicPlus_Report_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
