<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบจัดการหลังบ้าน | CubicPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f8fafc; color: #334155; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* สไตล์หน้า Settings แบบใหม่ */
        .settings-nav-btn.active { background: white; color: #6366f1; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1); }
        .config-card { border-left: 4px solid #6366f1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">ระบบจัดการหลังบ้าน</h1>
            <p class="text-indigo-500 font-bold text-[10px] uppercase tracking-[0.2em] mt-1">CubicPlus Advanced Admin</p>
        </div>
        <button onclick="location.href='index.html'" class="flex items-center gap-2 px-5 py-2.5 bg-white border border-slate-100 rounded-2xl text-slate-500 font-bold text-xs hover:text-indigo-600 transition-all active:scale-95 shadow-sm">
            <i data-lucide="log-out" class="w-4 h-4"></i> ออกจากระบบ
        </button>
    </div>

    <div class="max-w-6xl mx-auto">
        <div class="flex gap-2 p-1.5 bg-slate-200/50 rounded-2xl w-fit mb-8">
            <button class="tab-btn active px-8 py-3 rounded-xl text-xs font-bold transition-all text-slate-500 [&.active]:bg-white [&.active]:text-indigo-600 [&.active]:shadow-sm" onclick="openTab(event, 'reportTab'); loadReportData();">รายงานการเข้างาน</button>
            <button class="tab-btn px-8 py-3 rounded-xl text-xs font-bold transition-all text-slate-500 [&.active]:bg-white [&.active]:text-indigo-600 [&.active]:shadow-sm" onclick="openTab(event, 'settingTab')">ตั้งค่าระบบ</button>
        </div>

        <div id="reportTab" class="tab-content active">
            <div class="glass-panel rounded-[2.5rem] overflow-hidden">
                <div class="p-6 border-b border-slate-50 bg-white/50 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">ค้นหาชื่อ</label>
                        <input list="nameOptions" id="filterName" oninput="applyFilters()" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm focus:ring-2 ring-indigo-100" placeholder="ระบุชื่อพนักงาน...">
                        <datalist id="nameOptions"></datalist>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">เลือกช่วงเวลา</label>
                        <select id="filterDateRange" onchange="applyFilters()" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm focus:ring-2 ring-indigo-100">
                            <option value="all">ทั้งหมด</option>
                            <option value="today">วันนี้</option>
                        </select>
                    </div>
                    <button onclick="loadReportData()" class="p-3 bg-indigo-50 text-indigo-600 rounded-xl hover:bg-indigo-100 transition-all">
                        <i data-lucide="refresh-cw" class="w-5 h-5 mx-auto"></i>
                    </button>
                    <button onclick="exportToCSV()" class="p-3 bg-emerald-500 text-white rounded-xl font-bold text-xs uppercase flex items-center justify-center gap-2 shadow-lg shadow-emerald-100">
                        <i data-lucide="download" class="w-4 h-4"></i> โหลดไฟล์ CSV
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table id="reportTable" class="w-full text-left">
                        <thead>
                            <tr class="bg-slate-50/50 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                <th class="p-6">วัน/เวลา</th>
                                <th class="p-6">ชื่อพนักงาน</th>
                                <th class="p-6">สถานะ</th>
                                <th class="p-6">สถานที่</th>
                                <th class="p-6 text-center">บันทึก</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="settingTab" class="tab-content">
            <div class="flex flex-col md:flex-row gap-8">
                <div class="w-full md:w-64 space-y-2">
                    <button onclick="openSettingSection(event, 'timeConfig')" class="settings-nav-btn active w-full flex items-center gap-3 px-6 py-4 rounded-2xl text-sm font-bold text-slate-500 transition-all">
                        <i data-lucide="clock" class="w-5 h-5"></i> ตั้งค่าเวลาเข้างาน
                    </button>
                    <button onclick="openSettingSection(event, 'staffConfig')" class="settings-nav-btn w-full flex items-center gap-3 px-6 py-4 rounded-2xl text-sm font-bold text-slate-500 transition-all">
                        <i data-lucide="user-plus" class="w-5 h-5"></i> เพิ่มพนักงานใหม่
                    </button>
                </div>

                <div class="flex-1">
                    <div id="timeConfig" class="setting-section block space-y-6">
                        <div class="glass-panel rounded-[2.5rem] p-8 config-card">
                            <h3 class="text-xl font-bold text-slate-800 mb-2">กำหนดเวลาปฏิบัติงาน</h3>
                            <p class="text-slate-400 text-xs mb-8">ตั้งเกณฑ์เวลาเพื่อตรวจสอบการมาสายของพนักงาน</p>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                                <div class="space-y-3">
                                    <label class="text-xs font-bold text-slate-500">เวลาเริ่มงาน (ปัจจุบัน: <span id="curStart" class="text-indigo-600 font-black">-</span>)</label>
                                    <input type="time" id="startTime" class="w-full p-4 bg-slate-100 border-none rounded-2xl text-lg font-bold">
                                </div>
                                <div class="space-y-3">
                                    <label class="text-xs font-bold text-slate-500">เวลาเลิกงาน (ปัจจุบัน: <span id="curEnd" class="text-indigo-600 font-black">-</span>)</label>
                                    <input type="time" id="endTime" class="w-full p-4 bg-slate-100 border-none rounded-2xl text-lg font-bold">
                                </div>
                            </div>
                            <button id="saveConfigBtn" onclick="saveSettings()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm shadow-xl shadow-indigo-100 hover:scale-[1.02] active:scale-95 transition-all">บันทึกเกณฑ์เวลาใหม่</button>
                        </div>
                    </div>

                    <div id="staffConfig" class="setting-section hidden space-y-6">
                        <div class="glass-panel rounded-[2.5rem] p-8">
                            <h3 class="text-xl font-bold text-slate-800 mb-6">ลงทะเบียนพนักงาน</h3>
                            <div class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input type="text" id="newN" class="p-4 bg-slate-100 border-none rounded-2xl text-sm" placeholder="ชื่อ-นามสกุล">
                                    <select id="newR" class="p-4 bg-slate-100 border-none rounded-2xl text-sm">
                                        <option value="User">User (พนักงานทั่วไป)</option>
                                        <option value="Admin">Admin (ผู้ดูแลระบบ)</option>
                                    </select>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input type="text" id="newU" class="p-4 bg-slate-100 border-none rounded-2xl text-sm" placeholder="Username สำหรับเข้าระบบ">
                                    <input type="password" id="newP" class="p-4 bg-slate-100 border-none rounded-2xl text-sm" placeholder="Password">
                                </div>
                                <button id="addBtn" onclick="handleAddUser()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-sm shadow-xl transition-all active:scale-95">เพิ่มพนักงานเข้าสู่ฐานข้อมูล</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="customAlert" class="fixed inset-0 z-[100] hidden bg-slate-900/20 backdrop-blur-md items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-[2rem] p-8 text-center shadow-2xl">
            <div id="alertIcon" class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4"></div>
            <h3 id="alertTitle" class="text-lg font-bold text-slate-800 mb-1"></h3>
            <p id="alertMsg" class="text-slate-500 text-xs mb-6 leading-relaxed"></p>
            <button onclick="closeAlert()" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold text-xs uppercase transition-all active:scale-95">ตกลง</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxCxgtJBdY2GXJDY90emZyuw6rLP_00-yUBi7YBdLV3SQ5yn6g_8JaJCWHNUj_N036H/exec";
        let rawData = [];

        // --- ระบบ Tab หลัก ---
        function openTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
            lucide.createIcons();
        }

        // --- ระบบเมนูย่อยหน้า Settings ---
        function openSettingSection(evt, sectionId) {
            document.querySelectorAll('.setting-section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.settings-nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.remove('hidden');
            evt.currentTarget.classList.add('active');
            lucide.createIcons();
        }

        // --- โหลดข้อมูล Config และแสดงผลเวลาที่บันทึกไว้ ---
        async function loadCurrentConfig() {
            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "fetchConfig" }) });
                const config = await response.json();
                const start = config.StartTime || "09:00";
                const end = config.EndTime || "18:00";
                
                // แสดงผลใน Text
                document.getElementById('curStart').innerText = start;
                document.getElementById('curEnd').innerText = end;
                // ใส่ค่าใน Input เผื่อจะแก้ไข
                document.getElementById('startTime').value = start;
                document.getElementById('endTime').value = end;
            } catch (e) { console.log("Config load failed"); }
        }

        // --- โหลดรายงานการเข้างาน ---
        async function loadReportData() {
            const tbody = document.querySelector("#reportTable tbody");
            tbody.innerHTML = "<tr><td colspan='5' class='p-12 text-center text-slate-300 italic'>กำลังดึงข้อมูล...</td></tr>";
            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "fetchData" }) });
                rawData = await response.json();
                updateNameDatalist();
                applyFilters();
            } catch (error) { showAlert("แจ้งเตือน", "เกิดข้อผิดพลาดในการโหลดข้อมูล", "alert-triangle"); }
        }

        function renderTable(data) {
            const tbody = document.querySelector("#reportTable tbody");
            const policyStart = document.getElementById('curStart').innerText;
            tbody.innerHTML = data.length === 0 ? "<tr><td colspan='5' class='p-12 text-center text-slate-400 italic'>ไม่พบข้อมูล</td></tr>" : "";
            
            data.forEach(d => {
                const dateObj = new Date(d.Timestamp);
                const timeStr = dateObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                let lateTag = (d.Type === 'Check In' && timeStr > policyStart) ? 
                    `<span class="ml-2 px-2 py-0.5 bg-red-50 text-red-500 text-[9px] font-black rounded-md border border-red-100">สาย</span>` : '';

                const typeStyle = d.Type === 'Check In' ? 'text-indigo-600 bg-indigo-50' : 'text-slate-400 bg-slate-50';
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50/50 transition-colors border-b border-slate-50">
                        <td class="p-6 font-medium text-slate-500 text-[11px]">${dateObj.toLocaleString('th-TH')}</td>
                        <td class="p-6 font-bold text-slate-700">${d.Name || "-"}</td>
                        <td class="p-6">
                            <div class="flex items-center">
                                <span class="px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-widest ${typeStyle}">${d.Type || "-"}</span>
                                ${lateTag}
                            </div>
                        </td>
                        <td class="p-6 text-xs text-slate-400">${d["Location"] || "-"}</td>
                        <td class="p-6 text-center text-indigo-300">
                            <button onclick="showAlert('รายละเอียด', '${d["WorkSummary/Memo"] || "-"}', 'file-text')"><i data-lucide="eye" class="w-4 h-4"></i></button>
                        </td>
                    </tr>
                `);
            });
            lucide.createIcons();
        }

        // --- บันทึกค่า Config ใหม่ ---
        async function saveSettings() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            const btn = document.getElementById('saveConfigBtn');
            btn.disabled = true; btn.innerText = "กำลังบันทึก...";
            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "saveConfig", startTime: start, endTime: end }) });
                const res = await resp.json();
                if (res.status === "success") {
                    showAlert("สำเร็จ", "บันทึกเวลาเข้า-ออกงานใหม่เรียบร้อยแล้ว", "check-circle", "emerald");
                    loadCurrentConfig(); // อัปเดตการแสดงผลเวลาในหน้าจอทันที
                }
            } catch (e) { showAlert("ล้มเหลว", "ไม่สามารถบันทึกข้อมูลได้", "x-circle", "red"); }
            finally { btn.disabled = false; btn.innerText = "บันทึกเกณฑ์เวลาใหม่"; }
        }

        // --- (ฟังก์ชันอื่นๆ เหมือนเดิม แต่เปลี่ยนข้อความเป็นภาษาไทย) ---
        function applyFilters() {
            const nameF = document.getElementById('filterName').value.toLowerCase();
            const dateRangeF = document.getElementById('filterDateRange').value;
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const filtered = rawData.filter(d => {
                const itemDate = new Date(d.Timestamp);
                let dateMatch = dateRangeF === "today" ? itemDate >= startOfToday : true;
                const nameMatch = (d.Name || "").toLowerCase().includes(nameF);
                return dateMatch && nameMatch;
            });
            renderTable(filtered);
        }

        function updateNameDatalist() {
            const list = document.getElementById('nameOptions');
            const uniqueNames = [...new Set(rawData.map(d => d.Name))];
            list.innerHTML = uniqueNames.map(name => `<option value="${name}">`).join('');
        }

        async function handleAddUser() {
            const u = document.getElementById('newU').value, p = document.getElementById('newP').value, n = document.getElementById('newN').value, r = document.getElementById('newR').value;
            if (!u || !p || !n) return showAlert("ไม่สมบูรณ์", "กรุณากรอกข้อมูลพนักงานให้ครบ", "alert-circle", "orange");
            const btn = document.getElementById('addBtn');
            btn.disabled = true; btn.innerText = "กำลังดำเนินการ...";
            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: "addUser", newUsername: u, newPassword: p, newName: n, newRole: r }) });
                const res = await resp.json();
                if (res.status === "added") {
                    showAlert("สำเร็จ", `เพิ่ม ${n} เข้าสู่ระบบแล้ว`, "user-check", "emerald");
                    document.getElementById('newU').value = ''; document.getElementById('newP').value = ''; document.getElementById('newN').value = '';
                }
            } catch (e) { showAlert("ผิดพลาด", "ไม่สามารถเพิ่มพนักงานได้", "x-circle", "red"); }
            finally { btn.disabled = false; btn.innerText = "เพิ่มพนักงานเข้าสู่ฐานข้อมูล"; }
        }

        function showAlert(title, msg, icon = "info") {
            const modal = document.getElementById('customAlert');
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('alertIcon').innerHTML = `<i data-lucide="${icon}" class="w-8 h-8"></i>`;
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        function closeAlert() { document.getElementById('customAlert').style.display = 'none'; }

        function exportToCSV() {
            if (rawData.length === 0) return;
            let csv = "data:text/csv;charset=utf-8,\uFEFFวันเวลา,ชื่อ,ประเภท,สถานที่,บันทึก\n";
            rawData.forEach(d => { csv += `"${d.Timestamp}","${d.Name}","${d.Type}","${d["Location"] || "-"}","${d["WorkSummary/Memo"] || "-"}"\n`; });
            const link = document.createElement("a");
            link.href = encodeURI(csv);
            link.download = `Report_Attendance.csv`;
            link.click();
        }

        window.onload = () => { 
            lucide.createIcons(); 
            loadReportData(); 
            loadCurrentConfig(); 
        };
    </script>
</body>
</html>
